saction-costs\">交易成本<\/a>（速度成本）、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>、index、who-pays、todo。<\/li>\n<li>分支判斷：本來想建「高頻交易者」玩家頁，但它和策略頁 <a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a> 內容幾乎重複，改成併進 <a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a> 的「快速版」。一價定律到 2 篇、bps 第二次延後，都因 3 頁上限。<\/li>\n<li>檢查：腳本一次通過。人工檢查發現 <a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a> 的高頻列寫了「論文原話」，對照來源頁確認論文確實直接說成本轉嫁給一般投資人，保留。<\/li>\n<\/ul>\n<h2>2026-11-23 #5 收錄 crypto-arb-2020<\/h2>\n<ul>\n<li>讀：<strong>沒有拿到期刊全文<\/strong>。讀了期刊摘要、作者說明文、2018 年工作論文片段、CFA 摘要。來源頁的「讀了什麼」已標明可信度低一級。<\/li>\n<li>新增：<a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>、<a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>、<a class=\"wl\" href=\"#bps\">bps<\/a>（後兩頁是前幾輪延後的）。<\/li>\n<li>更新：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>（跨國版、資本不足）、<a class=\"wl\" href=\"#retail\">散戶<\/a>（溢價市場的買家）、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>、index、who-pays（加上「五篇看下來的共同點」）、todo（加上你的 OKX–Binance 實驗）。<\/li>\n<li>檢查抓到 3 個版本差異，都寫進來源頁：總利潤 10 億 vs 20 億美元、共同成分 80% vs 85%、韓國溢價「低於 15%」vs「超過 15%」。前兩個是作者不同版本，用期刊版；第三個是二手摘要和作者原文矛盾，用作者原文。<\/li>\n<li>人工檢查：來源頁原本把 <a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a> 列為相關玩家，但內文沒有實質內容支持，拿掉。<\/li>\n<\/ul>\n<h2>2026-11-23 配對交易篇：使用者決定先只上線配對交易，並加入 LTCM 的故事<\/h2>\n<h3>規則變更（使用者要求）<\/h3>\n<ul>\n<li>AGENTS.md 新增「案例」頁類型、圖表（<code>{{figure:名稱}}<\/code>，示意圖必須標明非真實資料）、版本（<code>editions/<\/code>）。check.py 同步更新。<\/li>\n<\/ul>\n<h3>#6 收錄 pairs-decline-2010<\/h3>\n<ul>\n<li>讀：<strong>只有摘要<\/strong>（全文在會員區），來源頁已標明。<\/li>\n<li>新增：<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/li>\n<\/ul>\n<h3>#7 收錄 limits-arbitrage-1997<\/h3>\n<ul>\n<li>讀：期刊全文。<\/li>\n<li>新增：<a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>。<\/li>\n<li>檢查發現：原本以為這篇有談 Royal Dutch／Shell，讀完確認<strong>沒有<\/strong>，只是理論；已在來源頁寫明，和 LTCM 的連結標為 Wiki 推論。<\/li>\n<\/ul>\n<h3>#8 收錄 twin-shares-2009<\/h3>\n<ul>\n<li>讀：全文 PDF。本來想收錄 Froot &amp; Dabora（1999），但 NBER 的 PDF 讀不到文字，只拿到摘要，改收錄這篇（它直接研究雙胞胎股票的套利風險，數字更完整）。Froot &amp; Dabora 只當輔助引用，標明只讀摘要。<\/li>\n<li>新增：<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<\/ul>\n<h3>#9 收錄 ltcm-2006<\/h3>\n<ul>\n<li>讀：MacKenzie 書第 8 章全文，Jorion（2000）只讀摘要。<\/li>\n<li>新增：<a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>、案例 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>、概念 <a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>（4 篇來源）、<a class=\"wl\" href=\"#leverage\">槓桿<\/a>（3 篇來源）。<\/li>\n<li>檢查抓到的矛盾：Royal Dutch 溢價在網路文章裡有 8%、18%、20% 三種說法，LTCM 部位「23 億美元」只出現在二手文章。採用 MacKenzie 的數字（1997 年約 8%，危機中一度超過 17%），23 億美元不採用。<\/li>\n<li>案例頁的「約 19 倍槓桿」是 1,260 ÷ 67 的算術，已標明。<\/li>\n<\/ul>\n<h3>更新<\/h3>\n<ul>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a> 大幅改寫：加上示意圖、數字例子、更好的配對方法、利潤下降表、四種失效情況。<\/li>\n<li>新增導覽頁 <a class=\"wl\" href=\"#pairs-guide\">配對交易導覽：賭雙胞胎會回來<\/a>，作為配對篇首頁。<\/li>\n<li>更新 <a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、index、who-pays、todo。<\/li>\n<\/ul>\n<h3>檢查<\/h3>\n<ul>\n<li>第一次執行 check.py 失敗 11 項：index 漏列 7 頁、log 漏記 4 篇。補上後通過。<\/li>\n<\/ul>\n<h2>2026-11-23 簡報：配對交易篇（slides/pairs-trading）<\/h2>\n<h3>新增工具<\/h3>\n<ul>\n<li><code>tools/check_slides.py<\/code>：檢查簡報每頁的數字能否在引用的 Wiki 頁找到、術語是否先解釋再使用、每頁正文是否超過 200 字。<\/li>\n<\/ul>\n<h3>第 1 次檢查：失敗 7 項<\/h3>\n<ul>\n<li>6 項是術語沒先解釋：放空、平倉、超額報酬、相關性、保證金、bps。寫稿時覺得這些詞「大家都懂」，但目標讀者是完全沒碰過交易的人。→ 在第一次出現的那一頁加上一句白話解釋。<\/li>\n<li>1 項是參考資料頁超過 200 字。→ 判斷這是檢查規則本身不合理（參考資料本來就長），調整檢查器：參考資料頁不算字數。<\/li>\n<\/ul>\n<h3>驗證檢查器本身<\/h3>\n<ul>\n<li>故意把兩個數字改錯（11% 改成 15%、−36% 改成 −46%），檢查器 2 個都抓到。確認數字檢查真的有作用，不是永遠通過。<\/li>\n<\/ul>\n<h3>第 2 次檢查：通過，共 16 頁<\/h3>\n<ul>\n<li>之後加入附錄 3 頁（流程圖、一次實際執行 化出來的）。寫進「什麼時候失效」，總覽表的「在賺誰的錢」寫「無法回答」。<\/li>\n<li>夏普比率模型 3（1.22）高於模型 4（0.73），和作者「模型 4 最好」的結論不一致。<\/li>\n<li>第 3.2 節虛擬碼的修正步驟有筆誤（乘量測值 Y，應乘創新值 I），公式本身正確。<\/li>\n<li>示意圖調整：第一版移動平均和卡爾曼濾波器只差 1 天轉彎，示意效果太弱；改用「從高點回落 1.5」判斷轉彎並調整濾波器參數，變成第 70 天 vs 第 65 天。圖上標明模擬資料。<\/li>\n<\/ul>\n<h2>2026-11-24 簡報：卡爾曼濾波器（slides/kalman-trend）<\/h2>\n<ul>\n<li>第 1 次 check_slides 失敗 2 項：「考 100 分」的 100 在 Wiki 找不到（比喻用的數字）→ 改成「考滿分」；封面標題先出現「卡爾曼濾波器」，第 4 頁才解釋 → 封面副標題直接用一句白話解釋。<\/li>\n<li>檢查器新增 9 個術語：移動平均、卡爾曼濾波器、卡爾曼增益、參數、做多、做空、期貨、回撤、夏普比率；舊簡報重跑仍通過。<\/li>\n<li>驗證檢查器：故意把 39,558 改成 49,558、29% 改成 39%，兩個都抓到。<\/li>\n<li>第 2 次檢查通過，共 15 頁。<\/li>\n<li>build_site.py 改成支援多份簡報，首頁加「所有簡報」清單。<\/li>\n<\/ul>\n<h2>2026-11-24 #11、#12 收錄 kalman-course-2001、kalman-gaussian-2012（使用者上傳）<\/h2>\n<ul>\n<li>使用者說：自己不會卡爾曼濾波器的公式，想真正學會。依分支規則，卡爾曼濾波器只有 1 篇來源不能拆頁，所以先找教材。網路抓取的批准沒有回應，使用者改為直接上傳兩份 PDF。<\/li>\n<li>讀：Welch &amp; Bishop SIGGRAPH 2001 講義（第 2、4 章、第 5.1 節）、Faragher 2012 全文。<\/li>\n<li>用程式重跑講義第 4.3 節的例子（不同隨機雜訊）：R 大 → 平滑但慢；R 小 → 跟著雜訊跳。定性結果和講義一致。<\/li>\n<li>新增：<a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a>、<a class=\"wl\" href=\"#kalman-gaussian-2012\">用兩條鐘形曲線理解卡爾曼濾波器 2012<\/a>、概念頁 <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>（3 篇來源）、拖拉實驗頁 kalman-lab.html。<\/li>\n<li>使用者中途回報程度：常態分布完全陌生；變異數只知道「標準差平方」、不懂期望值、沒有直覺；會矩陣乘法。→ 依學習模式「一次只往上拆一層」，新增前置概念頁 <a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a>（2 篇來源），把 <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a> 的第 1 層改成先指向它，並把 P⁻ = P + Q 連到「獨立相加時變異數相加」。更新 <a class=\"wl\" href=\"#me\">我的程度<\/a>。<\/li>\n<li>新圖：normal-bell、normal-fuse（依公式畫，非隨機資料）。68% 與 95% 用常態分布公式驗算。<\/li>\n<li>檢查第 1 次失敗 3 項：講義來源頁的「扣成本後剩多少」只寫了一句、log 漏記兩篇。→ 補上後通過。<\/li>\n<\/ul>\n<h2>2026-11-25 <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a> 補一段：預測和量測在交易裡各是什麼<\/h2>\n<ul>\n<li>使用者問：交易時「預測的曲線」和「量測的曲線」是什麼？還沒看到價格要怎麼量？→ 找到誤解：以為量測是未來的價格。<\/li>\n<li>新增「套到交易上」一段：週一到週三的時間線、量測為什麼也有一條曲線、「真正水位」只是模型假設、拿來下單的是下一根的預測（核對 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a> 第 11 頁程式碼：Predict[0] 對比 Close[1]）、一個數字的模型給不出方向。<\/li>\n<li>記進 <a class=\"wl\" href=\"#me\">我的程度<\/a> 的「卡住過」。<\/li>\n<li>使用者把表中的「週一」誤以為是下週一 → 表格改用「昨天、今天、明天」，並補一句「已經過去的一天為什麼還要估計」。<\/li>\n<\/ul>\n<h2>2026-11-25 Wiki 支援 LaTeX 公式<\/h2>\n<ul>\n<li>使用者要求公式用 LaTeX 的漂亮排版。→ build_viewer.py 把 <code>$...$<\/code>、<code>$$...$$<\/code> 轉成 MathML（latex2mathml），瀏覽器直接排版，不需要外部字型或程式庫；check.py 檢查 <code>$<\/code> 成對與公式能否轉換；AGENTS.md 加上寫法規則。<\/li>\n<li><a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>：全部公式改寫成 LaTeX，並新增「符號表」（<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><\/msub><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>、上標減號、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> 各是什麼）；矩陣版本補上「價格 + 速度」模型的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><\/mrow><\/math> 實際長相與展開說明。<\/li>\n<li><a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a>：期望值、變異數兩種寫法、標準差、獨立相加、兩條曲線相乘的公式都改成 LaTeX，並逐步代入 A 股票的數字。<\/li>\n<li>順手修正：清單前面沒空行時不會變成清單（python-markdown 的限制），改成產生網站時自動補空行。<\/li>\n<\/ul>\n<h2>2026-11-25 頁面長度上限，卡爾曼濾波器拆成兩頁<\/h2>\n<ul>\n<li>使用者同意：頁面超過 3,000 字就提醒拆。check.py 新增「讀者看到的字數」計算（不算公式指令和 markdown 符號），超過 3,000 字發警告；log、todo、index 除外。AGENTS.md 第 7 節加上拆頁規則。<\/li>\n<li>量測：<a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a> 原本 4,005 字。只拆出矩陣版本仍有約 3,400 字，所以把「套到交易上」一起移到第二頁（它本來就說一個數字的模型給不出方向，要加速度才能交易）。<\/li>\n<li>拆成 <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>（一）直覺與一個數字的版本，2,786 字；<a class=\"wl\" href=\"#kalman-velocity\">卡爾曼濾波器（二）：加入速度與拿來交易<\/a>（二）加入速度與拿來交易，2,641 字。<\/li>\n<li>第二頁新增「手算一步價格 + 速度」：只量價格，速度從 1 被推成 1.28；用 numpy 驗算過。說明關鍵在預測後 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>P<\/mi><mo>&#x02212;<\/mo><\/msup><\/mrow><\/math> 右上角的 0.5 把價格和速度綁在一起。<\/li>\n<\/ul>\n<h2>2026-11-25 維護知識膨脹的六項改進（使用者同意全部試）<\/h2>\n<p>量測起點：37 頁、25 個單向連結、12 對共用 2 篇以上來源卻互不相連、目錄靠手動。<\/p>\n<ul>\n<li><strong>5 搜尋<\/strong>：每頁加 <code>aliases<\/code>（別名），新增 <code>tools/find.py<\/code>；收錄第一步改成先搜尋。<\/li>\n<li><strong>2 相關頁面<\/strong>：32 頁全部重寫成「- [[頁面]]：為什麼相關」，每頁最多 5 條；check.py 檢查條數與格式。<\/li>\n<li><strong>1 自動產生<\/strong>：<code>tools/gen_index.py<\/code> 自動產生目錄；概念頁「出現在哪些來源」必須和 sources 欄位一致；瀏覽頁自動列出「可能相關」。<\/li>\n<li><strong>6 數字只住在來源頁<\/strong>：策略、玩家、案例、總覽頁的數字必須在引用的來源頁找得到。第一次抓到 12 個：章節編號被誤判（排除）、示意例子（標明示意）、真正的問題 1 個（bps 頁「50 bps」是自己換算卻沒標明，已補「Wiki 的算術」）。<\/li>\n<li>測試時發現漏洞：把「約 9%」改成「約 19%」沒被抓到，因為 20 以下的整數全被排除。改成只排除沒帶單位（%、倍、bps、美元…）的小整數，重測後 19% 和「38 億美元」都抓到。<\/li>\n<li><strong>4 熱門頁<\/strong>：被超過 15 頁連到就提醒做導覽頁；<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a> 已有導覽，加上 <code>hub: pairs-guide<\/code>。<\/li>\n<li><strong>7 每週健檢<\/strong>：新增 <code>tools/lint_report.py<\/code>（只讀、只回報），每週日晚上排程執行。第一次執行就抓到 <a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a> 11/24 補過內容卻沒更新日期，已修正；單向連結改成不列連到熱門頁的，剩 10 條留給報告追蹤。<\/li>\n<\/ul>\n<h2>2026-11-25 格式依用途決定；重要推論先討論<\/h2>\n<ul>\n<li>使用者整理了自己對這套做法的理解，討論後新增兩條規則（AGENTS.md 第 5、8 節，knowledge-loop skill 同步提出修改）：<\/li>\n<li>格式依「以後要拿這份知識做什麼」決定；假設與失效兩題通用，賺誰的錢與成本只適用策略；新類型的知識先討論要問哪些問題，再新增頁面類型。<\/li>\n<li>推論不是不准寫，而是要標出來；要放進總覽、導覽頁或簡報的推論，先標「推論，待確認」，列進 <a class=\"wl\" href=\"#todo\">待寫清單<\/a> 給使用者確認。<\/li>\n<li>總覽與導覽頁現有 7 處推論改標「待確認」，整理成 <a class=\"wl\" href=\"#todo\">待寫清單<\/a> 的 6 條待確認清單；check.py 擋下沒標狀態的推論。<\/li>\n<\/ul>", "back": ["pairs-guide"], "maybe": []}, "me": {"title": "我的程度", "type": "overview", "updated": "2026-11-25", "html": "<p>這一頁記錄使用者已經懂什麼、卡在哪裡。<strong>AI 解釋任何新知識之前，都要先讀這一頁<\/strong>（AGENTS.md 第 11 節）。<\/p>\n<ul>\n<li>「已經懂」只有使用者親口確認過的才能放進來。<\/li>\n<li>AI 從對話推測的，一律放在「可能懂」，等使用者確認。<\/li>\n<li>使用者說「太快了」「看不懂」，就把那個概念移到「卡住過」，並記下卡在哪裡。<\/li>\n<\/ul>\n<h2>已經懂（你確認過的）<\/h2>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>確認日期<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>矩陣乘法<\/td>\n<td>2026-11-24<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>可能懂（AI 從對話推測，待確認）<\/h2>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>推測的根據<\/th>\n<th>Wiki 頁<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>z-score 怎麼算、用來做進出場訊號<\/td>\n<td>自己跑過 BTC 價格 z-score 回測<\/td>\n<td>尚無<\/td>\n<\/tr>\n<tr>\n<td>回測切成 train／validation／test<\/td>\n<td>回測報告都有這樣切<\/td>\n<td>尚無<\/td>\n<\/tr>\n<tr>\n<td>手續費會吃掉策略利潤<\/td>\n<td>問過「方向對了為什麼還虧」<\/td>\n<td><a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a><\/td>\n<\/tr>\n<tr>\n<td>bps（基點）<\/td>\n<td>回測設定裡用過 10 bps 手續費<\/td>\n<td><a class=\"wl\" href=\"#bps\">bps<\/a><\/td>\n<\/tr>\n<tr>\n<td>協整檢定（cointegration）的用途<\/td>\n<td>跑過大型加密貨幣的配對篩選<\/td>\n<td>尚無<\/td>\n<\/tr>\n<tr>\n<td>配對交易的基本做法<\/td>\n<td>這次做了整份配對交易篇<\/td>\n<td><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>卡住過（看不懂的地方）<\/h2>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>卡在哪裡<\/th>\n<th>後來怎麼講才懂<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>變異數<\/td>\n<td>只記得「標準差的平方」，不懂期望值、為什麼要平方，沒有直覺（2026-11-24 自己說的）<\/td>\n<td>新增 <a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a>：用兩檔平均一樣、晃法不同的股票，從「平均」一步步算到變異數；待你回饋<\/td>\n<\/tr>\n<tr>\n<td>常態分布（鐘形曲線）<\/td>\n<td>完全陌生（2026-11-24）<\/td>\n<td>同上，加上鐘形曲線圖和「兩條曲線相乘」圖；待你回饋<\/td>\n<\/tr>\n<tr>\n<td>卡爾曼濾波器的「量測」在交易裡是什麼<\/td>\n<td>以為量測是未來的價格（「我們還沒看到要如何量」，2026-11-25）<\/td>\n<td>用週一到週三的時間線：量測是剛收盤的價格，看不到的是每天去掉雜訊後的「真正水位」；已寫進 <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>，待你回饋<\/td>\n<\/tr>\n<tr>\n<td>Git 協作（branch、fork、PR、GitHub Actions）<\/td>\n<td>自評 Git 初階，聽不懂多人協作的流程（2026-11-25）；決定先不設定<\/td>\n<td>還沒講；之後要學時從「一個人怎麼用 commit 存檔」開始，一次只加一個新詞<\/td>\n<\/tr>\n<tr>\n<td>IC 和 t 值（因子報告）<\/td>\n<td>第一次用術語解釋時說「還是無法明白」<\/td>\n<td>改用「兩家便利商店賣同一瓶水」的比喻，先講「猜對方向」和「賺不賺錢」是兩件事<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>想學的<\/h2>\n<ul>\n<li>\n<p><strong>卡爾曼濾波器的公式<\/strong>（2026-11-24 開始）：目標是「看得懂、也算得出」。學習順序：<a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a> → <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a> → 拖拉實驗頁 → <a class=\"wl\" href=\"#kalman-velocity\">卡爾曼濾波器（二）：加入速度與拿來交易<\/a>（加入速度與矩陣版本；你會矩陣乘法，可以直接讀）。<\/p>\n<\/li>\n<li>\n<p>共整合（cointegration）：配對交易篇想補，Wiki 還沒有來源。<\/p>\n<\/li>\n<li>GARCH、資金費率套利、零佣金時代散戶交易的代價（見 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>）。<\/li>\n<\/ul>\n<h2>解釋方式偏好<\/h2>\n<ul>\n<li><strong>先比喻，再術語<\/strong>：生活裡的例子（買水、換外幣）比公式先講有用。<\/li>\n<li><strong>一次不要塞太多術語<\/strong>：每個新詞第一次出現就要用一句白話解釋。<\/li>\n<li><strong>先講結論，再講細節<\/strong>；講完問「卡在哪一塊」，而不是假設都懂了。<\/li>\n<li>用繁體中文。<\/li>\n<\/ul>", "back": [], "maybe": []}, "pairs-guide": {"title": "配對交易導覽：賭雙胞胎會回來", "type": "overview", "updated": "2026-11-23", "html": "<p>這是「開心的 Quant Wiki」的第一個主題版本。不需要任何交易背景，照下面的順序讀，大約 20 分鐘。<\/p>\n<blockquote>\n<p>核心問題：<strong>交易策略到底在賺誰的錢？<\/strong> 配對交易的答案是：賺「價格暫時走歪」的錢。但當價格走得更歪時，付錢的可能變成你自己。<\/p>\n<\/blockquote>\n<h2>一張圖看懂<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 452\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"配對交易示意圖：上方是兩檔股票的價格，下方是兩者的價差與正負兩個標準差的界線\">\n<rect x=\"427.7\" y=\"26\" width=\"56.2\" height=\"374\" class=\"f-hold\"/>\n<text x=\"56\" y=\"20\" class=\"f-h\">兩檔股票的價格<\/text>\n<path d=\"M56.0,129.9 L59.1,127.8 L62.2,126.8 L65.4,120.8 L68.5,129.3 L71.6,123.3 L74.7,136.3 L77.9,119.6 L81.0,113.5 L84.1,126.4 L87.2,123.7 L90.4,113.3 L93.5,117.7 L96.6,116.4 L99.7,113.4 L102.8,123.2 L106.0,111.3 L109.1,99.8 L112.2,100.1 L115.3,93.3 L118.5,82.1 L121.6,85.2 L124.7,96.7 L127.8,99.9 L131.0,97.4 L134.1,86.6 L137.2,86.2 L140.3,90.9 L143.5,102.2 L146.6,101.2 L149.7,99.1 L152.8,100.9 L155.9,114.0 L159.1,98.8 L162.2,89.6 L165.3,81.7 L168.4,82.6 L171.6,83.3 L174.7,74.1 L177.8,63.0 L180.9,65.1 7.1 L605.7,328.2 L608.8,333.8 L611.9,329.2 L615.1,350.5 L618.2,337.4 L621.3,341.7 L624.4,325.5 L627.6,320.1 L630.7,325.4 L633.8,327.6 L636.9,324.0 L640.1,325.9 L643.2,324.4 L646.3,329.6 L649.4,327.7 L652.5,308.5 L655.7,313.0 L658.8,316.5 L661.9,311.5 L665.0,314.0 L668.2,333.4 L671.3,338.3 L674.4,337.7 L677.5,354.3 L680.7,349.8 L683.8,337.6 L686.9,328.7 L690.0,326.8 L693.2,345.5 L696.3,340.8 L699.4,349.4 L702.5,347.3 L705.6,351.6 L708.8,338.1 L711.9,322.9 L715.0,336.4 L718.1,336.9 L721.3,344.1 L724.4,344.1 L727.5,333.7 L730.6,330.4 L733.8,328.0 L736.9,323.0 L740.0,314.1\" class=\"f-s\"/>\n<circle cx=\"427.7\" cy=\"387.4\" r=\"6\" class=\"f-in\"/>\n<circle cx=\"483.9\" cy=\"317.4\" r=\"6\" class=\"f-out\"/>\n<text x=\"417.7\" y=\"414\" text-anchor=\"end\" class=\"f-lab\">① 跌破 −2σ：買 A、空 B<\/text>\n<text x=\"493.9\" y=\"414\" class=\"f-lab\">② 回到 0：平倉<\/text>\n<text x=\"740\" y=\"448\" text-anchor=\"end\" class=\"f-note\">示意，非真實資料（模擬產生）<\/text>\n<\/svg><\/figure>\n<p>兩檔走勢像雙胞胎的股票，平常差距在一個範圍內晃。差距拉得太開時，買落後的、空領先的；等差距回到原點就平倉。<\/p>\n<h2>閱讀路線<\/h2>\n<p><strong>第 1 站｜它怎麼運作<\/strong>\n<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：一步一步做一次，還有一個數字例子。<\/p>\n<p><strong>第 2 站｜它真的賺錢嗎<\/strong>\n<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>：1962–2002 年美股，前 20 對年化最高約 11%。用隨機配對做對照，確認不是運氣。<\/p>\n<p><strong>第 3 站｜但越來越難賺<\/strong>\n<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>：每月超額報酬從 0.86% 掉到 0.24%。有趣的是，市場恐慌時它反而賺最多。<\/p>\n<p><strong>第 4 站｜最完美的雙胞胎<\/strong>\n<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>：Royal Dutch 和 Shell 本來就是同一家公司，價格卻可以差到 36%；有些套利部位要等將近 9 年。<\/p>\n<p><strong>第 5 站｜LTCM 的故事<\/strong>\n<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：一群最會算的人，用 27 倍槓桿賭 Royal Dutch／Shell 會回來。他們賭對了，價差在 2001 年消失，但他們在 1998 年就倒了。<\/p>\n<p><strong>第 6 站｜為什麼撐不住<\/strong>\n<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：錯價最大、機會最好的時候，套利者反而最沒錢。理論出自 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>。<\/p>\n<h2>四個問題的答案<\/h2>\n<table>\n<thead>\n<tr>\n<th>問題<\/th>\n<th>配對交易的答案<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在賺誰的錢？<\/td>\n<td>把價格暫時推歪的人（推論，待確認）；作者稱為套利者修正價格的報酬<\/td>\n<\/tr>\n<tr>\n<td>靠什麼假設？<\/td>\n<td>兩檔關係穩定，而且你撐得到價差回來<\/td>\n<\/tr>\n<tr>\n<td>什麼時候失效？<\/td>\n<td>做的人變多；公司關係改變；價差先拉得更開而你被迫平倉<\/td>\n<\/tr>\n<tr>\n<td>扣成本後剩多少？<\/td>\n<td>早年每半年仍有 113–225 bps；近年簡單版可能所剩無幾（推論，待確認）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>一句話帶走<\/h2>\n<p><strong>「最後會收斂」和「你撐得到收斂」是兩件事。<\/strong> 配對交易賺的錢，很大一部分是承擔「撐不撐得住」這個風險的報酬。<\/p>\n<h2>想再深入<\/h2>\n<ul>\n<li>概念：<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>、<a class=\"wl\" href=\"#leverage\">槓桿<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>、<a class=\"wl\" href=\"#bps\">bps<\/a>、<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>這一版收錄了哪些資料、怎麼檢查的：<a class=\"wl\" href=\"#log\">收錄紀錄<\/a><\/li>\n<\/ul>", "back": ["pairs-trading"], "maybe": []}, "arbitrageurs": {"title": "套利者", "type": "player", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>專找「同一個東西卻有兩個價格」的人，買便宜的、賣貴的，把價格推回一致。<\/p>\n<h2>他在哪裡賺錢<\/h2>\n<ul>\n<li><strong>慢速版<\/strong>：配對交易，等兩檔像雙胞胎的股票靠回來，持有幾天到幾個月。作者把這份獲利看成「修正價格」的報酬。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>。<\/li>\n<li><strong>快速版<\/strong>：高頻交易者，在幾毫秒內吃掉不同市場間過時的報價。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>。<\/li>\n<li><strong>跨國版<\/strong>：在加密貨幣便宜的國家買、貴的國家賣。2017–2018 年潛在利潤至少 20 億美元，但大部分沒人拿走。見 <a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>、<a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a>。<\/li>\n<\/ul>\n<h2>他在哪裡付錢<\/h2>\n<ul>\n<li><strong>競爭<\/strong>：做的人越多，機會越少或越短。配對交易 1989 年後原始報酬掉到約三分之一；高頻套利則要不斷投資速度。<\/li>\n<li><strong>成本<\/strong>：配對交易要付價差和放空成本；高頻套利要付專線和機房；跨國加密套利要面對資本管制、匯款延遲和交易所風險。<\/li>\n<li><strong>被迫平倉<\/strong>：專業套利者用的是別人的錢。價差拉得更開時，出資人撤資、保證金被追繳，他們只能在最差的價位認賠。見 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>、<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>。<\/li>\n<li><strong>LTCM<\/strong>：1998 年用約 27 倍槓桿做 Royal Dutch／Shell 等價差交易，價差全部同時拉開，最後被 14 家銀行接管。見 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>。<\/li>\n<li><strong>等太久<\/strong>：雙胞胎股票的套利，有些部位要等將近 9 年才收斂。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li><strong>資本不夠<\/strong>：跨國加密價差大到 40% 仍補不平，作者認為是套利資本太少、而且流走後沒有馬上補上。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>：套利者在做的事：把價格推回一致<\/li>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：套利者為什麼常常撐不住<\/li>\n<li><a class=\"wl\" href=\"#market-makers\">做市商<\/a>：高頻套利者狙擊的對象<\/li>\n<li><a class=\"wl\" href=\"#leverage\">槓桿<\/a>：套利者放大報酬、也放大風險的工具<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：慢速版的套利<\/li>\n<\/ul>", "back": ["cross-exchange-arb", "crypto-arb-2020", "law-of-one-price", "limits-arbitrage-1997", "limits-of-arbitrage", "market-makers", "pairs-guide"], "maybe": ["transaction-costs", "retail", "bid-ask-spread"]}, "brokers-exchanges": {"title": "券商與交易所", "type": "player", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>幫你下單、讓買賣雙方碰頭的中間人，不賭漲跌，靠每筆交易收費。<\/p>\n<h2>他在哪裡賺錢<\/h2>\n<ul>\n<li><strong>佣金<\/strong>：每一筆交易都收。1991–1996 年的美國折扣券商，一來一回平均約 3%。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/li>\n<li>交易越頻繁，他們收得越多，所以他們的收入和散戶的換手率直接相關。<\/li>\n<\/ul>\n<h2>他在哪裡付錢<\/h2>\n<p>目前的來源沒有談到。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#retail\">散戶<\/a>：付佣金的一方<\/li>\n<li><a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>：佣金是交易成本的一部分<\/li>\n<li><a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>：佣金吃掉散戶報酬的證據<\/li>\n<\/ul>", "back": ["overtrading-2000", "retail", "transaction-costs", "who-pays"], "maybe": []}, "market-makers": {"title": "做市商", "type": "player", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同時掛出買價和賣價、讓別人隨時能成交的人，靠價差賺錢。<\/p>\n<h2>他在哪裡賺錢<\/h2>\n<p><strong>買賣價差<\/strong>：低價買進、高價賣出，賺中間那段 <a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>。散戶付的價差很可能有一部分流到這裡，但 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a> 沒有直接證明，這是 Wiki 的推論。<\/p>\n<h2>他在哪裡付錢<\/h2>\n<p><strong>被狙擊<\/strong>：市場一動，他的報價瞬間過時，被更快的交易者吃掉。他會把這個預期損失加進價差，轉嫁給所有一般投資人。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>：做市商靠價差賺錢<\/li>\n<li><a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>：做市商的報價被高頻狙擊<\/li>\n<li><a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>：狙擊做市商的人<\/li>\n<li><a class=\"wl\" href=\"#retail\">散戶<\/a>：散戶付的價差可能流到這裡（推論）<\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "hft-latency-arb", "hft-race-2015", "overtrading-2000", "retail", "who-pays"], "maybe": []}, "retail": {"title": "散戶", "type": "player", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>用自己的錢、自己下單的個人投資人，人數最多，但單筆資金最小。<\/p>\n<h2>他在哪裡賺錢<\/h2>\n<p>目前的來源裡，散戶的<strong>毛報酬<\/strong>和大盤差不多，選股本身沒有明顯比較差，見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/p>\n<h2>他在哪裡付錢<\/h2>\n<ul>\n<li><strong>頻繁交易<\/strong>：每次買賣都付佣金和買賣價差，交易越多，淨報酬越低。交易最多的那 20% 家戶每年輸大盤約 6.5 個百分點。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>。<\/li>\n<li>作者認為背後原因是過度自信。<\/li>\n<li><strong>放空比較難<\/strong>：配對交易需要放空，研究指出散戶比大型機構更難借到券。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li><strong>在溢價市場買幣<\/strong>：2017–2018 年韓國的比特幣比美國貴 15% 以上，在那裡買的人等於多付了這段（Wiki 推論）。作者也提到，跨國匯款對散戶來說特別困難，所以散戶很難自己去套這個利。見 <a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a>：散戶付佣金給他們<\/li>\n<li><a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>：散戶落後大盤主要輸在成本<\/li>\n<li><a class=\"wl\" href=\"#market-makers\">做市商<\/a>：散戶付的價差可能流到這裡（推論）<\/li>\n<li><a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>：在溢價市場買幣的散戶<\/li>\n<\/ul>", "back": ["brokers-exchanges", "crypto-arb-2020", "market-makers", "overtrading-2000", "transaction-costs", "who-pays"], "maybe": ["law-of-one-price", "excess-return", "bid-ask-spread", "arbitrageurs"]}, "crypto-arb-2020": {"title": "加密貨幣的交易與套利（Makarov & Schoar 2020）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>比特幣在不同國家的交易所價格可以差到 40%，因為錢搬不過去，套利者也補不平。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>34 家交易所、19 個國家或地區的逐筆成交資料，重點分析最有流動性的 15 家。<\/li>\n<li>幣種：比特幣、以太幣、瑞波幣。<\/li>\n<li>期間：2017 年 1 月到 2018 年 2 月，正好涵蓋比特幣從暴漲到接近 2 萬美元、再回落的那一段。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li>算每家交易所的比特幣價格，和其他交易所比較，看價差多大、維持多久。<\/li>\n<li>分成「同一國內的交易所之間」和「不同國家之間」比較。<\/li>\n<li>比較「用法幣（美元、韓元）報價」和「幣對幣報價」（例如用比特幣買以太幣）的價差。<\/li>\n<li>估算如果有人能完美套利，這段期間總共能賺多少。<\/li>\n<li>把每家交易所的買賣淨量拆成「全市場共同的部分」和「這家獨有的部分」，看它們各自解釋了什麼。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li><strong>韓國溢價<\/strong>：2017 年 12 月到 2018 年 2 月初，美國和韓國的比特幣價格比，每日平均超過 15%，有好幾天到 40%（媒體稱為「泡菜溢價」）。<\/li>\n<li><strong>國內 vs 跨國<\/strong>：同一國內不同交易所的價差平均通常不超過 1%；跨國價差大得多。<\/li>\n<li><strong>幣對幣<\/strong>：同一家交易所裡，幣對幣的價差比法幣報價的價差小一個數量級。<\/li>\n<li><strong>錢留在桌上<\/strong>：作者估計這段期間至少有 20 億美元的潛在套利利潤沒被拿走（這是期刊版的說法；2018 年的工作論文寫的是至少 10 億美元）。<\/li>\n<li><strong>價差和行情一起動<\/strong>：比特幣大漲時，各國的價差一起張開。<\/li>\n<li><strong>買賣量<\/strong>：全市場共同的買賣壓力解釋了比特幣約 80% 的報酬（期刊摘要；2018 年工作論文寫 85%）；各交易所獨有的買賣壓力則幫忙解釋了交易所之間的價差。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>如果套利者能進場，賺的是<strong>在溢價市場買幣的人<\/strong>的錢。例如在韓國用高 15% 以上的價格買比特幣的投資人，套利者在美國買、在韓國賣，賺的就是這段差距。這是 Wiki 根據價差方向的推論。<\/p>\n<p>作者說的是：美歐以外的市場，比特幣幾乎總是溢價、很少折價。作者猜測那裡的投資人在好消息出現時更願意多付錢，可能因為當地金融體系較弱或資本管制較嚴，加密貨幣對他們更有用。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>套利要成立，<strong>資金必須能跨國流動<\/strong>：在美國用美元買幣，運到韓國賣成韓元，再把韓元換回美元搬回美國。最後一步卡住，整個套利就做不起來。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>資本管制<\/strong>：法幣跨國匯款受限，套利者賺到的韓元搬不回來。這解釋了為什麼國內價差小、跨國價差大，也解釋了為什麼幣對幣價差小（加密貨幣本身很難被管制）。<\/li>\n<li><strong>套利資本不夠<\/strong>：作者認為大型機構理論上能繞過限制，但整體套利資本相對於價差的規模太少，而且流去別處的資本沒有馬上被補上。<\/li>\n<li>作者也提到，交易所被駭或捲款這類風險，可能事前就讓一些套利者不敢進場。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>論文估的是<strong>潛在<\/strong>利潤（至少 20 億美元），也就是假設能完美執行。實際上要扣掉匯款的時間和費用、交易所的手續費、等待區塊確認期間的價格風險，以及資本管制本身造成的障礙。真正拿得到的遠少於這個數字，但論文沒有估算。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文與作者說明文自己說的）<\/strong><\/p>\n<ul>\n<li>34 家交易所、19 個地區、韓國溢價每日平均超過 15% 最高 40%、國內價差通常不超過 1%、幣對幣價差小一個數量級、至少 20 億美元、共同成分解釋約 80% 報酬、資本管制、套利資本不足。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「在賺溢價市場買家的錢」。<\/li>\n<li>「扣成本後遠少於 20 億美元」。<\/li>\n<\/ul>\n<p><strong>版本差異（收錄時抓到的）<\/strong><\/p>\n<ul>\n<li>總利潤：期刊版說明文寫至少 20 億美元，2018 年工作論文與作者簡報寫至少 10 億美元。本頁用期刊版。<\/li>\n<li>共同成分：期刊摘要寫 80%，2018 年工作論文寫 85%。本頁用期刊版。<\/li>\n<li>韓國溢價：CFA Institute 的摘要寫「平均低於 15%」，作者工作論文寫「超過 15%」。本頁採作者原文。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p><strong>沒有讀到期刊全文。<\/strong> 讀了：期刊摘要（EconPapers）、作者在哈佛法學院公司治理論壇的說明文（2019）、2018 年 12 月工作論文的片段、CFA Institute Journal Review 的摘要（2020）。數字以作者自己的文字為準，可信度比其他四篇低一級。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a>：這篇整理成的策略頁<\/li>\n<li><a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>：跨國價差是一價定律被資本管制擋住的例子<\/li>\n<li><a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>：套利資本為什麼補不平價差<\/li>\n<li><a class=\"wl\" href=\"#retail\">散戶<\/a>：散戶很難跨國匯款，自己套利<\/li>\n<\/ul>", "back": ["arbitrageurs", "cross-exchange-arb", "law-of-one-price", "retail", "who-pays"], "maybe": []}, "hft-race-2015": {"title": "高頻交易軍備競賽（Budish, Cramton & Shim 2015）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一個東西在兩個市場報價差一點點，誰最快誰拿走；競爭只讓速度門檻越來越高。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li><strong>ES<\/strong>：芝加哥 CME 的 S&amp;P 500 迷你期貨，逐筆深度行情。<\/li>\n<li><strong>SPY<\/strong>：紐約 NYSE 的 S&amp;P 500 ETF，ArcaBook 逐筆行情。<\/li>\n<li>期間：2005 年 1 月到 2011 年 12 月，毫秒級時間戳。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li>ES 和 SPY 追蹤同一個指數，價格應該同步（ES 約等於 10 倍 SPY）。<\/li>\n<li>算兩者中間價的差距，並和它的移動平均比較。差距大到「在一邊買、另一邊賣，扣掉兩邊各半個價差還有賺」，就算一次套利機會。<\/li>\n<li>只算持續至少 4 毫秒（紐約到芝加哥的單程訊號延遲）、每單位利潤至少 0.05 指數點的機會。<\/li>\n<li>再建一個理論模型，說明這些機會為什麼一直存在、成本由誰承擔。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li>在 1 毫秒的尺度上，兩者報酬的相關性幾乎是 0（2011 年約 0.007）。拉長時間才會高度相關。<\/li>\n<li>套利機會持續時間的中位數，從 2005 年約 97 毫秒縮短到 2011 年約 7 毫秒。<\/li>\n<li>但<strong>每次的利潤沒有變小<\/strong>：平均約 0.09 指數點，平均每天約 891 次。光 ES–SPY 這一對，一年約 7,500 萬美元。<\/li>\n<li>作者的結論：競爭沒有消滅套利機會，只是不斷抬高搶到它所需的速度。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>論文直接回答了這題：<\/p>\n<ul>\n<li>當一個市場的價格動了，另一個市場的掛單會有一瞬間「過時」。最快的交易者衝過去吃掉這些過時的報價，這叫<strong>狙擊<\/strong>（sniping）。<\/li>\n<li>被狙擊的是<strong>掛單提供流動性的人<\/strong>，通常是做市商。<\/li>\n<li>做市商會把預期被狙擊的損失加進報價裡，讓買賣價差變寬。所以成本最後由<strong>一般投資人<\/strong>透過更寬的價差承擔。<\/li>\n<\/ul>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>市場是「連續撮合」：任何時刻都能成交，先到先得。正是這個規則讓速度變成關鍵。<\/li>\n<li>ES 和 SPY 本質上是同一個東西，價差一定會收回。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>對個別交易者來說<\/strong>：只要有人比你快，你就拿不到。機會從 97 毫秒縮到 7 毫秒，沒有持續投資速度就會被淘汰。<\/li>\n<li><strong>對整個機制來說<\/strong>：作者提議改成「頻繁批次拍賣」，每隔一小段時間（例如 1 秒，文中也提到 100 毫秒）集中撮合一次。這樣速度上的微小差距就沒有意義，這類套利會消失。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<ul>\n<li>論文定義的利潤已經扣掉兩邊各半個買賣價差，平均每次約 0.09 指數點。<\/li>\n<li>但真正的成本是<strong>速度投資<\/strong>：光纖、微波線路、機房位置。這筆錢論文沒有算進每次利潤裡，而是指出它是整個社會的浪費。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong><\/p>\n<ul>\n<li>1 毫秒相關性約 0.007、97 → 7 毫秒、每次約 0.09 指數點、每天約 891 次、每年約 7,500 萬美元、利潤大小不隨競爭縮小。<\/li>\n<li>狙擊過時報價、做市商擴大價差、成本轉嫁給一般投資人、頻繁批次拍賣的提議。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「速度投資沒算進每次利潤」是 Wiki 對論文利潤定義的解讀。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>NBER 會議版全文的前半部（資料、實證結果、模型的主要結論）。期刊版是 <em>Quarterly Journal of Economics<\/em> 130(4), 2015，沒有另外核對。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>：這篇整理成的策略頁<\/li>\n<li><a class=\"wl\" href=\"#market-makers\">做市商<\/a>：論文說被狙擊、最後付錢的是做市商與一般投資人<\/li>\n<li><a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>：速度競爭讓價差變寬<\/li>\n<li><a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>：ES 和 SPY 是同一個指數，價格應該一致<\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "hft-latency-arb", "law-of-one-price", "market-makers", "overtrading-2000", "transaction-costs", "who-pays"], "maybe": []}, "kalman-course-2001": {"title": "卡爾曼濾波器入門講義（Welch & Bishop 2001）", "type": "source", "updated": "2026-11-24", "html": "<h2>一句話<\/h2>\n<p>最常被引用的入門講義：給出預測、修正五條公式，並用一個例子示範 R 設錯會怎樣。<\/p>\n<h2>資料<\/h2>\n<p>這是教材，不是實證研究。北卡羅來納大學 Greg Welch 與 Gary Bishop 在 SIGGRAPH 2001 開的課程講義（Course 8），共 80 頁。第 2 章補機率、變異數、常態分布的基礎，第 4 章講卡爾曼濾波器本身，後面是應用（電腦圖學裡的頭部追蹤）。<\/p>\n<p>第 4.3 節的例子用的是模擬資料：一個固定不變的電壓 −0.37727，每次量測都加上標準差 0.1 的雜訊，共量 50 次。<\/p>\n<h2>方法<\/h2>\n<p><strong>問題設定<\/strong>（第 4.1.1 節）<\/p>\n<ul>\n<li>真正的狀態每一步這樣變：新狀態 = A × 舊狀態 + 控制輸入 + 過程雜訊（變異數 Q）。（式 4.1）<\/li>\n<li>量到的是：量測 = H × 狀態 + 量測雜訊（變異數 R）。（式 4.2）<\/li>\n<li>兩種雜訊互相獨立、平均是 0、呈常態分布。（式 4.3、4.4）<\/li>\n<\/ul>\n<p><strong>兩組公式<\/strong>（表 4.1、4.2）<\/p>\n<ul>\n<li><strong>時間更新（預測）<\/strong>：用 A 把上一步的估計往前推；不確定性 P 也往前推，再加上 Q。<\/li>\n<li><strong>量測更新（修正）<\/strong>：<\/li>\n<li>算卡爾曼增益 K = P⁻Hᵀ(HP⁻Hᵀ + R)⁻¹（式 4.8）<\/li>\n<li>新估計 = 預測 + K ×（量測 − H × 預測）（式 4.7）<\/li>\n<li>新的不確定性 P = (I − KH)P⁻<\/li>\n<\/ul>\n<p>講義把這兩組公式比喻成「預測者」與「修正者」，一直輪流做。<\/p>\n<p><strong>K 是怎麼來的<\/strong>：K 是讓「修正後的估計誤差」變得最小的那個權重。講義只說明推導的步驟，細節請讀者參考其他教科書。<\/p>\n<h2>結果<\/h2>\n<p><strong>K 的兩個極端<\/strong>（第 4.1.2 節）<\/p>\n<ul>\n<li>量測雜訊 R 趨近 0 時，K 讓量測佔最大比重：量測越可信，就越相信量測。<\/li>\n<li>預測的不確定性 P⁻ 趨近 0 時，K 趨近 0：自己的預測越可信，就越不理會量測。<\/li>\n<\/ul>\n<p><strong>創新值<\/strong>：量測和預測的差（z − Hx̂⁻）叫做量測創新值或殘差。是 0 代表預測和量測完全一致。<\/p>\n<p><strong>例子：估計一個固定的電壓<\/strong>（第 4.3 節）<\/p>\n<ul>\n<li>設定：A = 1（電壓不會變）、H = 1（直接量電壓）、Q = 0.00001（假設幾乎不變）、一開始猜 0、P₀ = 1。<\/li>\n<li><strong>R = 0.01<\/strong>（正好等於真實的雜訊變異數）：表現最平衡。P 在 50 次後從 1 降到約 0.0002。<\/li>\n<li><strong>R = 1<\/strong>（告訴濾波器雜訊比實際大 100 倍）：濾波器「比較慢才相信量測」，估計的晃動比較小。<\/li>\n<li><strong>R = 0.0001<\/strong>（雜訊比實際小 100 倍）：濾波器「很快就相信雜訊很大的量測」，估計的晃動變大。<\/li>\n<li>初始的 P₀ 選多少不太重要，只要不是 0，最後都會收斂；但 P₀ = 0 會讓濾波器永遠相信一開始的猜測。<\/li>\n<\/ul>\n<p><strong>調參數<\/strong>（第 5.1 節）<\/p>\n<ul>\n<li>R 通常可以事先量：多量幾次，看量測本身的晃動有多大。<\/li>\n<li>Q 比較難決定，因為你看不到真正的狀態。模型很簡陋時，把 Q 設大一點，等於承認「我的模型不準」。<\/li>\n<li>Q 和 R 固定時，P 和 K 很快就會穩定下來，之後不再變。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>這篇不是交易研究，不談賺錢。它對交易的意義在於：價格就是「雜訊很大的量測」，卡爾曼濾波器是一種有理論根據的去雜訊方法；<a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a> 就是拿它來做交易訊號。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>系統是線性的：新狀態是舊狀態的固定倍數加上雜訊。<\/li>\n<li>雜訊是常態分布、平均為 0、彼此獨立，而且你知道它們的大小（Q、R）。<\/li>\n<li>不是線性的系統要用擴充版（EKF），講義第 4.2 節指出它只是近似，雜訊經過非線性轉換後就不再是常態分布。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>Q、R 設錯<\/strong>：例子已示範，R 太大反應太慢，R 太小跟著雜訊亂跳。<\/li>\n<li><strong>P₀ 設成 0<\/strong>：濾波器永遠不更新。<\/li>\n<li><strong>模型錯了<\/strong>：例如價格其實有趨勢，你卻用「固定不變」的模型。講義的建議是把 Q 調大，讓濾波器多聽量測。<\/li>\n<li>套到價格上（Wiki 推論）：價格的雜訊大小會隨市場情況改變，固定的 R 不一定適用。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>不適用：這是教材，沒有交易，也沒有成本。拿去做交易時的成本問題，見 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（講義自己說的）<\/strong><\/p>\n<ul>\n<li>式 4.1–4.8、表 4.1–4.2 的公式；K 的兩個極端；創新值的定義；第 4.3 節的例子與三種 R 的結果；第 5.1 節調參數的建議；EKF 只是近似。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「價格就是雜訊很大的量測」的類比，以及價格雜訊會隨市場改變。<\/li>\n<li>Wiki 用程式重跑了第 4.3 節的例子（不同的隨機雜訊），定性結果相同：R = 1 時估計最平滑但反應最慢，R = 0.0001 時估計晃動最大。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>使用者上傳的完整講義 PDF（SIGGRAPH 2001 Course 8，80 頁）。主要讀第 4 章與第 5.1 節。同作者另有一份常被引用的短版技術報告（UNC TR 95-041），公式相同。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>：用這份講義整理成的概念頁<\/li>\n<li><a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a>：講義第 2 章的期望值、變異數、常態分布<\/li>\n<li><a class=\"wl\" href=\"#kalman-gaussian-2012\">用兩條鐘形曲線理解卡爾曼濾波器 2012<\/a>：用鐘形曲線推出同一組公式的另一種講法<\/li>\n<li><a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>：把卡爾曼濾波器拿來交易<\/li>\n<\/ul>", "back": ["kalman-filter", "kalman-gaussian-2012", "kalman-velocity", "variance-normal"], "maybe": []}, "kalman-gaussian-2012": {"title": "用兩條鐘形曲線理解卡爾曼濾波器（Faragher 2012）", "type": "source", "updated": "2026-11-24", "html": "<h2>一句話<\/h2>\n<p>把「預測」和「量測」各畫成一條鐘形曲線，兩條相乘，就推得出卡爾曼濾波器的修正公式。<\/p>\n<h2>資料<\/h2>\n<p>這是教學文章，不是實證研究。發表在 IEEE Signal Processing Magazine 2012 年 9 月號的 Lecture Notes 專欄，5 頁。作者寫給數學不強的學生，只用到一個數字的代數。<\/p>\n<p>例子是一列在軌道上跑的火車：想知道火車在哪裡，手上有兩個資訊來源。<\/p>\n<ol>\n<li><strong>預測<\/strong>：根據上一刻的位置、速度和司機的油門，推算現在在哪。<\/li>\n<li><strong>量測<\/strong>：用無線電測距系統量到的位置，有雜訊。<\/li>\n<\/ol>\n<h2>方法<\/h2>\n<p><strong>第一步：把資訊畫成鐘形曲線<\/strong>。不確定的位置用常態分布表示：曲線的中心是最可能的位置，寬度（變異數）是有多不確定。<\/p>\n<ul>\n<li>t = 0 時，火車的位置是一條窄窄的曲線（知道得很清楚）。<\/li>\n<li>往前預測到 t = 1，曲線變寬了（不知道司機有沒有加速或煞車）。<\/li>\n<li>t = 1 也量了一次位置，是另一條曲線（量測也有雜訊）。<\/li>\n<\/ul>\n<p><strong>第二步：兩條曲線相乘<\/strong>。把預測的曲線和量測的曲線相乘，得到的還是一條鐘形曲線，而且比兩條都窄。這條新曲線就是「結合兩個資訊後的最佳估計」。<\/p>\n<p><strong>第三步：寫出新曲線的中心和寬度<\/strong>（式 12、13）。設預測的中心是 μ₁、變異數 σ₁²，量測的中心是 μ₂、變異數 σ₂²：<\/p>\n<ul>\n<li>新中心 = μ₁ + [σ₁² ÷ (σ₁² + σ₂²)] × (μ₂ − μ₁)<\/li>\n<li>新變異數 = σ₁² − σ₁⁴ ÷ (σ₁² + σ₂²)<\/li>\n<\/ul>\n<p>把中括號那一項叫做 K，就變成：新中心 = μ₁ + K × (μ₂ − μ₁)，新變異數 = σ₁² − K × σ₁²。<\/p>\n<p><strong>第四步：處理單位不同的情況<\/strong>（式 14–18）。如果量測的單位和狀態不同（例如位置用公尺，無線電量的是訊號飛行的秒數），要加一個換算係數 H。代進去之後，就得到和標準卡爾曼濾波器一模一樣的公式。<\/p>\n<h2>結果<\/h2>\n<p>一一對應（文中最後一段）：<\/p>\n<ul>\n<li>μ₁ → 修正前的狀態（預測值 x̂⁻）<\/li>\n<li>σ₁² → 修正前的不確定性 P⁻<\/li>\n<li>μ₂ → 量測 z<\/li>\n<li>σ₂² → 量測雜訊 R<\/li>\n<li>H → 把狀態換算成量測單位的矩陣 H<\/li>\n<li>K → 卡爾曼增益 P⁻Hᵀ(HP⁻Hᵀ + R)⁻¹<\/li>\n<\/ul>\n<p>作者的結論：卡爾曼濾波器可以只用一個數字的代數和一個思想實驗教會；它之所以能一步一步遞迴下去，靠的是「鐘形曲線相乘還是鐘形曲線」這個特性。<\/p>\n<p>文中也指出，在系統是線性、雜訊是平均為 0 的常態分布時，卡爾曼濾波器是最佳的估計方法（引用 Anderson &amp; Moore）。<\/p>\n<h2>在賺誰的錢<\/h2>\n<p>這篇不是交易研究，不談賺錢。對交易的意義：同一個「兩個資訊來源加權平均」的想法，可以套在「模型預測的價格」和「看到的價格」上，見 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>預測和量測的誤差都是常態分布（鐘形曲線）。這是「相乘還是鐘形曲線」能成立的前提。<\/li>\n<li>你知道兩者各自有多不確定（σ₁²、σ₂²）。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li>誤差不是鐘形曲線時，相乘不一定還是鐘形曲線，公式就只是近似（Wiki 推論，文中沒有展開）。<\/li>\n<li>套到價格上（Wiki 推論）：報酬率常常是厚尾的，極端值比鐘形曲線預期的多，這個假設不完全成立。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>不適用：這是教學文章，沒有交易，也沒有成本。拿去做交易時的成本問題，見 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（文章自己說的）<\/strong><\/p>\n<ul>\n<li>火車例子、預測時曲線變寬、兩條曲線相乘得到更窄的曲線、式 12–13 的新中心與新變異數、加入 H 後對應到標準公式、只用一個數字的代數就能教會、線性加常態雜訊時是最佳估計。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「誤差不是鐘形曲線時只是近似」以及報酬率厚尾的提醒。<\/li>\n<li>新中心的公式可以改寫成「兩個值的加權平均，權重是對方的不確定性」：μ₁ × σ₂²/(σ₁²+σ₂²) + μ₂ × σ₁²/(σ₁²+σ₂²)。這是同一條式子的代數變形，見 <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>使用者上傳的全文 PDF（IEEE Signal Processing Magazine, 29(5), 2012 年 9 月，第 128–132 頁，DOI 10.1109/MSP.2012.2203621）。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>：用這篇的直覺寫成的概念頁<\/li>\n<li><a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a>：兩條鐘形曲線相乘的詳細說明<\/li>\n<li><a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a>：公式的完整版<\/li>\n<li><a class=\"wl\" href=\"#kalman-velocity\">卡爾曼濾波器（二）：加入速度與拿來交易<\/a>：火車例子同時追蹤位置和速度<\/li>\n<\/ul>", "back": ["kalman-course-2001", "kalman-filter", "kalman-velocity", "variance-normal"], "maybe": []}, "kalman-trend-2016": {"title": "用卡爾曼濾波器抓趨勢（Benhamou 2016）", "type": "source", "updated": "2026-11-24", "html": "<h2>一句話<\/h2>\n<p>用像車用導航一樣邊猜邊修正的濾波器，取代移動平均來濾掉價格雜訊並預測下一步。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>美國 S&amp;P 500 迷你期貨（E-mini S&amp;P 500）的連續合約日線，2015 年 2 月 28 日到 2016 年 2 月 28 日，共一年。<\/li>\n<li>資料來自 Thomson Reuters Eikon，作者當時任職於該公司。<\/li>\n<li>只有一個市場、一年。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<p><strong>先比較移動平均<\/strong>。作者先整理移動平均的公式，指出它有兩個毛病：<\/p>\n<ol>\n<li><strong>延遲<\/strong>：移動平均是用過去的價格算的，價格轉彎後它要過幾天才跟著彎。比較快的版本（DEMA、TEMA）可以把延遲壓低。<\/li>\n<li><strong>不懂方向<\/strong>：它只會平均，不會想「價格最近一直往上，所以下一根大概更高」。DEMA、TEMA 也解決不了這點。<\/li>\n<\/ol>\n<p><strong>卡爾曼濾波器（Kalman filter，KF）<\/strong>。1960 年代為了追蹤移動中的目標而發明，現在的車用導航也在用。它只做兩件事，一直重複：<\/p>\n<ol>\n<li><strong>預測<\/strong>：根據上一刻的狀態（價格和它變化的速度），猜這一刻的價格。<\/li>\n<li><strong>修正<\/strong>：看到真實價格後，往真實價格靠近一點。靠近多少由<strong>卡爾曼增益<\/strong>決定：量測越吵，越相信自己的猜測；自己的模型越不確定，越相信量測。<\/li>\n<\/ol>\n<p>論文引用先前研究指出：如果假設價格只是隨機亂走加上雜訊，卡爾曼濾波器就等於一條參數最佳化過的指數移動平均。所以它可以看成移動平均的升級版。<\/p>\n<p><strong>四個模型<\/strong>，差在「假設價格怎麼動」：<\/p>\n<table>\n<thead>\n<tr>\n<th>模型<\/th>\n<th>假設<\/th>\n<th>參數數量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>價格有位置、有速度（像物理上的車子）<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>局部線性趨勢模型，和模型 1 幾乎一樣<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>價格 = 短期成分 + 長期成分<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>模型 3 再加上隨機指標：價格在最近 14 天最高與最低之間的位置<\/td>\n<td>15<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>交易規則<\/strong>：每根日線，模型預測的價格高於昨天收盤價加一點緩衝就做多，低於昨天收盤價減一點緩衝就做空。每次只交易 1 口，不用槓桿，一來一回手續費 4 美元。<\/p>\n<h2>結果<\/h2>\n<p><strong>畫面上<\/strong>：卡爾曼濾波器的線比 12 天的移動平均、DEMA、TEMA 都更貼近價格；作者說它的延遲只有 0 到 1 天。模型 1 和 2 很像，模型 3 和 4 很像，後兩者更好。（Figure 1–4）<\/p>\n<p><strong>交易績效<\/strong>（Table 1，金額為美元）：<\/p>\n<table>\n<thead>\n<tr>\n<th>模型<\/th>\n<th>淨利<\/th>\n<th>最大回撤<\/th>\n<th>交易次數<\/th>\n<th>夏普比率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>18,755<\/td>\n<td>−7,348<\/td>\n<td>55<\/td>\n<td>0.72<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>22,380<\/td>\n<td>−7,348<\/td>\n<td>55<\/td>\n<td>0.76<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>29,022<\/td>\n<td>−3,800<\/td>\n<td>57<\/td>\n<td>1.22<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>39,558<\/td>\n<td>−2,600<\/td>\n<td>48<\/td>\n<td>0.73<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>模型 4 的 48 筆交易裡有 30 筆賺錢，最大一筆賺 11,309 美元，平均持有約 6.92 天。（Table 3）<\/li>\n<li>作者說這口期貨每天的保證金約 5,000 到 6,000 美元，所以一年淨利約 4 萬美元是很驚人的數字。<\/li>\n<li>模型 4 裡和隨機指標有關的第 14 個參數最佳值是 0，作者解讀為「區間來回只影響短期，長期由趨勢主導」。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>論文<strong>沒有<\/strong>討論。Wiki 推論：<\/p>\n<ul>\n<li>追趨勢的部分，和 <a class=\"wl\" href=\"#momentum\">動量策略<\/a> 是同一類想法，賺的可能是對消息反應慢的人。<\/li>\n<li>隨機指標的部分是在區間裡低買高賣，和均值回歸、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a> 的想法接近。<\/li>\n<li>但下面「什麼時候失效」說明了，這篇的證據不足以證明它真的賺得到錢，所以「在賺誰的錢」目前無法回答。<\/li>\n<\/ul>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>價格不是完全隨機亂走，裡面有可以抓到的趨勢或區間（作者在第 1.1 節直說：如果相信價格不是隨機漫步，平滑後的線就能給出方向）。<\/li>\n<li>你選的模型（位置與速度、短期與長期）大致符合價格真正的變化方式。<\/li>\n<li>在這一年調出來的參數，未來也適用。這一條論文沒有驗證。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<p><strong>最大的問題：同一年調參數，又在同一年報告績效。<\/strong> 討論章節自己承認，參數是最佳化出來的「最好可能的選擇」，讀結果時要記住這點。論文沒有把資料切成訓練和測試，也沒有樣本外測試。這等於先看過答案再考試。<\/p>\n<p>讓問題更嚴重的地方：<\/p>\n<ul>\n<li><strong>參數多、交易少<\/strong>：模型 4 有 15 個參數，整年只有 48 筆交易。可以調的旋鈕越多，越容易剛好背下這一年的走勢。<\/li>\n<li><strong>只有一年、一個市場<\/strong>：換年份、換商品是否還有效，沒有測。<\/li>\n<li><strong>獲利集中<\/strong>：模型 4 最大一筆 11,309 美元，約佔全年淨利 39,558 美元的 29%（Wiki 的算術）。<\/li>\n<li><strong>「最好」看用哪把尺<\/strong>：用淨利和回撤看，模型 4 最好；用夏普比率看，模型 3 的 1.22 明顯高於模型 4 的 0.73。論文沒有討論這個矛盾。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<ul>\n<li>表中的淨利已經扣掉每次一來一回 4 美元的手續費，模型 4 全年手續費共 192 美元。<\/li>\n<li>論文<strong>沒有<\/strong>提到滑價（實際成交價比預期差）。日線、一口期貨，滑價影響可能不大，但沒有數據。<\/li>\n<li>因為績效是在同一年調參得到的，扣成本後的真實獲利無法從這篇判斷。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong><\/p>\n<ul>\n<li>移動平均的兩個毛病、卡爾曼濾波器的預測與修正、四個模型與參數數量、交易規則、一年的資料、Table 1 的績效、模型 4 最好、參數是最佳化出來的。<\/li>\n<li>卡爾曼濾波器的延遲只有 0 到 1 天、比 DEMA 和 TEMA 更貼近價格。<\/li>\n<li>有人把卡爾曼濾波器用在配對交易（Chan 2013）。<\/li>\n<\/ul>\n<p><strong>推論與觀察（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「在賺誰的錢」的兩種推論。<\/li>\n<li>同年調參與測試、15 個參數對 48 筆交易、29% 集中度、夏普比率矛盾，這些是 Wiki 對論文結果的評論。<\/li>\n<li><strong>虛擬碼的小錯誤<\/strong>：第 3.2 節的修正步驟寫成「狀態加上增益乘以量測值 Y」，照公式 EQ 3.5 應該是「增益乘以創新值 I」（量測值減去預測值）；同一段還有一處把 H 寫成 T。看起來是筆誤，公式本身是對的，照虛擬碼實作會出錯。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>使用者上傳的全文 PDF（arXiv 1808.03297v1，29 頁；文內標示寫於 2016 年 4 月）。沒有找到同儕審查的期刊版本。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#kalman-trend\">卡爾曼濾波趨勢策略<\/a>：這篇整理成的策略頁<\/li>\n<li><a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>：卡爾曼濾波器的公式與直覺<\/li>\n<li><a class=\"wl\" href=\"#kalman-velocity\">卡爾曼濾波器（二）：加入速度與拿來交易<\/a>：論文模型 1 的「價格＋速度」怎麼算<\/li>\n<li><a class=\"wl\" href=\"#momentum\">動量策略<\/a>：同樣是追趨勢的想法<\/li>\n<\/ul>", "back": ["kalman-course-2001", "kalman-filter", "kalman-gaussian-2012", "kalman-trend", "kalman-velocity", "transaction-costs", "who-pays"], "maybe": []}, "limits-arbitrage-1997": {"title": "套利的極限（Shleifer & Vishny 1997）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>套利者用別人的錢；價差拉得越開、機會越好時，出資人反而撤資，逼他們認賠出場。<\/p>\n<h2>資料<\/h2>\n<p>這是理論論文，沒有用交易資料做實證。作者用模型推導，再用基金績效差就被贖回、1990–91 年銀行股等現象佐證。<\/p>\n<h2>方法<\/h2>\n<ol>\n<li>先比較「教科書的套利」和「現實的套利」。<\/li>\n<li>建一個模型：少數專業套利者管理外部投資人的錢；投資人看不懂策略，只能用最近的績效判斷套利者的能力。作者把這叫<strong>以績效為準的套利<\/strong>。<\/li>\n<li>推導當雜訊交易者把價格推離合理價值時，套利者會怎麼做。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li><strong>教科書的套利<\/strong>不用本錢、沒有風險。<strong>現實的套利<\/strong>要本錢，而且有風險：作者舉德國公債期貨的例子，即使最後會收斂，中間也可能先虧錢、被追繳保證金。<\/li>\n<li><strong>最需要錢的時候拿不到錢<\/strong>：價格偏離越大，套利機會越好，但套利者此時帳面虧損，投資人看到虧損就撤資。這種撤資在投資人的角度是理性的，因為他們無法分辨是套利者能力差，還是運氣差。<\/li>\n<li><strong>在最糟的時候被迫賣<\/strong>：滿倉的套利者遇到撤資只能平倉，而平倉的買賣又把價格推得更遠，像跳樓大拍賣。<\/li>\n<li><strong>哪裡最容易出現長期錯價<\/strong>：波動大、無法避險的個別風險大、要很久才會收斂的地方。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>套利者想賺的是雜訊交易者（情緒化、不看價值的交易者）把價格推歪的那段。但這篇的重點是反過來：<strong>當價格被推得更歪時，套利者自己會變成付錢的人<\/strong>，被迫在最差的價位平倉，把錢讓給逢低承接的人。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>套利者用的是別人的錢，而出資人只看最近的績效。<\/li>\n<li>套利者已經把資金投得差不多了，沒有多餘的錢可以加碼撐住。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<p>這篇講的就是套利什麼時候失效：<\/p>\n<ul>\n<li>價格在收斂前先偏得更遠，而且偏得夠久，久到出資人失去耐心。<\/li>\n<li>所有套利者同時被撤資，沒有外面的資金進來接手。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>論文沒有算具體報酬。它指出的成本不是手續費，而是<strong>被迫提早平倉的損失<\/strong>，加上平倉時把價格推得更不利的衝擊。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong><\/p>\n<ul>\n<li>教科書套利 vs 現實套利、外部資金和代理問題、績效差就撤資、機會最好時最受限、被迫平倉推遠價格、哪種市場最容易有長期錯價。<\/li>\n<li>論文<strong>沒有<\/strong>討論 Royal Dutch／Shell、雙胞胎股票或配對交易。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>把這個理論套到配對交易和 LTCM 上，是 Wiki 的連結，見 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>期刊全文 PDF（<em>Journal of Finance<\/em> 52(1), 1997）。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：這篇整理成的概念頁<\/li>\n<li><a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：理論發表一年後就發生的真實案例<\/li>\n<li><a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>：論文描述的對象：用別人的錢做套利的人<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：套用到配對交易上的風險<\/li>\n<\/ul>", "back": ["arbitrageurs", "leverage", "limits-of-arbitrage", "ltcm", "ltcm-2006", "pairs-guide"], "maybe": []}, "ltcm-2006": {"title": "LTCM 與套利（MacKenzie 2006，第 8 章）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>LTCM 的部位單看都合理，但太多人抄同樣的交易，危機時大家一起被迫賣，價差全部同時拉開。<\/p>\n<h2>資料<\/h2>\n<p>社會學家 Donald MacKenzie 研究金融模型的書 <em>An Engine, Not a Camera<\/em>（MIT Press, 2006）第 8 章〈Arbitrage〉。資料來自公開資料，以及作者對 LTCM 合夥人和其他交易員的訪談。<\/p>\n<h2>方法<\/h2>\n<p>整理 LTCM 從 1994 年成立到 1998 年倒下的經過，逐一檢驗幾種解釋（例如槓桿太高、模型錯誤），最後提出「模仿造成的超級組合」這個解釋。<\/p>\n<h2>結果<\/h2>\n<p><strong>LTCM 是誰<\/strong><\/p>\n<ul>\n<li>1994 年 2 月開始交易，總部在美國康乃狄克州。核心成員來自所羅門兄弟的債券套利部門。<\/li>\n<li>報酬（扣費後）：1995 年 42.8%、1996 年 40.8%。<\/li>\n<li>1997 年 8 月：資產 1,260 億美元，其中自有資本 67 億美元。1994–1997 年的槓桿在 14 倍到 31 倍之間，1998 年初約 27 倍。<\/li>\n<\/ul>\n<p><strong>Royal Dutch／Shell 交易<\/strong><\/p>\n<ul>\n<li>Royal Dutch／Shell 集團的淨現金流按 60：40 分給兩家公司，所以兩檔股票價格應該維持固定比例。<\/li>\n<li>1997 年 Royal Dutch 比理論價貴約 8%。LTCM 放空 Royal Dutch、買進 Shell，這樣大盤和油價的漲跌互相抵銷。<\/li>\n<li>光靠股利差，還不夠付融資成本，所以 LTCM 賭的是價差會縮小（他們預期英國的稅制改變會帶動）。<\/li>\n<li>結果 1998 年初溢價反而擴大，危機中一度超過 17%。這個溢價一直到 2001 年春天才消失。<\/li>\n<\/ul>\n<p><strong>1998 年發生了什麼<\/strong><\/p>\n<ul>\n<li>8 月 17 日俄羅斯債務違約，市場開始逃向安全、流動性高的資產。<\/li>\n<li>8 月 21 日 LTCM 單日虧損 5.5 億美元；整個 8 月虧掉 44% 的資本。<\/li>\n<li>原本彼此相關性只有 0.1 左右的各種部位，相關性升到約 0.7：分散投資在危機中失效。<\/li>\n<li>9 月 20 日美國財政部和紐約聯準會官員與 LTCM 開會。最後由紐約聯準會出面協調，14 家銀行出資 36 億美元、取得基金 90% 的股權；原本的投資人和合夥人只剩約 4 億美元，大約是之前的十分之一。<\/li>\n<\/ul>\n<p><strong>作者的解釋：超級組合<\/strong><\/p>\n<ul>\n<li>LTCM 早年的成功引來大量模仿，很多交易變成「共識交易」，市場上形成一個大家都持有的「超級組合」。<\/li>\n<li>所羅門兄弟的美國套利部門在 1998 年 7 月宣布關閉，平倉時讓其他持有相同部位的人虧損。<\/li>\n<li>虧損的套利者被迫減碼，減碼又讓價差更開，價差擴大變成自我強化，而不是自我修正。投資人在 1998 年第四季從套利類基金撤出約 60 億美元；風險值（VaR）上限也逼一些交易部門平倉。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>LTCM 想賺的是「近似商品之間的價差最後會收斂」：Royal Dutch 和 Shell、各種債券和交換利率之間的價差。1998 年反過來，<strong>LTCM 和其他套利者變成付錢的人<\/strong>：被迫在價差最開的時候平倉。接手的是當時有錢、撐得住的一方（例如出資接管的 14 家銀行），他們後來把部位慢慢平倉到 1999 年 12 月。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>價差最後會收斂（就單一部位來說，多數最後確實收斂了，例如 Royal Dutch／Shell 在 2001 年）。<\/li>\n<li>各部位之間互相獨立，所以分散就能降低風險。<\/li>\n<li>撐得住到收斂的那一天：LTCM 為此設計了投資人三年不能贖回的條款。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>大家都持有同樣的部位<\/strong>：一個人被迫賣，其他人跟著虧，相關性從 0.1 跳到 0.7。<\/li>\n<li><strong>槓桿太高<\/strong>：27 倍槓桿下，資產只要跌約 4%，自有資本就沒了（Wiki 的算術：1 ÷ 27 ≈ 3.7%）。<\/li>\n<li>作者說單一部位的虧損其實都還「可以承受」，壓垮 LTCM 的是全部部位同時出事。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>1995、1996 年扣費後每年都有四成以上；1998 年 8 月一個月就虧掉 44% 的資本，最後投資人只剩約十分之一。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（書中說的）<\/strong><\/p>\n<ul>\n<li>成立時間、報酬、資產和資本、槓桿倍數、60：40、8% 和 17%、2001 年春天溢價消失、8 月 17 日、5.5 億美元、44%、相關性 0.1 → 0.7、14 家銀行 36 億美元 90%、剩約 4 億美元、超級組合、60 億美元撤資、三年鎖定期。<\/li>\n<li>這一章<strong>沒有<\/strong>引用 Shleifer &amp; Vishny 的套利極限理論，也沒有寫出 LTCM 在 Royal Dutch／Shell 的部位大小和虧損金額。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「1 ÷ 27」的槓桿算術。<\/li>\n<li>把這段經過和 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a> 的理論連起來，見 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>。<\/li>\n<li>網路上流傳的 LTCM「23 億美元 Royal Dutch／Shell 部位」說法，Wiki 只在二手文章看到，沒有可靠來源，所以不採用。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>LSE 課程網站提供的第 8 章全文 PDF。另外讀了 Jorion（2000）〈Risk Management Lessons from Long-Term Capital Management〉的摘要：作者認為 LTCM 嚴重低估了風險，因為只看短期歷史資料，而且風險過度集中。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：用這章整理成的案例頁<\/li>\n<li><a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>：解釋 LTCM 為什麼撐不住的理論<\/li>\n<li><a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>：Royal Dutch／Shell 價差的長期資料<\/li>\n<li><a class=\"wl\" href=\"#leverage\">槓桿<\/a>：LTCM 的槓桿倍數出處<\/li>\n<\/ul>", "back": ["leverage", "limits-of-arbitrage", "ltcm", "pairs-trading"], "maybe": []}, "momentum-1993": {"title": "買贏家、賣輸家（Jegadeesh & Titman 1993）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>過去半年漲最多的股票，接下來半年到一年還會繼續贏，之後漲幅會吐回一部分。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>美國 NYSE 和 AMEX 上市股票的每日報酬（CRSP 資料庫），1965 年 1 月到 1989 年 12 月。<\/li>\n<li>研究盈餘公告的部分，用 1980–1989 年 COMPUSTAT 的季報公告日。<\/li>\n<li>另外拿 1927–1964 年的資料做樣本外檢驗。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li>每個月，依照每檔股票「過去 J 個月」的報酬排名，分成 10 組（每組等權重）。<\/li>\n<li>買進漲最多的那一組（贏家），放空跌最多的那一組（輸家），持有 K 個月。買賣金額相等，所以是不用出本錢的「零成本組合」。<\/li>\n<li>J 和 K 各試 3、6、9、12 個月，共 16 種組合；再加上「排名後先等一週才進場」的版本，共 32 種。<\/li>\n<li>每個月都開一批新的、關掉 K 個月前那一批，所以組合是重疊的。<\/li>\n<\/ol>\n<p>這種「看過去漲跌來決定買賣」的做法，就是 <a class=\"wl\" href=\"#momentum\">動量策略<\/a>（動量策略）。<\/p>\n<h2>結果<\/h2>\n<ul>\n<li>最常被引用的 J=6、K=6：每月平均超額報酬 0.95%；排名後等一週再進場是每月 1.10%。（Table I）<\/li>\n<li>這不是承擔更多市場風險換來的：贏家組的 beta（跟大盤連動程度）其實比輸家組略低，相減約 −0.08。（Table II）<\/li>\n<li>累積超額報酬在第 12 個月到頂（約 9.51%），第 13–24 個月轉負，第 36 個月剩約 4.06%。作者總結：第一年的超額報酬大約一半在之後兩年消失。（Table VII、結論）<\/li>\n<li>盈餘公告時期：贏家在排名後頭幾個月的公告日報酬比輸家高，大約第 8 個月以後反過來。（Table IX）<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>論文<strong>沒有<\/strong>指名對手方是誰。作者的解釋是：市場對公司個別的消息反應太慢，好消息沒有一次反映到股價上。<\/p>\n<p>Wiki 的推論：如果作者說得對，賺的就是「反應慢的人」的錢，例如太早賣掉贏家、或抱著輸家不放的投資人，他們把後續漲跌讓給了動量交易者。這點論文沒有直接驗證。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>價格對公司消息的反應是<strong>延遲<\/strong>的，而且這個延遲會持續存在。<\/li>\n<li>作者也提到另一種可能：一些人追漲殺跌（正回饋交易），把價格推離長期價值。作者承認手上的證據分辨不出是哪一種。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>持有太久<\/strong>：超過 12 個月，報酬開始反轉。<\/li>\n<li><strong>其他年代<\/strong>：1927–1940 年完全不靈，持有 12 個月累積虧 10.12%，作者歸因於那段時期這個組合的 beta 大約是 −0.5，又碰上大盤均值回歸。1941–1964 年第一年有賺，但第 24 個月前幾乎吐光。（Table VIII）<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<ul>\n<li>6/6 策略半年換手率約 84.8%。假設每次單邊交易成本 0.5%，扣完後風險調整後報酬仍有每年約 9.29%。<\/li>\n<li>作者說 0.5% 是保守的假設，因為當時另一份研究估計的成本只有約 23 bps（0.23%）。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong><\/p>\n<ul>\n<li>每月 0.95% / 1.10%、beta 差 −0.08、第 12 個月到頂、一半在兩年內消失、扣 0.5% 成本後每年 9.29%。<\/li>\n<li>解釋：符合「對公司個別資訊反應延遲」，也可能是正回饋交易，證據無法區分。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「賺反應慢的人的錢」是 Wiki 根據作者解釋推出來的，論文沒有指出具體是哪群投資人。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>期刊全文 PDF（<em>Journal of Finance<\/em> 48(1), 1993）。表號與頁碼依期刊版。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#momentum\">動量策略<\/a>：這篇整理成的策略頁<\/li>\n<li><a class=\"wl\" href=\"#excess-return\">超額報酬<\/a>：每月 0.95% 是超額報酬<\/li>\n<li><a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>：扣掉 0.5% 單邊成本後還剩多少<\/li>\n<li><a class=\"wl\" href=\"#bps\">bps<\/a>：論文提到的 23 bps 成本估計<\/li>\n<\/ul>", "back": ["bps", "excess-return", "momentum", "transaction-costs", "who-pays"], "maybe": []}, "overtrading-2000": {"title": "交易有害你的財富（Barber & Odean 2000）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>散戶選股不比市場差，但交易越頻繁，手續費和價差吃掉越多，最後輸給大盤。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>美國一家大型折扣券商的帳戶資料：從 78,000 戶抽樣，其中 66,465 戶持有股票。<\/li>\n<li>期間：1991 年 1 月到 1996 年 12 月的持股月報，加上逐筆交易紀錄（超過 300 萬筆）。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li>依每戶平均每月的換手率（買賣了持股的多少比例），把家戶分成 5 組。<\/li>\n<li>每組算兩種報酬：<strong>毛報酬<\/strong>（不扣成本）和<strong>淨報酬<\/strong>（扣掉佣金和買賣價差）。<\/li>\n<li>和大盤指數、CAPM、Fama-French 三因子模型比較，確認差異不是因為承擔了不同的風險。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li>交易最多的那 20% 家戶，淨報酬每年 11.4%；同期市場 17.9%。交易最少的那組是 18.5%。<\/li>\n<li>各組的<strong>毛報酬幾乎一樣<\/strong>（每年 18.5%–18.7%）。差距幾乎全來自成本。<\/li>\n<li>交易最多那組平均每月換手 21.49%，一年超過 250%。<\/li>\n<li>一般家戶每年換手約 75%，淨報酬 16.4%，仍輸大盤。<\/li>\n<li>成本：超過 1,000 美元的交易，一來一回平均約 3% 佣金加 1% 買賣價差。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>這篇反過來，講的是<strong>誰在付錢<\/strong>：頻繁交易的散戶。<\/p>\n<ul>\n<li>佣金付給券商（論文直接說明是佣金成本）。<\/li>\n<li>買賣價差由投資人付出，但論文<strong>沒有<\/strong>說明是誰收走。Wiki 推論是提供報價的 <a class=\"wl\" href=\"#market-makers\">做市商<\/a>。<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a> 直接談到做市商靠價差賺錢，但仍沒有證明散戶付的價差就是流到他們手上。<\/li>\n<\/ul>\n<h2>靠什麼假設<\/h2>\n<p>這不是策略，所以改問「散戶為什麼一直交易」。作者的解釋是<strong>過度自信<\/strong>：高估自己的資訊和判斷，所以交易太多。如果散戶是理性的，多付的成本應該會被更高的毛報酬補回來，但資料顯示沒有。<\/p>\n<h2>什麼時候失效<\/h2>\n<p>論文的結論在以下情況可能不適用（以下是 Wiki 的推論，不是論文說的）：<\/p>\n<ul>\n<li>樣本只有 1991–1996 年、一家券商。那時佣金遠高於現在很多券商的零佣金時代。<\/li>\n<li>但即使佣金變零，<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a> 這項成本仍然存在，所以「交易越多、成本越多」的方向應該還成立。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>毛報酬和大盤差不多；扣成本後，交易最多的那組每年少賺約 6.5 個百分點（17.9% → 11.4%）。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong><\/p>\n<ul>\n<li>66,465 戶、1991–1996、淨報酬 11.4% vs 市場 17.9%、毛報酬各組差異很小、換手 250% 以上、佣金約 3% 加價差約 1%、過度自信。<\/li>\n<li>論文也說，散戶偏好小型股和高 beta 股，這些偏好在樣本期間其實幫了忙，所以落後的主因是成本，不是選股。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>價差被做市商收走。<\/li>\n<li>零佣金時代結論是否仍成立。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>作者網站上的期刊版全文 PDF（<em>Journal of Finance<\/em> 55(2), 2000）。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#retail\">散戶<\/a>：這篇整理成的玩家頁<\/li>\n<li><a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>：散戶輸在成本，不是選股<\/li>\n<li><a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a>：佣金的收受方<\/li>\n<li><a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>：另一項成本：一來一回約 1% 價差<\/li>\n<\/ul>", "back": ["bid-ask-spread", "brokers-exchanges", "excess-return", "market-makers", "retail", "transaction-costs", "who-pays"], "maybe": []}, "pairs-decline-2010": {"title": "簡單的配對交易還有用嗎？（Do & Faff 2010）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>把 Gatev 等人的配對交易延長測到 2009 年：利潤一路變薄，但在市場恐慌時反而表現好。<\/p>\n<h2>資料<\/h2>\n<p>美國股票，1962 年 7 月到 2009 年 6 月，延續 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a> 的樣本並往後多測了 7 年。<\/p>\n<h2>方法<\/h2>\n<ol>\n<li>用和 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a> 一樣的規則（距離法配對、偏離 2 個標準差進場、交叉出場），重跑到 2009 年。<\/li>\n<li>把利潤下降拆成兩種解釋：市場變得更有效率（錯價變少），或是套利本身變得更危險。<\/li>\n<li>測試兩個改良的配對條件：只在同一個細分產業裡配對，以及看這對過去「交叉過幾次」（交叉越多，代表越常回歸）。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li>前 20 對每月平均超額報酬一路下降：1962–1988 年 0.86%、1989–2002 年 0.37%、2003–2009 年 0.24%。<\/li>\n<li>作者檢驗了「避險基金變多、競爭變激烈」的解釋，發現對配對交易來說這不是主因。<\/li>\n<li>套利風險變大，最多解釋了利潤下降的 70%。<\/li>\n<li>2000–02 年空頭和 2007–09 年金融危機期間，配對交易反而表現特別好：恐慌時風險雖然變大，但錯價變多的效果更大。<\/li>\n<li>加上「同產業」和「交叉次數」兩個條件後，利潤明顯提高，銀行股每月多約 22 bps。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>作者把配對交易看成「有風險的套利」：賺的是市場暫時沒效率造成的錯價，而這份利潤也是承擔套利風險的報酬。恐慌時錯價變多，所以賺得更多，Wiki 推論付錢的是恐慌時急著賣出的人。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>配對的兩檔之間的錯價會回來。作者列出三種讓錯價不回來或晚回來的套利風險：<\/p>\n<ul>\n<li><strong>基本面風險<\/strong>：兩家公司的關係真的變了。<\/li>\n<li><strong>雜訊交易者風險<\/strong>：情緒化的交易把價差推得更開，套利者撐不住。<\/li>\n<li><strong>同步風險<\/strong>：套利者不知道其他人什麼時候會一起進場修正價格，所以修正可能遲遲不來。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li>長期來看越來越薄，2003–2009 年每月只剩 0.24%。<\/li>\n<li>套利風險上升的時期，利潤被吃掉。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>這篇的數字是<strong>沒扣交易成本<\/strong>的超額報酬。每月 0.24% 只剩約 24 bps，對照 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a> 估計一來一回成本約 162 bps，Wiki 推論簡單版的配對交易在近年扣完成本可能所剩無幾。同作者 2012 年另有一篇專門研究成本，記在 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文摘要說的）<\/strong><\/p>\n<ul>\n<li>1962–2009 年樣本、0.86% → 0.37% → 0.24%、競爭不是主因、套利風險解釋最多 70%、危機期間表現好、三種套利風險、同產業與交叉次數條件、銀行股多 22 bps。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>恐慌時付錢的是急著賣的人。<\/li>\n<li>扣成本後近年所剩無幾（拿 2006 年那篇的成本估計來對照，兩篇的成本口徑不一定相同）。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p><strong>只讀了摘要<\/strong>（EconPapers 與 CFA Institute 的摘要頁）。全文在 <em>Financial Analysts Journal<\/em> 66(4), 2010 的會員區，沒有讀到。表號和細節無法核對。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>：這篇延長測試的前一篇<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：利潤下降已整理進策略頁<\/li>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：三種套利風險解釋了最多 70% 的下降<\/li>\n<li><a class=\"wl\" href=\"#bps\">bps<\/a>：利潤用 bps 表示的變化<\/li>\n<\/ul>", "back": ["bps", "limits-of-arbitrage", "pairs-guide", "pairs-trading", "pairs-trading-2006", "who-pays"], "maybe": []}, "pairs-trading-2006": {"title": "配對交易（Gatev, Goetzmann & Rouwenhorst 2006）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>找兩檔走勢像雙胞胎的股票，一旦拉開就買落後的、空領先的，等它們靠回來。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>美國股票每日資料（CRSP），1962–2002 年；月報酬結果涵蓋 1963 年 7 月到 2002 年 12 月，共 474 個月。<\/li>\n<li>形成期內只要有一天沒成交就排除，等於只留流動性夠的股票。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li><strong>找配對（12 個月）<\/strong>：把每檔股票的累積報酬指數（含股利）標準化，每檔找一個「價格曲線距離最近」的夥伴，也就是兩條線的差的平方加總最小。<\/li>\n<li><strong>交易（接下來 6 個月）<\/strong>：兩檔標準化價格差距超過過去的 2 個標準差，就買進落後的、放空領先的，各一塊錢。<\/li>\n<li><strong>出場<\/strong>：價格再次交叉就平倉；6 個月到期還沒交叉就強制平倉。<\/li>\n<li>比較最接近的前 5 對、前 20 對、第 101–120 對。<\/li>\n<li>用「隨機配對」做對照（bootstrap），確認賺的不是單純的短期反轉。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li>前 20 對，每月超額報酬 1.44%（以實際有開倉的資金計算）；若以全部準備好的資金計算是 0.81%。摘要的說法是年化最高約 11%。<\/li>\n<li>隨機配對幾乎賺不到錢，所以這個效果不是單純「跌多了會彈」。<\/li>\n<li>和市場、規模、價值、動量、反轉等風險因子的相關性很低（R² 約 0.05–0.18）。<\/li>\n<li>1999–2002 年用同一套規則做樣本外測試，前 20 對每年平均 10.4%。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>作者的解釋：兩檔幾乎可以互相替代的股票，價格被<strong>暫時定錯<\/strong>。套利者把價格推回去，獲利是他們「維持<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>」的報酬。<\/p>\n<p>Wiki 的推論：付錢的是把其中一檔價格暫時推離夥伴的人，例如急著買賣、不在乎價格的交易者，或是情緒性過度反應的人。作者也提到過度反應是一種可能的解釋，但沒有直接指出是哪群人。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>過去一起走的兩檔股票，未來大致還會一起走；拉開只是暫時的。<\/li>\n<li>作者發現前 20 對和第 101–120 對的報酬彼此相關，推測背後有一個共同的、傳統風險模型沒捕捉到的因子在驅動。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>越來越多人做<\/strong>：前 20 對每月原始超額報酬，1989 年前約 118 bps，之後掉到約 38 bps。作者提出兩種解釋：避險基金競爭變多，或那個共同因子近年比較沉寂。作者比較傾向後者，但說需要更多研究。<\/li>\n<li>兩檔股票的關係真的改變了（例如其中一家公司出事），價差就不會回來，只能等 6 個月到期認賠。這點是方法本身的限制。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<ul>\n<li><strong>等一天再進場<\/strong>（避開買賣價差造成的假訊號）：每月報酬少掉約 30–55 bps，但仍顯著。<\/li>\n<li>作者用這個差距估計一來一回的成本約 162 bps。扣掉後，每 6 個月仍有約 113–225 bps 的淨利。<\/li>\n<li><strong>放空成本<\/strong>：只交易大型股、或模擬借券被收回，報酬只少 4–13 bps。作者說大型機構的放空成本很低，但散戶較難借到券。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong><\/p>\n<ul>\n<li>每月 1.44% / 0.81%、年化最高約 11%、等一天的影響、162 bps 成本估計、1989 年前後的變化、隨機配對對照、共同因子。<\/li>\n<li>解釋：暫時定錯、套利者維持一價定律的報酬；另有競爭變多與過度反應的可能。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>付錢的是「把價格暫時推開的人」。<\/li>\n<li>公司關係改變導致價差不回來的風險（論文的規則有 6 個月強制平倉，但沒有特別分析這種情況）。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>2006 年 2 月的工作論文全文（Yale ICF Working Paper 08-03）；期刊版（<em>Review of Financial Studies<\/em> 19(3), 2006）只讀了摘要。年化 11% 來自期刊摘要，其他數字來自工作論文。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：這篇整理成的策略頁<\/li>\n<li><a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>：延長測到 2009 年的後續研究<\/li>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：配對交易可能撐不住的原因<\/li>\n<li><a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>：作者用價差估計成本約 162 bps<\/li>\n<li><a class=\"wl\" href=\"#momentum\">動量策略<\/a>：方向相反：動量賭偏離會延續，配對賭偏離會回來<\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "bps", "excess-return", "law-of-one-price", "pairs-decline-2010", "pairs-guide", "pairs-trading", "retail", "transaction-costs", "twin-shares-2009", "who-pays"], "maybe": []}, "twin-shares-2009": {"title": "雙胞胎股票的套利風險（de Jong, Rosenthal & van Dijk 2009）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一家公司的兩種股票價格可以差 30% 以上，套利平均有賺，但可能要等好幾年才收斂。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>12 組「雙重上市公司」（又叫連體嬰公司），例如 Royal Dutch／Shell、Unilever。<\/li>\n<li>Royal Dutch／Shell 和 Unilever 的期間是 1980 年 1 月 1 日到 2002 年 10 月 3 日；其他組從合併日開始。<\/li>\n<\/ul>\n<p><strong>什麼是雙重上市公司<\/strong>：兩家公司合併營運、共享現金流，但各自保留在不同國家上市的股票。Royal Dutch 在荷蘭、Shell 在英國，兩者分的是同一份獲利（按固定比例），所以兩檔股票的價格應該永遠維持固定比例。這是比 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a> 更純粹的配對：不是「走勢像」，而是「本來就是同一個東西」。<\/p>\n<h2>方法<\/h2>\n<ol>\n<li>算每組雙胞胎的實際價格比和理論比例差多少（取對數的偏離百分比）。<\/li>\n<li><strong>進場<\/strong>：偏離超過 10%，買便宜的、空貴的。<\/li>\n<li><strong>出場<\/strong>：偏離縮到 5% 以內，或持有滿一年（260 個交易日）強制平倉。<\/li>\n<li>算入成本：每筆 25 bps 佣金，建倉時付一半 40 bps 的買賣價差。<\/li>\n<li>算入保證金規則：一開始要 50% 保證金，跌破維持水準就被追繳、部分平倉。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li><strong>Royal Dutch／Shell 的偏離<\/strong>：平均絕對偏離約 10%，標準差約 12.7%，最低 −36.2%，最高 +19.8%。<\/li>\n<li>12 組在研究期間都出現過超過 15% 的偏離，其中 5 組超過 20%。<\/li>\n<li>基準策略平均每月 1.18%，約每年 14.2%（風險調整前）；用三因子模型調整後，超額報酬最高約每年 8.9%。<\/li>\n<li>進場門檻拉高到 14–18% 時超額報酬更高，但交易次數變很少。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>論文沒有點名對手方。更早的 Froot &amp; Dabora（1999）發現，雙胞胎的相對價格會跟著各自主要交易市場的漲跌走：例如紐約大盤相對英國上漲時，在美國交易較多的那一檔就變貴（Wiki 只讀了該篇的摘要）。Wiki 據此推論，付錢的可能是各國市場裡跟著本地行情追高殺低的投資人。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>兩檔股票分的是同一份現金流，所以價格比例<strong>最後<\/strong>一定會回到理論值。問題是「最後」是什麼時候。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>收斂時間不確定<\/strong>：沒有任何日期保證會收斂。有些部位拉了將近 9 年；基準策略下，Royal Dutch／Shell 的部位加起來持有了約 7 年半，差不多是樣本期的三分之一。<\/li>\n<li><strong>中途大虧<\/strong>：持有滿一年被強制平倉的部位，最多虧掉投入資金的 16.5%；有些策略的單筆虧損最多到 23%。127 筆裡有 11 筆是虧的。<\/li>\n<li><strong>保證金追繳<\/strong>：超過 10% 的部位至少被追繳一次，很多是在錯價擴大時連續被追繳。<\/li>\n<li><strong>波動很大<\/strong>：套利報酬的年化波動約 31–35%，比 S&amp;P 500 的 22–24% 還高。「套利」聽起來安全，實際上比買大盤還顛簸。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>上面的報酬已經扣掉佣金、價差，也模擬了保證金規則，風險調整後每年最高約 8.9%。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong><\/p>\n<ul>\n<li>12 組、1980–2002、Royal Dutch／Shell 偏離 −36.2% 到 +19.8%、10%／5%／一年的規則、每月 1.18%、超額報酬最高約 8.9%、將近 9 年、7 年半、16.5%、23%、11／127、超過 10% 被追繳、波動 31–35%。<\/li>\n<li>這篇<strong>沒有<\/strong>提到 LTCM 或 1998 年。Royal Dutch／Shell 在 2005 年合併成單一股票，作者沒有納入樣本。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>付錢的是跟著本地行情追高殺低的投資人。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>作者網站上的全文 PDF（<em>Review of Finance<\/em>, 2009）。卷期號沒有從 PDF 上核對到。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：最純粹的配對：同一家公司的兩種股票<\/li>\n<li><a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：LTCM 正是做這種交易<\/li>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：收斂時間不確定、中途被追繳保證金<\/li>\n<li><a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>：分同一份現金流，價格比例卻能偏離 36%<\/li>\n<\/ul>", "back": ["arbitrageurs", "law-of-one-price", "leverage", "limits-of-arbitrage", "ltcm", "ltcm-2006", "pairs-guide", "pairs-trading"], "maybe": []}, "cross-exchange-arb": {"title": "跨交易所套利", "type": "strategy", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一個幣在 A 交易所比 B 便宜，就在 A 買、在 B 賣，賺中間的差。<\/p>\n<h2>怎麼做<\/h2>\n<ol>\n<li>同時盯多家交易所的價格。<\/li>\n<li>價差大於所有成本時，在便宜的交易所買、在貴的交易所賣。<\/li>\n<li>把幣和錢搬回原位，準備下一次。這一步最難：幣要等區塊確認，法幣要跨國匯款。<\/li>\n<\/ol>\n<p>實務上常見的做法是兩邊都先放好幣和錢，同時下單，之後再慢慢搬回平衡，這是一般做法，不是論文的內容。<\/p>\n<h2>在賺誰的錢<\/h2>\n<p>賺的是在溢價市場買幣的人（Wiki 推論）。例如 2017–2018 年韓國的比特幣價格比美國高 15% 以上，在韓國買的人多付了這段。見 <a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>錢和幣都能自由搬動，而且搬的期間價格不會大變。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>資本管制<\/strong>：錢搬不回來，價差就會一直存在，而且套利者拿不到。這是跨國價差能大到 40% 的主因。<\/li>\n<li><strong>同一國內<\/strong>：搬錢容易，價差通常不到 1%，扣掉手續費可能就沒了。<\/li>\n<li>交易所被駭、凍結提款的風險。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>論文只估潛在利潤（2017 年 12 月到 2018 年 2 月至少 20 億美元），沒有估實際能拿到多少。要扣掉手續費、匯款成本、搬運期間的價格風險。<\/p>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>：34 家交易所、19 個地區，跨國價差遠大於國內價差。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>：這個策略的證據來源<\/li>\n<li><a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>：同一個比特幣不同價的原理<\/li>\n<li><a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>：同樣是「同一個東西兩個價格」，但靠速度<\/li>\n<li><a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>：誰在做這種套利<\/li>\n<\/ul>", "back": ["arbitrageurs", "crypto-arb-2020", "hft-latency-arb", "law-of-one-price", "who-pays"], "maybe": []}, "hft-latency-arb": {"title": "高頻延遲套利", "type": "strategy", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>兩個市場賣同一個東西，價格動時總有幾毫秒不同步，最快的人搶先吃掉。<\/p>\n<h2>怎麼做<\/h2>\n<ol>\n<li>找兩個追蹤同一資產的商品，例如 S&amp;P 500 期貨和 S&amp;P 500 ETF。<\/li>\n<li>一邊的價格先動，另一邊的掛單還沒來得及改，就是「過時報價」。<\/li>\n<li>在過時的那邊買或賣，同時在另一邊反向操作，鎖住價差。<\/li>\n<li>整個過程要在幾毫秒內完成，所以需要專線、機房就近擺放。<\/li>\n<\/ol>\n<h2>在賺誰的錢<\/h2>\n<p>賺的是<strong>掛單者<\/strong>（<a class=\"wl\" href=\"#market-makers\">做市商<\/a>）的錢：他們的報價被狙擊。做市商會把這個損失加進價差，最後由所有一般投資人付。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>市場連續撮合、先到先得，而且兩個市場的價格最終一定會對齊。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li>有人比你快，你就拿不到。<\/li>\n<li>交易所改成批次撮合，這類機會就不存在。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>每次扣掉價差後約 0.09 指數點，ES–SPY 一年約 7,500 萬美元。但要先投入大量資金買速度，而且要一直投下去。<\/p>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>：2005–2011 年，機會持續時間從 97 毫秒縮到 7 毫秒，每次利潤卻沒變小。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>：這個策略的證據來源<\/li>\n<li><a class=\"wl\" href=\"#market-makers\">做市商<\/a>：被狙擊的對象<\/li>\n<li><a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>：速度競爭的成本最後變成更寬的價差<\/li>\n<li><a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a>：同類套利，但被資本管制擋住而不是速度<\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "cross-exchange-arb", "hft-race-2015", "law-of-one-price", "market-makers", "who-pays"], "maybe": []}, "kalman-trend": {"title": "卡爾曼濾波趨勢策略", "type": "strategy", "updated": "2026-11-24", "html": "<h2>一句話<\/h2>\n<p>用卡爾曼濾波器預測下一根價格，預測比現價高就做多、低就做空。<\/p>\n<h2>怎麼做<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 380\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：雜訊很多的價格點、12 天移動平均線和卡爾曼濾波器線。價格在中間轉頭向下時，卡爾曼濾波器比移動平均更早跟著轉彎\">\n<line x1=\"392.9\" x2=\"392.9\" y1=\"30\" y2=\"320\" class=\"k-turn\"/>\n<text x=\"398.9\" y=\"26\" class=\"f-lab\">真實走勢在這裡轉頭向下<\/text>\n<circle cx=\"40.0\" cy=\"308.9\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"45.9\" cy=\"280.3\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"51.8\" cy=\"266.8\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"57.6\" cy=\"286.3\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"63.5\" cy=\"295.1\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"69.4\" cy=\"271.6\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"75.3\" cy=\"259.3\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"81.2\" cy=\"245.9\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"87.1\" cy=\"277.8\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"92.9\" cy=\"275.2\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"98.8\" cy=\"240.3\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"104.7\" cy=\"240.1\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"110.6\" cy=\"219.8\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"116.5\" cy=\"224.4\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"122.4\" cy=\"237.4\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"128.2\" cy=\"236.2\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"134.1\" cy=\"188.2\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"140.0\" cy=\"228.6\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"145.9\" cy=\"232.4\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"151.8\" cy=\"234.0\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"157.6\" cy=\"211.1\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"163.5\" cy=\"206.4\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"169.4\" cy=\"210.1\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"175.3\" cy=\"201.9\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"181.2\" cy=\"192.8\" r=\"2.2\" class=\"k-dot\"/><circle cx=\"187.1\" cy=\"182.5\" r=\"2.2\" class=\"k-dot\"/><circle 40.0,95.2 L445.9,106.4 L451.8,118.4 L457.6,125.7 L463.5,127.1 L469.4,124.3 L475.3,126.0 L481.2,128.1 L487.1,132.4 L492.9,137.5 L498.8,145.4 L504.7,149.7 L510.6,148.9 L516.5,160.5 L522.4,172.7 L528.2,169.4 L534.1,176.7 L540.0,179.8 L545.9,183.8 L551.8,198.6 L557.6,192.5 L563.5,192.3 L569.4,201.6 L575.3,207.1 L581.2,215.8 L587.1,229.0 L592.9,236.3 L598.8,238.7 L604.7,235.9 L610.6,235.1 L616.5,237.4 L622.4,232.0 L628.2,238.5 L634.1,235.2 L640.0,230.7 L645.9,234.3 L651.8,244.9 L657.6,248.3 L663.5,244.8 L669.4,240.1 L675.3,231.0 L681.2,237.2 L687.1,236.8 L692.9,233.2 L698.8,234.5 L704.7,247.2 L710.6,240.4 L716.5,227.1 L722.4,223.6 L728.2,231.0 L734.1,234.4 L740.0,233.8\" class=\"k-kf\"/>\n<g class=\"f-lab\"><circle cx=\"46\" cy=\"346\" r=\"4\" class=\"k-dot\"/><text x=\"56\" y=\"350\">每天的價格（有雜訊）<\/text>\n<line x1=\"230\" x2=\"260\" y1=\"346\" y2=\"346\" class=\"k-ma\"/><text x=\"268\" y=\"350\">12 天移動平均：慢半拍<\/text>\n<line x1=\"450\" x2=\"480\" y1=\"346\" y2=\"346\" class=\"k-kf\"/><text x=\"488\" y=\"350\">卡爾曼濾波器：較早轉彎<\/text><\/g>\n<text x=\"740\" y=\"374\" text-anchor=\"end\" class=\"f-note\">示意，非真實資料（模擬產生）<\/text>\n<\/svg><\/figure>\n<ol>\n<li><strong>選一個價格模型<\/strong>：例如「價格有位置和速度」，或「價格 = 短期成分 + 長期成分」。<\/li>\n<li><strong>每根 K 棒跑一次「預測 → 修正」<\/strong>：先用模型猜這根的價格，看到真實價格後往它靠近一點。<\/li>\n<li><strong>交易<\/strong>：模型預測的下一根價格高於昨天收盤價加一點緩衝就做多，低於昨天收盤價減一點緩衝就做空。<\/li>\n<\/ol>\n<p>和移動平均的差別：移動平均只會把過去平均，所以慢半拍；卡爾曼濾波器知道價格最近往哪個方向、多快，所以能往前猜。見 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>。<\/p>\n<h2>在賺誰的錢<\/h2>\n<p>目前沒有來源回答。Wiki 推論：追趨勢的部分和 <a class=\"wl\" href=\"#momentum\">動量策略<\/a> 類似，賺的可能是對消息反應慢的人；但唯一的來源證據不足，見下面兩段。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>價格裡有可以抓到的趨勢，不是完全隨機亂走。<\/li>\n<li>調出來的參數在未來也適用。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>參數是在同一段資料上調出來的<\/strong>：唯一的來源用同一年調參數、又用同一年報告績效，沒有樣本外測試。見 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>。<\/li>\n<li><strong>模型越複雜，越容易背答案<\/strong>：最複雜的模型有 15 個參數，整年只有 48 筆交易。<\/li>\n<li>市場從有趨勢變成亂跳時，預測會一直被打臉，來回進出。這是追趨勢策略的通病（Wiki 推論，來源沒有測）。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>來源已扣每次一來一回 4 美元的手續費，最好的模型一年淨賺約 4 萬美元（1 口 S&amp;P 500 迷你期貨）。但因為是同一年調參，這個數字不能當成未來的預期。滑價沒有討論。見 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>。<\/p>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>：2015–2016 年 S&amp;P 500 迷你期貨日線，四個模型都賺錢，最複雜的模型 4 最好。但參數和績效用的是同一年的資料。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>：策略用到的濾波器怎麼運作<\/li>\n<li><a class=\"wl\" href=\"#kalman-velocity\">卡爾曼濾波器（二）：加入速度與拿來交易<\/a>：加入速度後怎麼產生交易訊號<\/li>\n<li><a class=\"wl\" href=\"#momentum\">動量策略<\/a>：方向相同的想法：追趨勢<\/li>\n<li><a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>：唯一的證據來源，以及它的問題<\/li>\n<\/ul>", "back": ["kalman-filter", "kalman-trend-2016", "kalman-velocity", "momentum", "who-pays"], "maybe": []}, "momentum": {"title": "動量策略", "type": "strategy", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>買最近漲最多的、賣最近跌最多的，賭趨勢會再延續一陣子。<\/p>\n<h2>怎麼做<\/h2>\n<ol>\n<li>選一段「回看期」（例如過去 6 個月），把所有股票依報酬排名。<\/li>\n<li>買前 10%，放空後 10%，金額相等。<\/li>\n<li>持有一段時間（例如 6 個月），然後重新排名。<\/li>\n<\/ol>\n<h2>在賺誰的錢<\/h2>\n<p>主流解釋是：市場對消息反應太慢，價格要好幾個月才走完。動量交易者提早站上去，賺的是「反應慢的人」讓出來的那一段。這個對手方是推論，原始論文沒有點名。見 <a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>價格反應延遲，而且延遲不會很快被其他交易者消滅。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li>持有超過約 12 個月就開始反轉。<\/li>\n<li>在 1927–1940 年的美股完全賺不到錢，持有一年反而虧損。<\/li>\n<li>參與的人變多之後還剩多少，這篇來源沒有涵蓋，記在 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>以 1965–1989 年美股、單邊成本 0.5% 計算，每年仍約 9%。成本假設越接近真實，數字越可信。<\/p>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>：6 個月回看、6 個月持有，每月約 0.95% 超額報酬。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>：這個策略的證據來源<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：方向相反：動量賭偏離會延續，配對賭偏離會回來<\/li>\n<li><a class=\"wl\" href=\"#kalman-trend\">卡爾曼濾波趨勢策略<\/a>：用濾波器抓趨勢的版本<\/li>\n<li><a class=\"wl\" href=\"#excess-return\">超額報酬<\/a>：動量的報酬是超額報酬<\/li>\n<\/ul>", "back": ["excess-return", "kalman-trend", "kalman-trend-2016", "momentum-1993", "pairs-trading", "pairs-trading-2006", "who-pays"], "maybe": []}, "pairs-trading": {"title": "配對交易", "type": "strategy", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>兩個像雙胞胎的價格拉開時，買便宜的、空貴的，賭它們會靠回來。<\/p>\n<h2>怎麼做<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 452\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"配對交易示意圖：上方是兩檔股票的價格，下方是兩者的價差與正負兩個標準差的界線\">\n<rect x=\"427.7\" y=\"26\" width=\"56.2\" height=\"374\" class=\"f-hold\"/>\n<text x=\"56\" y=\"20\" class=\"f-h\">兩檔股票的價格<\/text>\n<path d=\"M56.0,129.9 L59.1,127.8 L62.2,126.8 L65.4,120.8 L68.5,129.3 L71.6,123.3 L74.7,136.3 L77.9,119.6 L81.0,113.5 L84.1,126.4 L87.2,123.7 L90.4,113.3 L93.5,117.7 L96.6,116.4 L99.7,113.4 L102.8,123.2 L106.0,111.3 L109.1,99.8 L112.2,100.1 L115.3,93.3 L118.5,82.1 L121.6,85.2 L124.7,96.7 L127.8,99.9 L131.0,97.4 L134.1,86.6 L137.2,86.2 L140.3,90.9 L143.5,102.2 L146.6,101.2 L149.7,99.1 L152.8,100.9 L155.9,114.0 L159.1,98.8 L162.2,89.6 L165.3,81.7 L168.4,82.6 L171.6,83.3 L174.7,74.1 L177.8,63.0 L180.9,65.1 L184.1,77.3 L187.2,77.0 L190.3,73.6 L193.4,70.1 L196.5,76.3 L199.7,73.1 L202.8,73.8 L205.9,69.7 L209.0,51.0 L212.2,49.8 L215.3,65.2 L218.4,67.3 L221.5,72.9 L224.7,70.8 L227.8,75.0 L230.9,76.0 L234.0,72.1 L237.2,70.5 L240.3,68.2 L243.4,61.6 L246.5,66.9 L249.6,57.4 L252.8,63.4 L255.9,74.6 L259.0,73.8 L262.1,69.8 L265.3,69.6 L268.4,59.2 L271.5,66.4 L274.6,62.9 L277.8,61.7 L280.9,73.8 L284.0,71.8 L287.1,79.0 L290.2,73.9 L293.4,73.8 L296.5,75.2 L299.6,65.3 L302.7,60.7 L305.9,59.9 L309.0,51.2 L312.1,61.5 L315.2,59.7 L318.4,61.3 L321.5,70.0 L324.6,70.3 L327.7,67.4 L330.8,77.5 L334.0,74.3 L337.1,74.9 L340.2,84.4 L343.3,82.8 L346.5,82.6 L349.6,99.3 L352.7,97.3 L355.8,95.3 L359.0,94.6 L362.1,91.6 L365.2,84.4 L368.3,93.2 L371.
