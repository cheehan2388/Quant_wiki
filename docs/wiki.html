const DATA = {"pages": {"ltcm": {"title": "LTCM：最會算的人，賭雙胞胎會回來", "type": "case", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>賭對了方向、算錯了時間：價差最後真的收斂了，但 LTCM 等不到那一天。<\/p>\n<h2>發生了什麼<\/h2>\n<figure class=\"fig\"><ol class=\"tl\" aria-label=\"LTCM 時間線\">\n  <li><b>1994 年 2 月<\/b><span>LTCM 開始交易<\/span><\/li>\n  <li><b>1995–1996<\/b><span>扣費後報酬 42.8%、40.8%<\/span><\/li>\n  <li><b>1997 年 8 月<\/b><span>自有資本 67 億美元，資產 1,260 億美元<\/span><\/li>\n  <li><b>1997<\/b><span>Royal Dutch 比理論價貴約 8%：空 Royal Dutch、買 Shell<\/span><\/li>\n  <li><b>1998 年初<\/b><span>槓桿約 27 倍；溢價開始擴大<\/span><\/li>\n  <li class=\"bad\"><b>1998 年 8 月 17 日<\/b><span>俄羅斯債務違約，資金逃向安全資產<\/span><\/li>\n  <li class=\"bad\"><b>1998 年 8 月<\/b><span>單月虧掉 44% 資本；溢價一度超過 17%<\/span><\/li>\n  <li class=\"bad\"><b>1998 年 9 月<\/b><span>14 家銀行出資 36 億美元接管 90% 股權<\/span><\/li>\n  <li class=\"good\"><b>2001 年春<\/b><span>Royal Dutch／Shell 的溢價消失：LTCM 賭對了，但已經不在了<\/span><\/li>\n<\/ol>\n<p class=\"fig-src\">資料：MacKenzie（2006）第 8 章，見來源頁「LTCM 與套利」。<\/p>\n<\/figure>\n<p><strong>一家明星基金<\/strong>。長期資本管理公司（Long-Term Capital Management，LTCM）1994 年開始交易，核心成員是所羅門兄弟債券套利部門的交易員，還有學者。1995、1996 年扣費後報酬都超過四成。1997 年 8 月，它用 67 億美元的自有資本撐起 1,260 億美元的資產，等於約 19 倍槓桿（1,260 ÷ 67，Wiki 的算術）；1998 年初約 27 倍。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>一筆教科書級的配對交易<\/strong>。Royal Dutch 和 Shell 是「同一家公司的兩種股票」：集團的現金流按 60：40 分給它們，所以價格應該永遠維持固定比例。但 1997 年，Royal Dutch 比理論價貴了約 8%。LTCM 放空貴的 Royal Dutch、買進便宜的 Shell，賭價差會縮小。大盤和油價的漲跌兩邊互相抵銷，看起來幾乎沒有風險。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>價差反而拉開<\/strong>。1998 年初溢價開始擴大。8 月 17 日俄羅斯債務違約，全世界的資金逃向最安全、最好賣的資產，各種「便宜的會漲回來」的交易同時往反方向走。Royal Dutch 的溢價一度超過 17%，比 LTCM 進場時大一倍。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>所有部位一起出事<\/strong>。LTCM 不只做這一筆，還有幾十種債券、利率交換的價差交易。平常這些部位彼此相關性只有 0.1 左右，危機中升到約 0.7。8 月 21 日單日虧損 5.5 億美元，整個 8 月虧掉 44% 的資本。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>被接管<\/strong>。9 月，紐約聯準會出面協調，14 家銀行出資 36 億美元、取得 90% 的股權。原本的投資人和合夥人只剩約 4 億美元，大約是原來的十分之一。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>結局的諷刺<\/strong>。Royal Dutch／Shell 的溢價到 2001 年春天就消失了。LTCM 的判斷是對的，只是它撐不到那一天。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<h2>跟策略的關係<\/h2>\n<p>LTCM 的 Royal Dutch／Shell 交易，就是 <a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a> 最純粹的版本：不是「走勢很像」的兩檔股票，而是「本來就是同一家公司」的兩檔股票。照理說，這是最安全的配對。<\/p>\n<p>研究 12 組這類雙胞胎股票的論文發現，這種套利平均確實有賺，但：\n- Royal Dutch／Shell 的偏離最大到 −36%、+20%；\n- 有些部位要拉將近 9 年才收斂；\n- 超過 10% 的部位被追繳過保證金。\n見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/p>\n<p>所以 LTCM 遇到的不是倒楣的意外，而是這類交易本來就有的風險，只是被槓桿放大了。<\/p>\n<h2>學到什麼<\/h2>\n<ol>\n<li><strong>「最後會收斂」不等於「你撐得到收斂」<\/strong>。這正是 <a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a> 在講的事：價差拉開時，套利者帳面虧損、出資人撤資、保證金被追繳，在機會最好的時候被迫認賠。理論出自 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>，比 LTCM 倒下早一年發表。<\/li>\n<li><strong><a class=\"wl\" href=\"#leverage\">槓桿<\/a> 把小價差變成大報酬，也把小波動變成大災難<\/strong>。27 倍槓桿下，資產只要跌約 4%，自有資本就歸零（Wiki 的算術）。<\/li>\n<li><strong>大家都在做同一筆交易時，分散投資會失效<\/strong>。MacKenzie 認為 LTCM 的成功引來大量模仿，形成一個大家都持有的「超級組合」；有人被迫賣，其他人就跟著虧，價差擴大變成自我強化。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/li>\n<li><strong>用短期歷史估風險會低估災難<\/strong>。Jorion（2000）的摘要指出，LTCM 依賴短期歷史資料，而且風險過度集中，所以嚴重低估了風險。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a> 的「讀了什麼」。<\/li>\n<\/ol>\n<h2>相關頁面<\/h2>\n<ul>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>、<a class=\"wl\" href=\"#leverage\">槓桿<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>導覽：<a class=\"wl\" href=\"#pairs-guide\">配對交易導覽：賭雙胞胎會回來<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "leverage", "limits-arbitrage-1997", "limits-of-arbitrage", "ltcm-2006", "pairs-guide", "pairs-trading", "pairs-trading-2006", "twin-shares-2009", "who-pays"]}, "bid-ask-spread": {"title": "買賣價差", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一時間，你能買到的價格永遠比你能賣出的價格高一點，中間那段就是價差。<\/p>\n<h2>白話解釋<\/h2>\n<p>想像換外幣：銀行牌告的「賣出價」比「買入價」高。你換了馬上換回來，一定虧一點，那一點就是價差。<\/p>\n<p>股票也一樣：市場上同時有人掛單要買（bid）、有人掛單要賣（ask），ask 永遠比 bid 高。你想馬上成交，就得用比較差的那個價格，等於每次交易都付出半個價差。<\/p>\n<p>還有一個陷阱叫<strong>買賣價差反彈<\/strong>（bid-ask bounce）：收盤價有時落在 bid、有時落在 ask，價格看起來在跳，其實什麼都沒變。用收盤價做回測，可能把這種假跳動誤當成可以賺的機會。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li>散戶一來一回大約付 1% 的價差（1991–1996 年）。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/li>\n<li>配對交易的研究把「訊號出現後等一天才進場」，報酬每月少 30–55 bps，作者用這個差距估計價差成本。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li>價差為什麼存在：做市商怕報價被高頻交易者狙擊，會把預期損失加進價差，所以速度競爭會讓價差變寬。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>上層概念：<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a><\/li>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>、<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a><\/li>\n<li>收價差的人：<a class=\"wl\" href=\"#market-makers\">做市商<\/a><\/li>\n<\/ul>", "back": ["hft-latency-arb", "hft-race-2015", "market-makers", "overtrading-2000", "pairs-guide", "pairs-trading", "pairs-trading-2006", "transaction-costs"]}, "bps": {"title": "bps（基點）", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>1 bp 是萬分之一，也就是 0.01%，用來講很小的報酬或成本。<\/p>\n<h2>白話解釋<\/h2>\n<p>量化交易常在比很小的數字，用百分比寫會出現一堆小數點，所以改用 bps：\n- 1 bp = 0.01%\n- 10 bps = 0.1%\n- 100 bps = 1%<\/p>\n<p>換成錢：投入 100 萬元，1 bp 就是 100 元。<\/p>\n<p>看到「每月 38 bps」就是每月 0.38%；「成本 162 bps」就是 1.62%。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li>動量研究提到，另一份研究估計當時的交易成本只有約 23 bps，所以假設 0.5%（50 bps）是保守的。見 <a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>。<\/li>\n<li>配對交易：1989 年前每月約 118 bps，之後約 38 bps；一來一回成本約 162 bps。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>概念：<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a><\/li>\n<\/ul>", "back": ["momentum-1993", "pairs-decline-2010", "pairs-guide", "pairs-trading-2006"]}, "excess-return": {"title": "超額報酬", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>你的報酬減掉一個「什麼都不做也拿得到」的基準，剩下的才算本事。<\/p>\n<h2>白話解釋<\/h2>\n<p>一年賺 15% 聽起來很好，但如果那一年大盤漲 18%，你其實輸了。所以研究不看絕對報酬，而是看「比基準多多少」。<\/p>\n<p>基準有好幾種，越嚴格越可信：\n1. <strong>大盤指數<\/strong>：跟市場比。\n2. <strong>風險調整後<\/strong>：如果你的組合比大盤更容易大漲大跌，本來就該多賺一點，要先把這部分扣掉（CAPM、Fama-French 因子模型就是在做這件事）。<\/p>\n<p>研究裡說「每月 1% 超額報酬」，通常是指扣掉風險之後還多出來的部分。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li>動量：每月約 0.95% 超額報酬，而且組合的 beta 比輸家組還低，所以不是靠多承擔市場風險。見 <a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>。<\/li>\n<li>散戶：用大盤和三因子模型當基準，交易最多的那組明顯落後。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/li>\n<li>配對交易：用五個風險因子調整後，超額報酬只少 10–20 bps，仍然顯著。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>策略：<a class=\"wl\" href=\"#momentum\">動量策略<\/a>、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["bps", "momentum", "momentum-1993", "overtrading-2000", "pairs-decline-2010", "pairs-guide", "pairs-trading-2006"]}, "law-of-one-price": {"title": "一價定律", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一個東西在不同地方，扣掉搬運成本後應該賣同一個價錢。<\/p>\n<h2>白話解釋<\/h2>\n<p>如果台北一顆蘋果 30 元、台中 20 元，有人就會在台中買、拿去台北賣，直到兩地價格差不多為止。把價格推回一致的人就是<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>，他們賺的就是「價格不一致」的那段。<\/p>\n<p>所以套利能不能賺錢，取決於兩件事：\n1. 價格為什麼會不一致？\n2. 是什麼擋住了別人把它推回一致？（速度、成本、資本管制）<\/p>\n<p>擋住的東西越難跨過，價差就越大、存在越久。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li><strong>幾乎相同的兩檔股票<\/strong>：配對交易賺的是「近似替代品」暫時定錯的價格。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li><strong>同一家公司的兩種股票<\/strong>：Royal Dutch 和 Shell 分同一份現金流，價格比例卻可以偏離 −36% 到 +20%，擋住別人的是「不知道要等多久」。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li><strong>同一個指數的兩種商品<\/strong>：S&amp;P 500 期貨和 ETF 在毫秒尺度上不同步，擋住別人的是速度。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/li>\n<li><strong>同一個比特幣在不同國家<\/strong>：價差可以到 40%，擋住別人的是資本管制。見 <a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>、<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>、<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>、<a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a><\/li>\n<li>為什麼常常做不到：<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "cross-exchange-arb", "crypto-arb-2020", "hft-latency-arb", "hft-race-2015", "limits-of-arbitrage", "ltcm", "pairs-guide", "pairs-trading", "pairs-trading-2006", "twin-shares-2009", "who-pays"]}, "leverage": {"title": "槓桿", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>借錢放大部位：賺的時候放大，虧的時候也一樣放大。<\/p>\n<h2>白話解釋<\/h2>\n<p>配對交易每次賺的價差通常很小。為了讓報酬看起來夠大，套利者會借錢或用保證金，把部位做到自有資金的好幾倍。<\/p>\n<ul>\n<li><strong>槓桿 10 倍<\/strong>：用 1 元本錢做 10 元的部位。部位漲 1%，本錢賺 10%；部位跌 10%，本錢就沒了。<\/li>\n<li><strong>保證金追繳<\/strong>：券商借你錢時，會要求帳上至少留一定比例。虧到低於這個比例，就要補錢，補不出來就被強制平倉。<\/li>\n<\/ul>\n<p>槓桿最危險的地方，不是它讓你虧更多，而是它決定了<strong>你能撐多久<\/strong>。價差最後會收斂也沒用，如果你在收斂前就被迫平倉了。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li><strong>LTCM<\/strong>：1994–1997 年槓桿在 14 到 31 倍之間，1998 年初約 27 倍。27 倍槓桿下，資產只要跌約 3.7%（1 ÷ 27），自有資本就歸零，這是 Wiki 的算術。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/li>\n<li><strong>雙胞胎股票套利<\/strong>：研究假設一開始要 50% 保證金，結果超過 10% 的部位至少被追繳過一次，很多是在錯價擴大時連續被追繳。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li><strong>理論<\/strong>：已經把資金投滿的套利者，遇到虧損和撤資時沒有餘裕撐住，只能平倉。見 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>、<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>、<a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>概念：<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a><\/li>\n<li>案例：<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a><\/li>\n<\/ul>", "back": ["limits-of-arbitrage", "ltcm", "pairs-guide", "pairs-trading"]}, "limits-of-arbitrage": {"title": "套利的極限", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>錯價明明存在，套利者卻不敢、或撐不住去修正它，所以錯價可以存在很久。<\/p>\n<h2>白話解釋<\/h2>\n<p>教科書說：只要有錯價，套利者就會進場把它修正掉，所以錯價不會持久。現實中有好幾個東西擋住套利者：<\/p>\n<ol>\n<li><strong>時間<\/strong>：錯價最後會回來，但不知道什麼時候。等待期間要付融資成本，還可能先虧錢。<\/li>\n<li><strong>錢不是自己的<\/strong>：專業套利者管理別人的錢。出資人看到虧損就撤資，即使那時其實是最好的機會。<\/li>\n<li><strong>被迫平倉<\/strong>：保證金被追繳、風險上限被觸發，就得在最差的價位賣出；而大家一起賣，又把價格推得更歪。<\/li>\n<li><strong>別人也在做<\/strong>：太多人持有同樣的部位，一個人被迫賣，所有人一起虧。<\/li>\n<li><strong>關係可能真的變了<\/strong>：配對的兩家公司可能真的不再一樣，價差就永遠不回來。<\/li>\n<\/ol>\n<p>研究配對交易的學者把這些整理成三種「套利風險」：基本面風險、雜訊交易者風險、同步風險（不知道其他套利者何時會一起進場）。見 <a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li><strong>理論<\/strong>：價格偏離越大、機會越好的時候，套利者越容易被出資人撤資、被迫平倉。見 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>。<\/li>\n<li><strong>雙胞胎股票<\/strong>：Royal Dutch／Shell 本來就是同一家公司，偏離卻可以到 −36%；有些套利部位要拉將近 9 年，超過一成的部位被追繳過保證金。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li><strong>配對交易變薄<\/strong>：1962–2009 年配對交易的利潤一路下降，作者認為套利風險變大最多解釋了 70% 的下降。見 <a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/li>\n<li><strong>LTCM<\/strong>：Royal Dutch／Shell 的溢價從約 8% 擴大到超過 17%，LTCM 在價差收斂前就被接管，價差到 2001 年才消失。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>、<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>、<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>、<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>、<a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>相反的理想：<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a><\/li>\n<li>放大器：<a class=\"wl\" href=\"#leverage\">槓桿<\/a><\/li>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "law-of-one-price", "leverage", "limits-arbitrage-1997", "ltcm", "pairs-guide", "pairs-trading", "pairs-trading-2006", "twin-shares-2009"]}, "transaction-costs": {"title": "交易成本", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>每買賣一次就要付出去的錢，策略賺的錢要先扣掉它才算數。<\/p>\n<h2>白話解釋<\/h2>\n<p>交易成本有好幾種：\n- <strong>佣金<\/strong>：付給券商的手續費。\n- <strong>買賣價差<\/strong>：同一時間，買進價永遠比賣出價高一點。你一買一賣，就平白損失這個差距。詳見 <a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>。\n- <strong>放空成本<\/strong>：要賣出自己沒有的股票，得先借券，借券要付費，也可能被收回。\n- <strong>速度成本<\/strong>：在高頻交易裡，最大的成本不是手續費，而是專線、機房這些「買速度」的投資。<\/p>\n<p>重點是：<strong>交易越頻繁，成本累積越多<\/strong>。一個策略「方向猜對」不夠，賺的幅度要大於成本才有用。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li>動量策略半年換手約 85%，假設單邊成本 0.5%，扣完每年還剩約 9%。見 <a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>。<\/li>\n<li>散戶一來一回付約 3% 佣金加 1% 價差，交易最多的人每年因此輸大盤約 6.5 個百分點。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/li>\n<li>配對交易估計一來一回成本約 162 bps，扣完每半年仍有 113–225 bps。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li>高頻套利每次扣完價差約 0.09 指數點，但要持續投入速度。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>玩家：<a class=\"wl\" href=\"#retail\">散戶<\/a>、<a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "bps", "brokers-exchanges", "crypto-arb-2020", "hft-race-2015", "momentum", "momentum-1993", "overtrading-2000", "pairs-guide", "pairs-trading", "pairs-trading-2006", "retail", "who-pays"]}, "index": {"title": "目錄", "type": "overview", "updated": "2026-11-23", "html": "<p>核心問題：<strong>交易策略到底在賺誰的錢？<\/strong> 先看總覽 <a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a>，或從第一個主題版本 <a class=\"wl\" href=\"#pairs-guide\">配對交易導覽：賭雙胞胎會回來<\/a> 開始。<\/p>\n<h2>來源（sources）<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>：買贏家、賣輸家（Jegadeesh &amp; Titman 1993）<\/li>\n<li><a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>：交易有害你的財富（Barber &amp; Odean 2000）<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>：配對交易（Gatev, Goetzmann &amp; Rouwenhorst 2006）<\/li>\n<li><a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>：高頻交易軍備競賽（Budish, Cramton &amp; Shim 2015）<\/li>\n<li><a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>：加密貨幣的交易與套利（Makarov &amp; Schoar 2020）<\/li>\n<li><a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>：簡單的配對交易還有用嗎？（Do &amp; Faff 2010）<\/li>\n<li><a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>：套利的極限（Shleifer &amp; Vishny 1997）<\/li>\n<li><a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>：雙胞胎股票的套利風險（de Jong 等 2009）<\/li>\n<li><a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>：LTCM 與套利（MacKenzie 2006）<\/li>\n<\/ul>\n<h2>策略（strategies）<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#momentum\">動量策略<\/a>：動量策略<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：配對交易<\/li>\n<li><a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>：高頻延遲套利<\/li>\n<li><a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a>：跨交易所套利<\/li>\n<\/ul>\n<h2>案例（cases）<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：LTCM：最會算的人，賭雙胞胎會回來<\/li>\n<\/ul>\n<h2>玩家（players）<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#retail\">散戶<\/a>：散戶<\/li>\n<li><a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a>：券商與交易所<\/li>\n<li><a class=\"wl\" href=\"#market-makers\">做市商<\/a>：做市商<\/li>\n<li><a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>：套利者<\/li>\n<\/ul>\n<h2>概念（concepts）<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>：交易成本<\/li>\n<li><a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>：買賣價差<\/li>\n<li><a class=\"wl\" href=\"#excess-return\">超額報酬<\/a>：超額報酬<\/li>\n<li><a class=\"wl\" href=\"#bps\">bps<\/a>：bps（基點）<\/li>\n<li><a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>：一價定律<\/li>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：套利的極限<\/li>\n<li><a class=\"wl\" href=\"#leverage\">槓桿<\/a>：槓桿<\/li>\n<\/ul>\n<h2>其他<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#log\">收錄紀錄<\/a>：收錄紀錄<\/li>\n<li><a class=\"wl\" href=\"#todo\">待寫清單<\/a>：待寫清單<\/li>\n<\/ul>", "back": []}, "log": {"title": "收錄紀錄", "type": "overview", "updated": "2026-11-23", "html": "<p>每次收錄、健檢都記一筆。格式：日期、動作、新增或更新的頁面、檢查抓到什麼、怎麼修。<\/p>\n<h2>2026-11-23 #0 建立骨架<\/h2>\n<ul>\n<li>新增：AGENTS.md、CLAUDE.md、tools/check.py、raw/sources.md、index、who-pays、todo、log。<\/li>\n<\/ul>\n<h2>2026-11-23 #1 收錄 momentum-1993<\/h2>\n<ul>\n<li>讀：期刊全文。<\/li>\n<li>新增：<a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#momentum\">動量策略<\/a>。<\/li>\n<li>更新：index、who-pays、todo。<\/li>\n<li>分支判斷：超額報酬、交易成本、bps 只出現在 1 篇，依規則先進 todo，不建概念頁。<\/li>\n<li>檢查：一次通過。<\/li>\n<\/ul>\n<h2>2026-11-23 #2 收錄 overtrading-2000<\/h2>\n<ul>\n<li>讀：期刊版全文。<\/li>\n<li>新增：<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#retail\">散戶<\/a>、<a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>。<\/li>\n<li>更新：index、who-pays（新增「反過來：誰在付錢」表）、todo。<\/li>\n<li>分支判斷：交易成本、超額報酬都到 2 篇。但這輪已新增 3 個非來源頁，碰到「一次超過 3 頁要先問」的上限，所以超額報酬延到下一輪。<\/li>\n<li>檢查第一次失敗，7 個問題：<\/li>\n<li>來源頁連到還不存在的 market-makers 和 bid-ask-spread。論文沒有直接說價差被誰收走，做市商頁沒有來源支持；價差也只出現在 1 篇。→ 拿掉兩個連結，改記進 todo。<\/li>\n<li>index 漏列 4 頁、log 漏記本篇。→ 補上。<\/li>\n<li>第二次檢查通過。<\/li>\n<\/ul>\n<h2>2026-11-23 #3 收錄 pairs-trading-2006<\/h2>\n<ul>\n<li>讀：2006 年工作論文全文，期刊版只讀摘要。兩個版本都有年化數字：期刊摘要寫「最高約 11%」，NBER 1999 年版摘要寫「最高約 12%」，來源頁採用期刊版的 11%。<\/li>\n<li>新增：<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>、<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>、<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a>（上一輪延後的）。<\/li>\n<li>更新：<a class=\"wl\" href=\"#momentum\">動量策略<\/a>（加上方向相反的對照）、<a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>（價差連結補回來）、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>（加放空成本與新例子）、<a class=\"wl\" href=\"#retail\">散戶<\/a>（散戶難借券）、index、who-pays、todo。<\/li>\n<li>分支判斷：bps 到 2 篇、套利者有直接來源，但這輪已新增 3 個非來源頁，延到下一輪。<\/li>\n<li>檢查：腳本一次通過。人工比對數字（162 bps、113–225 bps、118→38 bps）與工作論文一致。<\/li>\n<\/ul>\n<h2>2026-11-23 #4 收錄 hft-race-2015<\/h2>\n<ul>\n<li>讀：NBER 會議版全文前半部；期刊版沒有另外核對。<\/li>\n<li>新增：<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>、<a class=\"wl\" href=\"#market-makers\">做市商<\/a>、<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>。<\/li>\n<li>更新：<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>（做市商連結補上，但保留「推論」標示）、<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>（價差為什麼存在）、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>（速度成本）、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>、index、who-pays、todo。<\/li>\n<li>分支判斷：本來想建「高頻交易者」玩家頁，但它和策略頁 <a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a> 內容幾乎重複，改成併進 <a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a> 的「快速版」。一價定律到 2 篇、bps 第二次延後，都因 3 頁上限。<\/li>\n<li>檢查：腳本一次通過。人工檢查發現 <a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a> 的高頻列寫了「論文原話」，對照來源頁確認論文確實直接說成本轉嫁給一般投資人，保留。<\/li>\n<\/ul>\n<h2>2026-11-23 #5 收錄 crypto-arb-2020<\/h2>\n<ul>\n<li>讀：<strong>沒有拿到期刊全文<\/strong>。讀了期刊摘要、作者說明文、2018 年工作論文片段、CFA 摘要。來源頁的「讀了什麼」已標明可信度低一級。<\/li>\n<li>新增：<a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>、<a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>、<a class=\"wl\" href=\"#bps\">bps<\/a>（後兩頁是前幾輪延後的）。<\/li>\n<li>更新：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>（跨國版、資本不足）、<a class=\"wl\" href=\"#retail\">散戶<\/a>（溢價市場的買家）、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>、index、who-pays（加上「五篇看下來的共同點」）、todo（加上你的 OKX–Binance 實驗）。<\/li>\n<li>檢查抓到 3 個版本差異，都寫進來源頁：總利潤 10 億 vs 20 億美元、共同成分 80% vs 85%、韓國溢價「低於 15%」vs「超過 15%」。前兩個是作者不同版本，用期刊版；第三個是二手摘要和作者原文矛盾，用作者原文。<\/li>\n<li>人工檢查：來源頁原本把 <a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a> 列為相關玩家，但內文沒有實質內容支持，拿掉。<\/li>\n<\/ul>\n<h2>2026-11-23 配對交易篇：使用者決定先只上線配對交易，並加入 LTCM 的故事<\/h2>\n<h3>規則變更（使用者要求）<\/h3>\n<ul>\n<li>AGENTS.md 新增「案例」頁類型、圖表（<code>{{figure:名稱}}<\/code>，示意圖必須標明非真實資料）、版本（<code>editions/<\/code>）。check.py 同步更新。<\/li>\n<\/ul>\n<h3>#6 收錄 pairs-decline-2010<\/h3>\n<ul>\n<li>讀：<strong>只有摘要<\/strong>（全文在會員區），來源頁已標明。<\/li>\n<li>新增：<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/li>\n<\/ul>\n<h3>#7 收錄 limits-arbitrage-1997<\/h3>\n<ul>\n<li>讀：期刊全文。<\/li>\n<li>新增：<a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>。<\/li>\n<li>檢查發現：原本以為這篇有談 Royal Dutch／Shell，讀完確認<strong>沒有<\/strong>，只是理論；已在來源頁寫明，和 LTCM 的連結標為 Wiki 推論。<\/li>\n<\/ul>\n<h3>#8 收錄 twin-shares-2009<\/h3>\n<ul>\n<li>讀：全文 PDF。本來想收錄 Froot &amp; Dabora（1999），但 NBER 的 PDF 讀不到文字，只拿到摘要，改收錄這篇（它直接研究雙胞胎股票的套利風險，數字更完整）。Froot &amp; Dabora 只當輔助引用，標明只讀摘要。<\/li>\n<li>新增：<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<\/ul>\n<h3>#9 收錄 ltcm-2006<\/h3>\n<ul>\n<li>讀：MacKenzie 書第 8 章全文，Jorion（2000）只讀摘要。<\/li>\n<li>新增：<a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>、案例 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>、概念 <a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>（4 篇來源）、<a class=\"wl\" href=\"#leverage\">槓桿<\/a>（3 篇來源）。<\/li>\n<li>檢查抓到的矛盾：Royal Dutch 溢價在網路文章裡有 8%、18%、20% 三種說法，LTCM 部位「23 億美元」只出現在二手文章。採用 MacKenzie 的數字（1997 年約 8%，危機中一度超過 17%），23 億美元不採用。<\/li>\n<li>案例頁的「約 19 倍槓桿」是 1,260 ÷ 67 的算術，已標明。<\/li>\n<\/ul>\n<h3>更新<\/h3>\n<ul>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a> 大幅改寫：加上示意圖、數字例子、更好的配對方法、利潤下降表、四種失效情況。<\/li>\n<li>新增導覽頁 <a class=\"wl\" href=\"#pairs-guide\">配對交易導覽：賭雙胞胎會回來<\/a>，作為配對篇首頁。<\/li>\n<li>更新 <a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、index、who-pays、todo。<\/li>\n<\/ul>\n<h3>檢查<\/h3>\n<ul>\n<li>第一次執行 check.py 失敗 11 項：index 漏列 7 頁、log 漏記 4 篇。補上後通過。<\/li>\n<\/ul>\n<h2>2026-11-23 簡報：配對交易篇（slides/pairs-trading）<\/h2>\n<h3>新增工具<\/h3>\n<ul>\n<li><code>tools/check_slides.py<\/code>：檢查簡報每頁的數字能否在引用的 Wiki 頁找到、術語是否先解釋再使用、每頁正文是否超過 200 字。<\/li>\n<\/ul>\n<h3>第 1 次檢查：失敗 7 項<\/h3>\n<ul>\n<li>6 項是術語沒先解釋：放空、平倉、超額報酬、相關性、保證金、bps。寫稿時覺得這些詞「大家都懂」，但目標讀者是完全沒碰過交易的人。→ 在第一次出現的那一頁加上一句白話解釋。<\/li>\n<li>1 項是參考資料頁超過 200 字。→ 判斷這是檢查規則本身不合理（參考資料本來就長），調整檢查器：參考資料頁不算字數。<\/li>\n<\/ul>\n<h3>驗證檢查器本身<\/h3>\n<ul>\n<li>故意把兩個數字改錯（11% 改成 15%、−36% 改成 −46%），檢查器 2 個都抓到。確認數字檢查真的有作用，不是永遠通過。<\/li>\n<\/ul>\n<h3>第 2 次檢查：通過，共 16 頁<\/h3>\n<ul>\n<li>之後加入附錄 3 頁（流程圖、一次實際執行、反思），共 18 頁，再跑一次。<\/li>\n<\/ul>\n<h3>第 3 次檢查（加入附錄後）：失敗 2 項<\/h3>\n<ul>\n<li>「一次實際執行」和「反思」兩頁各超過 200 字（203、206）。→ 刪掉次要細節、縮短句子。<\/li>\n<\/ul>\n<h3>第 4 次檢查：通過，共 18 頁<\/h3>\n<h2>2026-11-23 網站首頁與「最新更新」<\/h2>\n<ul>\n<li>使用者發現：Wiki、簡報、流程說明分散在三個網址，別人不知道該看哪個。→ 新增首頁當唯一入口，右邊放「最新更新」欄（資料來自 <code>site/updates.md<\/code>）。<\/li>\n<li>簡報每頁的「知識來源」改成可點的連結，直接跳到 Wiki 的那一頁；Wiki 和簡報都加上回首頁的連結。<\/li>\n<li>新增 <code>tools/build_site.py<\/code>：先跑兩個檢查器，通過才產生整個 <code>docs/<\/code>。更新紀錄連到不存在的頁面也會擋下。<\/li>\n<li>AGENTS.md 新增第 10 節：不手改 <code>docs/<\/code>、每次發布補一筆更新紀錄。<\/li>\n<li>截圖檢查抓到：封面雙胞胎線中間的黃色區塊沒顯示（CSS 優先順序被蓋掉）、手機上圖片上下留白太多、首頁頁數和更新紀錄寫的不一致（16 vs 17）。三個都修好。<\/li>\n<\/ul>\n<h2>2026-11-23 簡報拿掉「這份簡報怎麼做出來的」那一頁<\/h2>\n<ul>\n<li>使用者要求：這頁是寫給老師的作業說明，不放在簡報裡。流程圖保留在 <code>docs/process.html<\/code> 和 <code>PROCESS.md<\/code>。<\/li>\n<li>簡報從 18 頁變 17 頁，首頁、更新紀錄、PROCESS.md 裡的頁數一起改。<\/li>\n<li>再拿掉「附錄：一次實際執行的紀錄」那一頁（使用者要求），簡報變 16 頁。完整紀錄仍在 PROCESS.md 第 2 部分。<\/li>\n<\/ul>", "back": ["pairs-guide"]}, "pairs-guide": {"title": "配對交易導覽：賭雙胞胎會回來", "type": "overview", "updated": "2026-11-23", "html": "<p>這是「開心的 Quant Wiki」的第一個主題版本。不需要任何交易背景，照下面的順序讀，大約 20 分鐘。<\/p>\n<blockquote>\n<p>核心問題：<strong>交易策略到底在賺誰的錢？<\/strong> 配對交易的答案是：賺「價格暫時走歪」的錢。但當價格走得更歪時，付錢的可能變成你自己。<\/p>\n<\/blockquote>\n<h2>一張圖看懂<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 452\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"配對交易示意圖：上方是兩檔股票的價格，下方是兩者的價差與正負兩個標準差的界線\">\n<rect x=\"427.7\" y=\"26\" width=\"56.2\" height=\"374\" class=\"f-hold\"/>\n<text x=\"56\" y=\"20\" class=\"f-h\">兩檔股票的價格<\/text>\n<path d=\"M56.0,129.9 L59.1,127.8 L62.2,126.8 L65.4,120.8 L68.5,129.3 L71.6,123.3 L74.7,136.3 L77.9,119.6 L81.0,113.5 L84.1,126.4 L87.2,123.7 L90.4,113.3 L93.5,117.7 L96.6,116.4 L99.7,113.4 L102.8,123.2 L106.0,111.3 L109.1,99.8 L112.2,100.1 L115.3,93.3 L118.5,82.1 L121.6,85.2 L124.7,96.7 L127.8,99.9 L131.0,97.4 L134.1,86.6 L137.2,86.2 L140.3,90.9 L143.5,102.2 L ,330.3 L571.3,328.2 L574.5,329.6 L577.6,323.0 L580.7,321.0 L583.8,314.6 L587.0,301.9 L590.1,308.1 L593.2,302.1 L596.3,310.4 L599.5,314.1 L602.6,317.1 L605.7,328.2 L608.8,333.8 L611.9,329.2 L615.1,350.5 L618.2,337.4 L621.3,341.7 L624.4,325.5 L627.6,320.1 L630.7,325.4 L633.8,327.6 L636.9,324.0 L640.1,325.9 L643.2,324.4 L646.3,329.6 L649.4,327.7 L652.5,308.5 L655.7,313.0 L658.8,316.5 L661.9,311.5 L665.0,314.0 L668.2,333.4 L671.3,338.3 L674.4,337.7 L677.5,354.3 L680.7,349.8 L683.8,337.6 L686.9,328.7 L690.0,326.8 L693.2,345.5 L696.3,340.8 L699.4,349.4 L702.5,347.3 L705.6,351.6 L708.8,338.1 L711.9,322.9 L715.0,336.4 L718.1,336.9 L721.3,344.1 L724.4,344.1 L727.5,333.7 L730.6,330.4 L733.8,328.0 L736.9,323.0 L740.0,314.1\" class=\"f-s\"/>\n<circle cx=\"427.7\" cy=\"387.4\" r=\"6\" class=\"f-in\"/>\n<circle cx=\"483.9\" cy=\"317.4\" r=\"6\" class=\"f-out\"/>\n<text x=\"417.7\" y=\"414\" text-anchor=\"end\" class=\"f-lab\">① 跌破 −2σ：買 A、空 B<\/text>\n<text x=\"493.9\" y=\"414\" class=\"f-lab\">② 回到 0：平倉<\/text>\n<text x=\"740\" y=\"448\" text-anchor=\"end\" class=\"f-note\">示意，非真實資料（模擬產生）<\/text>\n<\/svg><\/figure>\n<p>兩檔走勢像雙胞胎的股票，平常差距在一個範圍內晃。差距拉得太開時，買落後的、空領先的；等差距回到原點就平倉。<\/p>\n<h2>閱讀路線<\/h2>\n<p><strong>第 1 站｜它怎麼運作<\/strong>\n<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：一步一步做一次，還有一個數字例子。<\/p>\n<p><strong>第 2 站｜它真的賺錢嗎<\/strong>\n<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>：1962–2002 年美股，前 20 對年化最高約 11%。用隨機配對做對照，確認不是運氣。<\/p>\n<p><strong>第 3 站｜但越來越難賺<\/strong>\n<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>：每月超額報酬從 0.86% 掉到 0.24%。有趣的是，市場恐慌時它反而賺最多。<\/p>\n<p><strong>第 4 站｜最完美的雙胞胎<\/strong>\n<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>：Royal Dutch 和 Shell 本來就是同一家公司，價格卻可以差到 36%；有些套利部位要等將近 9 年。<\/p>\n<p><strong>第 5 站｜LTCM 的故事<\/strong>\n<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：一群最會算的人，用 27 倍槓桿賭 Royal Dutch／Shell 會回來。他們賭對了，價差在 2001 年消失，但他們在 1998 年就倒了。<\/p>\n<p><strong>第 6 站｜為什麼撐不住<\/strong>\n<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：錯價最大、機會最好的時候，套利者反而最沒錢。理論出自 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>。<\/p>\n<h2>四個問題的答案<\/h2>\n<table>\n<thead>\n<tr>\n<th>問題<\/th>\n<th>配對交易的答案<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在賺誰的錢？<\/td>\n<td>把價格暫時推歪的人（推論）；作者稱為套利者修正價格的報酬<\/td>\n<\/tr>\n<tr>\n<td>靠什麼假設？<\/td>\n<td>兩檔關係穩定，而且你撐得到價差回來<\/td>\n<\/tr>\n<tr>\n<td>什麼時候失效？<\/td>\n<td>做的人變多；公司關係改變；價差先拉得更開而你被迫平倉<\/td>\n<\/tr>\n<tr>\n<td>扣成本後剩多少？<\/td>\n<td>早年每半年仍有 113–225 bps；近年簡單版可能所剩無幾（推論）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>一句話帶走<\/h2>\n<p><strong>「最後會收斂」和「你撐得到收斂」是兩件事。<\/strong> 配對交易賺的錢，很大一部分是承擔「撐不撐得住」這個風險的報酬。<\/p>\n<h2>想再深入<\/h2>\n<ul>\n<li>概念：<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>、<a class=\"wl\" href=\"#leverage\">槓桿<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>、<a class=\"wl\" href=\"#bps\">bps<\/a>、<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>這一版收錄了哪些資料、怎麼檢查的：<a class=\"wl\" href=\"#log\">收錄紀錄<\/a><\/li>\n<\/ul>", "back": ["ltcm", "pairs-trading"]}, "arbitrageurs": {"title": "套利者", "type": "player", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>專找「同一個東西卻有兩個價格」的人，買便宜的、賣貴的，把價格推回一致。<\/p>\n<h2>他在哪裡賺錢<\/h2>\n<ul>\n<li><strong>慢速版<\/strong>：配對交易，等兩檔像雙胞胎的股票靠回來，持有幾天到幾個月。作者把這份獲利看成「修正價格」的報酬。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>。<\/li>\n<li><strong>快速版<\/strong>：高頻交易者，在幾毫秒內吃掉不同市場間過時的報價。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>。<\/li>\n<li><strong>跨國版<\/strong>：在加密貨幣便宜的國家買、貴的國家賣。2017–2018 年潛在利潤至少 20 億美元，但大部分沒人拿走。見 <a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>、<a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a>。<\/li>\n<\/ul>\n<h2>他在哪裡付錢<\/h2>\n<ul>\n<li><strong>競爭<\/strong>：做的人越多，機會越少或越短。配對交易 1989 年後原始報酬掉到約三分之一；高頻套利則要不斷投資速度。<\/li>\n<li><strong>成本<\/strong>：配對交易要付價差和放空成本；高頻套利要付專線和機房；跨國加密套利要面對資本管制、匯款延遲和交易所風險。<\/li>\n<li><strong>被迫平倉<\/strong>：專業套利者用的是別人的錢。價差拉得更開時，出資人撤資、保證金被追繳，他們只能在最差的價位認賠。見 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>、<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>。<\/li>\n<li><strong>LTCM<\/strong>：1998 年用約 27 倍槓桿做 Royal Dutch／Shell 等價差交易，價差全部同時拉開，最後被 14 家銀行接管。見 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>。<\/li>\n<li><strong>等太久<\/strong>：雙胞胎股票的套利，有些部位要等將近 9 年才收斂。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li><strong>資本不夠<\/strong>：跨國加密價差大到 40% 仍補不平，作者認為是套利資本太少、而且流走後沒有馬上補上。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li>被他狙擊的人：<a class=\"wl\" href=\"#market-makers\">做市商<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["cross-exchange-arb", "crypto-arb-2020", "hft-latency-arb", "hft-race-2015", "law-of-one-price", "limits-arbitrage-1997", "limits-of-arbitrage", "ltcm", "ltcm-2006", "market-makers", "pairs-guide", "pairs-trading", "pairs-trading-2006"]}, "brokers-exchanges": {"title": "券商與交易所", "type": "player", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>幫你下單、讓買賣雙方碰頭的中間人，不賭漲跌，靠每筆交易收費。<\/p>\n<h2>他在哪裡賺錢<\/h2>\n<ul>\n<li><strong>佣金<\/strong>：每一筆交易都收。1991–1996 年的美國折扣券商，一來一回平均約 3%。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/li>\n<li>交易越頻繁，他們收得越多，所以他們的收入和散戶的換手率直接相關。<\/li>\n<\/ul>\n<h2>他在哪裡付錢<\/h2>\n<p>目前的來源沒有談到。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>付佣金的一方：<a class=\"wl\" href=\"#retail\">散戶<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a><\/li>\n<\/ul>", "back": ["overtrading-2000", "retail", "transaction-costs", "who-pays"]}, "market-makers": {"title": "做市商", "type": "player", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同時掛出買價和賣價、讓別人隨時能成交的人，靠價差賺錢。<\/p>\n<h2>他在哪裡賺錢<\/h2>\n<p><strong>買賣價差<\/strong>：低價買進、高價賣出，賺中間那段 <a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>。散戶付的價差很可能有一部分流到這裡，但 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a> 沒有直接證明，這是 Wiki 的推論。<\/p>\n<h2>他在哪裡付錢<\/h2>\n<p><strong>被狙擊<\/strong>：市場一動，他的報價瞬間過時，被更快的交易者吃掉。他會把這個預期損失加進價差，轉嫁給所有一般投資人。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>狙擊他的人：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>、<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "hft-latency-arb", "hft-race-2015", "overtrading-2000", "who-pays"]}, "retail": {"title": "散戶", "type": "player", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>用自己的錢、自己下單的個人投資人，人數最多，但單筆資金最小。<\/p>\n<h2>他在哪裡賺錢<\/h2>\n<p>目前的來源裡，散戶的<strong>毛報酬<\/strong>和大盤差不多，選股本身沒有明顯比較差，見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/p>\n<h2>他在哪裡付錢<\/h2>\n<ul>\n<li><strong>頻繁交易<\/strong>：每次買賣都付佣金和買賣價差，交易越多，淨報酬越低。交易最多的那 20% 家戶每年輸大盤約 6.5 個百分點。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>。<\/li>\n<li>作者認為背後原因是過度自信。<\/li>\n<li><strong>放空比較難<\/strong>：配對交易需要放空，研究指出散戶比大型機構更難借到券。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li><strong>在溢價市場買幣<\/strong>：2017–2018 年韓國的比特幣比美國貴 15% 以上，在那裡買的人等於多付了這段（Wiki 推論）。作者也提到，跨國匯款對散戶來說特別困難，所以散戶很難自己去套這個利。見 <a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li>收佣金的一方：<a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["brokers-exchanges", "crypto-arb-2020", "overtrading-2000", "transaction-costs", "who-pays"]}, "crypto-arb-2020": {"title": "加密貨幣的交易與套利（Makarov & Schoar 2020）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>比特幣在不同國家的交易所價格可以差到 40%，因為錢搬不過去，套利者也補不平。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>34 家交易所、19 個國家或地區的逐筆成交資料，重點分析最有流動性的 15 家。<\/li>\n<li>幣種：比特幣、以太幣、瑞波幣。<\/li>\n<li>期間：2017 年 1 月到 2018 年 2 月，正好涵蓋比特幣從暴漲到接近 2 萬美元、再回落的那一段。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li>算每家交易所的比特幣價格，和其他交易所比較，看價差多大、維持多久。<\/li>\n<li>分成「同一國內的交易所之間」和「不同國家之間」比較。<\/li>\n<li>比較「用法幣（美元、韓元）報價」和「幣對幣報價」（例如用比特幣買以太幣）的價差。<\/li>\n<li>估算如果有人能完美套利，這段期間總共能賺多少。<\/li>\n<li>把每家交易所的買賣淨量拆成「全市場共同的部分」和「這家獨有的部分」，看它們各自解釋了什麼。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li><strong>韓國溢價<\/strong>：2017 年 12 月到 2018 年 2 月初，美國和韓國的比特幣價格比，每日平均超過 15%，有好幾天到 40%（媒體稱為「泡菜溢價」）。<\/li>\n<li><strong>國內 vs 跨國<\/strong>：同一國內不同交易所的價差平均通常不超過 1%；跨國價差大得多。<\/li>\n<li><strong>幣對幣<\/strong>：同一家交易所裡，幣對幣的價差比法幣報價的價差小一個數量級。<\/li>\n<li><strong>錢留在桌上<\/strong>：作者估計這段期間至少有 20 億美元的潛在套利利潤沒被拿走（這是期刊版的說法；2018 年的工作論文寫的是至少 10 億美元）。<\/li>\n<li><strong>價差和行情一起動<\/strong>：比特幣大漲時，各國的價差一起張開。<\/li>\n<li><strong>買賣量<\/strong>：全市場共同的買賣壓力解釋了比特幣約 80% 的報酬（期刊摘要；2018 年工作論文寫 85%）；各交易所獨有的買賣壓力則幫忙解釋了交易所之間的價差。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>如果套利者能進場，賺的是<strong>在溢價市場買幣的人<\/strong>的錢。例如在韓國用高 15% 以上的價格買比特幣的投資人，套利者在美國買、在韓國賣，賺的就是這段差距。這是 Wiki 根據價差方向的推論。<\/p>\n<p>作者說的是：美歐以外的市場，比特幣幾乎總是溢價、很少折價。作者猜測那裡的投資人在好消息出現時更願意多付錢，可能因為當地金融體系較弱或資本管制較嚴，加密貨幣對他們更有用。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>套利要成立，<strong>資金必須能跨國流動<\/strong>：在美國用美元買幣，運到韓國賣成韓元，再把韓元換回美元搬回美國。最後一步卡住，整個套利就做不起來。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>資本管制<\/strong>：法幣跨國匯款受限，套利者賺到的韓元搬不回來。這解釋了為什麼國內價差小、跨國價差大，也解釋了為什麼幣對幣價差小（加密貨幣本身很難被管制）。<\/li>\n<li><strong>套利資本不夠<\/strong>：作者認為大型機構理論上能繞過限制，但整體套利資本相對於價差的規模太少，而且流去別處的資本沒有馬上被補上。<\/li>\n<li>作者也提到，交易所被駭或捲款這類風險，可能事前就讓一些套利者不敢進場。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>論文估的是<strong>潛在<\/strong>利潤（至少 20 億美元），也就是假設能完美執行。實際上要扣掉匯款的時間和費用、交易所的手續費、等待區塊確認期間的價格風險，以及資本管制本身造成的障礙。真正拿得到的遠少於這個數字，但論文沒有估算。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文與作者說明文自己說的）<\/strong>\n- 34 家交易所、19 個地區、韓國溢價每日平均超過 15% 最高 40%、國內價差通常不超過 1%、幣對幣價差小一個數量級、至少 20 億美元、共同成分解釋約 80% 報酬、資本管制、套利資本不足。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 「在賺溢價市場買家的錢」。\n- 「扣成本後遠少於 20 億美元」。<\/p>\n<p><strong>版本差異（收錄時抓到的）<\/strong>\n- 總利潤：期刊版說明文寫至少 20 億美元，2018 年工作論文與作者簡報寫至少 10 億美元。本頁用期刊版。\n- 共同成分：期刊摘要寫 80%，2018 年工作論文寫 85%。本頁用期刊版。\n- 韓國溢價：CFA Institute 的摘要寫「平均低於 15%」，作者工作論文寫「超過 15%」。本頁採作者原文。<\/p>\n<h2>讀了什麼<\/h2>\n<p><strong>沒有讀到期刊全文。<\/strong> 讀了：期刊摘要（EconPapers）、作者在哈佛法學院公司治理論壇的說明文（2019）、2018 年 12 月工作論文的片段、CFA Institute Journal Review 的摘要（2020）。數字以作者自己的文字為準，可信度比其他四篇低一級。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>策略：<a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>、<a class=\"wl\" href=\"#retail\">散戶<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "cross-exchange-arb", "law-of-one-price", "retail", "who-pays"]}, "hft-race-2015": {"title": "高頻交易軍備競賽（Budish, Cramton & Shim 2015）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一個東西在兩個市場報價差一點點，誰最快誰拿走；競爭只讓速度門檻越來越高。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li><strong>ES<\/strong>：芝加哥 CME 的 S&amp;P 500 迷你期貨，逐筆深度行情。<\/li>\n<li><strong>SPY<\/strong>：紐約 NYSE 的 S&amp;P 500 ETF，ArcaBook 逐筆行情。<\/li>\n<li>期間：2005 年 1 月到 2011 年 12 月，毫秒級時間戳。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li>ES 和 SPY 追蹤同一個指數，價格應該同步（ES 約等於 10 倍 SPY）。<\/li>\n<li>算兩者中間價的差距，並和它的移動平均比較。差距大到「在一邊買、另一邊賣，扣掉兩邊各半個價差還有賺」，就算一次套利機會。<\/li>\n<li>只算持續至少 4 毫秒（紐約到芝加哥的單程訊號延遲）、每單位利潤至少 0.05 指數點的機會。<\/li>\n<li>再建一個理論模型，說明這些機會為什麼一直存在、成本由誰承擔。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li>在 1 毫秒的尺度上，兩者報酬的相關性幾乎是 0（2011 年約 0.007）。拉長時間才會高度相關。<\/li>\n<li>套利機會持續時間的中位數，從 2005 年約 97 毫秒縮短到 2011 年約 7 毫秒。<\/li>\n<li>但<strong>每次的利潤沒有變小<\/strong>：平均約 0.09 指數點，平均每天約 891 次。光 ES–SPY 這一對，一年約 7,500 萬美元。<\/li>\n<li>作者的結論：競爭沒有消滅套利機會，只是不斷抬高搶到它所需的速度。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>論文直接回答了這題：\n- 當一個市場的價格動了，另一個市場的掛單會有一瞬間「過時」。最快的交易者衝過去吃掉這些過時的報價，這叫<strong>狙擊<\/strong>（sniping）。\n- 被狙擊的是<strong>掛單提供流動性的人<\/strong>，通常是做市商。\n- 做市商會把預期被狙擊的損失加進報價裡，讓買賣價差變寬。所以成本最後由<strong>一般投資人<\/strong>透過更寬的價差承擔。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>市場是「連續撮合」：任何時刻都能成交，先到先得。正是這個規則讓速度變成關鍵。<\/li>\n<li>ES 和 SPY 本質上是同一個東西，價差一定會收回。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>對個別交易者來說<\/strong>：只要有人比你快，你就拿不到。機會從 97 毫秒縮到 7 毫秒，沒有持續投資速度就會被淘汰。<\/li>\n<li><strong>對整個機制來說<\/strong>：作者提議改成「頻繁批次拍賣」，每隔一小段時間（例如 1 秒，文中也提到 100 毫秒）集中撮合一次。這樣速度上的微小差距就沒有意義，這類套利會消失。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<ul>\n<li>論文定義的利潤已經扣掉兩邊各半個買賣價差，平均每次約 0.09 指數點。<\/li>\n<li>但真正的成本是<strong>速度投資<\/strong>：光纖、微波線路、機房位置。這筆錢論文沒有算進每次利潤裡，而是指出它是整個社會的浪費。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong>\n- 1 毫秒相關性約 0.007、97 → 7 毫秒、每次約 0.09 指數點、每天約 891 次、每年約 7,500 萬美元、利潤大小不隨競爭縮小。\n- 狙擊過時報價、做市商擴大價差、成本轉嫁給一般投資人、頻繁批次拍賣的提議。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 「速度投資沒算進每次利潤」是 Wiki 對論文利潤定義的解讀。<\/p>\n<h2>讀了什麼<\/h2>\n<p>NBER 會議版全文的前半部（資料、實證結果、模型的主要結論）。期刊版是 <em>Quarterly Journal of Economics<\/em> 130(4), 2015，沒有另外核對。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>策略：<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#market-makers\">做市商<\/a>、<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "hft-latency-arb", "law-of-one-price", "market-makers", "overtrading-2000", "transaction-costs", "who-pays"]}, "limits-arbitrage-1997": {"title": "套利的極限（Shleifer & Vishny 1997）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>套利者用別人的錢；價差拉得越開、機會越好時，出資人反而撤資，逼他們認賠出場。<\/p>\n<h2>資料<\/h2>\n<p>這是理論論文，沒有用交易資料做實證。作者用模型推導，再用基金績效差就被贖回、1990–91 年銀行股等現象佐證。<\/p>\n<h2>方法<\/h2>\n<ol>\n<li>先比較「教科書的套利」和「現實的套利」。<\/li>\n<li>建一個模型：少數專業套利者管理外部投資人的錢；投資人看不懂策略，只能用最近的績效判斷套利者的能力。作者把這叫<strong>以績效為準的套利<\/strong>。<\/li>\n<li>推導當雜訊交易者把價格推離合理價值時，套利者會怎麼做。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li><strong>教科書的套利<\/strong>不用本錢、沒有風險。<strong>現實的套利<\/strong>要本錢，而且有風險：作者舉德國公債期貨的例子，即使最後會收斂，中間也可能先虧錢、被追繳保證金。<\/li>\n<li><strong>最需要錢的時候拿不到錢<\/strong>：價格偏離越大，套利機會越好，但套利者此時帳面虧損，投資人看到虧損就撤資。這種撤資在投資人的角度是理性的，因為他們無法分辨是套利者能力差，還是運氣差。<\/li>\n<li><strong>在最糟的時候被迫賣<\/strong>：滿倉的套利者遇到撤資只能平倉，而平倉的買賣又把價格推得更遠，像跳樓大拍賣。<\/li>\n<li><strong>哪裡最容易出現長期錯價<\/strong>：波動大、無法避險的個別風險大、要很久才會收斂的地方。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>套利者想賺的是雜訊交易者（情緒化、不看價值的交易者）把價格推歪的那段。但這篇的重點是反過來：<strong>當價格被推得更歪時，套利者自己會變成付錢的人<\/strong>，被迫在最差的價位平倉，把錢讓給逢低承接的人。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>套利者用的是別人的錢，而出資人只看最近的績效。<\/li>\n<li>套利者已經把資金投得差不多了，沒有多餘的錢可以加碼撐住。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<p>這篇講的就是套利什麼時候失效：\n- 價格在收斂前先偏得更遠，而且偏得夠久，久到出資人失去耐心。\n- 所有套利者同時被撤資，沒有外面的資金進來接手。<\/p>\n<h2>扣成本後剩多少<\/h2>\n<p>論文沒有算具體報酬。它指出的成本不是手續費，而是<strong>被迫提早平倉的損失<\/strong>，加上平倉時把價格推得更不利的衝擊。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong>\n- 教科書套利 vs 現實套利、外部資金和代理問題、績效差就撤資、機會最好時最受限、被迫平倉推遠價格、哪種市場最容易有長期錯價。\n- 論文<strong>沒有<\/strong>討論 Royal Dutch／Shell、雙胞胎股票或配對交易。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 把這個理論套到配對交易和 LTCM 上，是 Wiki 的連結，見 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>。<\/p>\n<h2>讀了什麼<\/h2>\n<p>期刊全文 PDF（<em>Journal of Finance<\/em> 52(1), 1997）。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>概念：<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a><\/li>\n<li>案例：<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "leverage", "limits-of-arbitrage", "ltcm", "ltcm-2006", "pairs-guide"]}, "ltcm-2006": {"title": "LTCM 與套利（MacKenzie 2006，第 8 章）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>LTCM 的部位單看都合理，但太多人抄同樣的交易，危機時大家一起被迫賣，價差全部同時拉開。<\/p>\n<h2>資料<\/h2>\n<p>社會學家 Donald MacKenzie 研究金融模型的書 <em>An Engine, Not a Camera<\/em>（MIT Press, 2006）第 8 章〈Arbitrage〉。資料來自公開資料，以及作者對 LTCM 合夥人和其他交易員的訪談。<\/p>\n<h2>方法<\/h2>\n<p>整理 LTCM 從 1994 年成立到 1998 年倒下的經過，逐一檢驗幾種解釋（例如槓桿太高、模型錯誤），最後提出「模仿造成的超級組合」這個解釋。<\/p>\n<h2>結果<\/h2>\n<p><strong>LTCM 是誰<\/strong>\n- 1994 年 2 月開始交易，總部在美國康乃狄克州。核心成員來自所羅門兄弟的債券套利部門。\n- 報酬（扣費後）：1995 年 42.8%、1996 年 40.8%。\n- 1997 年 8 月：資產 1,260 億美元，其中自有資本 67 億美元。1994–1997 年的槓桿在 14 倍到 31 倍之間，1998 年初約 27 倍。<\/p>\n<p><strong>Royal Dutch／Shell 交易<\/strong>\n- Royal Dutch／Shell 集團的淨現金流按 60：40 分給兩家公司，所以兩檔股票價格應該維持固定比例。\n- 1997 年 Royal Dutch 比理論價貴約 8%。LTCM 放空 Royal Dutch、買進 Shell，這樣大盤和油價的漲跌互相抵銷。\n- 光靠股利差，還不夠付融資成本，所以 LTCM 賭的是價差會縮小（他們預期英國的稅制改變會帶動）。\n- 結果 1998 年初溢價反而擴大，危機中一度超過 17%。這個溢價一直到 2001 年春天才消失。<\/p>\n<p><strong>1998 年發生了什麼<\/strong>\n- 8 月 17 日俄羅斯債務違約，市場開始逃向安全、流動性高的資產。\n- 8 月 21 日 LTCM 單日虧損 5.5 億美元；整個 8 月虧掉 44% 的資本。\n- 原本彼此相關性只有 0.1 左右的各種部位，相關性升到約 0.7：分散投資在危機中失效。\n- 9 月 20 日美國財政部和紐約聯準會官員與 LTCM 開會。最後由紐約聯準會出面協調，14 家銀行出資 36 億美元、取得基金 90% 的股權；原本的投資人和合夥人只剩約 4 億美元，大約是之前的十分之一。<\/p>\n<p><strong>作者的解釋：超級組合<\/strong>\n- LTCM 早年的成功引來大量模仿，很多交易變成「共識交易」，市場上形成一個大家都持有的「超級組合」。\n- 所羅門兄弟的美國套利部門在 1998 年 7 月宣布關閉，平倉時讓其他持有相同部位的人虧損。\n- 虧損的套利者被迫減碼，減碼又讓價差更開，價差擴大變成自我強化，而不是自我修正。投資人在 1998 年第四季從套利類基金撤出約 60 億美元；風險值（VaR）上限也逼一些交易部門平倉。<\/p>\n<h2>在賺誰的錢<\/h2>\n<p>LTCM 想賺的是「近似商品之間的價差最後會收斂」：Royal Dutch 和 Shell、各種債券和交換利率之間的價差。1998 年反過來，<strong>LTCM 和其他套利者變成付錢的人<\/strong>：被迫在價差最開的時候平倉。接手的是當時有錢、撐得住的一方（例如出資接管的 14 家銀行），他們後來把部位慢慢平倉到 1999 年 12 月。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>價差最後會收斂（就單一部位來說，多數最後確實收斂了，例如 Royal Dutch／Shell 在 2001 年）。<\/li>\n<li>各部位之間互相獨立，所以分散就能降低風險。<\/li>\n<li>撐得住到收斂的那一天：LTCM 為此設計了投資人三年不能贖回的條款。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>大家都持有同樣的部位<\/strong>：一個人被迫賣，其他人跟著虧，相關性從 0.1 跳到 0.7。<\/li>\n<li><strong>槓桿太高<\/strong>：27 倍槓桿下，資產只要跌約 4%，自有資本就沒了（Wiki 的算術：1 ÷ 27 ≈ 3.7%）。<\/li>\n<li>作者說單一部位的虧損其實都還「可以承受」，壓垮 LTCM 的是全部部位同時出事。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>1995、1996 年扣費後每年都有四成以上；1998 年 8 月一個月就虧掉 44% 的資本，最後投資人只剩約十分之一。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（書中說的）<\/strong>\n- 成立時間、報酬、資產和資本、槓桿倍數、60：40、8% 和 17%、2001 年春天溢價消失、8 月 17 日、5.5 億美元、44%、相關性 0.1 → 0.7、14 家銀行 36 億美元 90%、剩約 4 億美元、超級組合、60 億美元撤資、三年鎖定期。\n- 這一章<strong>沒有<\/strong>引用 Shleifer &amp; Vishny 的套利極限理論，也沒有寫出 LTCM 在 Royal Dutch／Shell 的部位大小和虧損金額。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 「1 ÷ 27」的槓桿算術。\n- 把這段經過和 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a> 的理論連起來，見 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>。\n- 網路上流傳的 LTCM「23 億美元 Royal Dutch／Shell 部位」說法，Wiki 只在二手文章看到，沒有可靠來源，所以不採用。<\/p>\n<h2>讀了什麼<\/h2>\n<p>LSE 課程網站提供的第 8 章全文 PDF。另外讀了 Jorion（2000）〈Risk Management Lessons from Long-Term Capital Management〉的摘要：作者認為 LTCM 嚴重低估了風險，因為只看短期歷史資料，而且風險過度集中。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>案例：<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a><\/li>\n<li>理論：<a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a><\/li>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<\/ul>", "back": ["leverage", "limits-of-arbitrage", "ltcm", "pairs-trading"]}, "momentum-1993": {"title": "買贏家、賣輸家（Jegadeesh & Titman 1993）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>過去半年漲最多的股票，接下來半年到一年還會繼續贏，之後漲幅會吐回一部分。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>美國 NYSE 和 AMEX 上市股票的每日報酬（CRSP 資料庫），1965 年 1 月到 1989 年 12 月。<\/li>\n<li>研究盈餘公告的部分，用 1980–1989 年 COMPUSTAT 的季報公告日。<\/li>\n<li>另外拿 1927–1964 年的資料做樣本外檢驗。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li>每個月，依照每檔股票「過去 J 個月」的報酬排名，分成 10 組（每組等權重）。<\/li>\n<li>買進漲最多的那一組（贏家），放空跌最多的那一組（輸家），持有 K 個月。買賣金額相等，所以是不用出本錢的「零成本組合」。<\/li>\n<li>J 和 K 各試 3、6、9、12 個月，共 16 種組合；再加上「排名後先等一週才進場」的版本，共 32 種。<\/li>\n<li>每個月都開一批新的、關掉 K 個月前那一批，所以組合是重疊的。<\/li>\n<\/ol>\n<p>這種「看過去漲跌來決定買賣」的做法，就是 <a class=\"wl\" href=\"#momentum\">動量策略<\/a>（動量策略）。<\/p>\n<h2>結果<\/h2>\n<ul>\n<li>最常被引用的 J=6、K=6：每月平均超額報酬 0.95%；排名後等一週再進場是每月 1.10%。（Table I）<\/li>\n<li>這不是承擔更多市場風險換來的：贏家組的 beta（跟大盤連動程度）其實比輸家組略低，相減約 −0.08。（Table II）<\/li>\n<li>累積超額報酬在第 12 個月到頂（約 9.51%），第 13–24 個月轉負，第 36 個月剩約 4.06%。作者總結：第一年的超額報酬大約一半在之後兩年消失。（Table VII、結論）<\/li>\n<li>盈餘公告時期：贏家在排名後頭幾個月的公告日報酬比輸家高，大約第 8 個月以後反過來。（Table IX）<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>論文<strong>沒有<\/strong>指名對手方是誰。作者的解釋是：市場對公司個別的消息反應太慢，好消息沒有一次反映到股價上。<\/p>\n<p>Wiki 的推論：如果作者說得對，賺的就是「反應慢的人」的錢，例如太早賣掉贏家、或抱著輸家不放的投資人，他們把後續漲跌讓給了動量交易者。這點論文沒有直接驗證。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>價格對公司消息的反應是<strong>延遲<\/strong>的，而且這個延遲會持續存在。<\/li>\n<li>作者也提到另一種可能：一些人追漲殺跌（正回饋交易），把價格推離長期價值。作者承認手上的證據分辨不出是哪一種。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>持有太久<\/strong>：超過 12 個月，報酬開始反轉。<\/li>\n<li><strong>其他年代<\/strong>：1927–1940 年完全不靈，持有 12 個月累積虧 10.12%，作者歸因於那段時期這個組合的 beta 大約是 −0.5，又碰上大盤均值回歸。1941–1964 年第一年有賺，但第 24 個月前幾乎吐光。（Table VIII）<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<ul>\n<li>6/6 策略半年換手率約 84.8%。假設每次單邊交易成本 0.5%，扣完後風險調整後報酬仍有每年約 9.29%。<\/li>\n<li>作者說 0.5% 是保守的假設，因為當時另一份研究估計的成本只有約 23 bps（0.23%）。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong>\n- 每月 0.95% / 1.10%、beta 差 −0.08、第 12 個月到頂、一半在兩年內消失、扣 0.5% 成本後每年 9.29%。\n- 解釋：符合「對公司個別資訊反應延遲」，也可能是正回饋交易，證據無法區分。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 「賺反應慢的人的錢」是 Wiki 根據作者解釋推出來的，論文沒有指出具體是哪群投資人。<\/p>\n<h2>讀了什麼<\/h2>\n<p>期刊全文 PDF（<em>Journal of Finance<\/em> 48(1), 1993）。表號與頁碼依期刊版。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>策略：<a class=\"wl\" href=\"#momentum\">動量策略<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#bps\">bps<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["bps", "excess-return", "momentum", "transaction-costs", "who-pays"]}, "overtrading-2000": {"title": "交易有害你的財富（Barber & Odean 2000）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>散戶選股不比市場差，但交易越頻繁，手續費和價差吃掉越多，最後輸給大盤。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>美國一家大型折扣券商的帳戶資料：從 78,000 戶抽樣，其中 66,465 戶持有股票。<\/li>\n<li>期間：1991 年 1 月到 1996 年 12 月的持股月報，加上逐筆交易紀錄（超過 300 萬筆）。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li>依每戶平均每月的換手率（買賣了持股的多少比例），把家戶分成 5 組。<\/li>\n<li>每組算兩種報酬：<strong>毛報酬<\/strong>（不扣成本）和<strong>淨報酬<\/strong>（扣掉佣金和買賣價差）。<\/li>\n<li>和大盤指數、CAPM、Fama-French 三因子模型比較，確認差異不是因為承擔了不同的風險。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li>交易最多的那 20% 家戶，淨報酬每年 11.4%；同期市場 17.9%。交易最少的那組是 18.5%。<\/li>\n<li>各組的<strong>毛報酬幾乎一樣<\/strong>（每年 18.5%–18.7%）。差距幾乎全來自成本。<\/li>\n<li>交易最多那組平均每月換手 21.49%，一年超過 250%。<\/li>\n<li>一般家戶每年換手約 75%，淨報酬 16.4%，仍輸大盤。<\/li>\n<li>成本：超過 1,000 美元的交易，一來一回平均約 3% 佣金加 1% 買賣價差。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>這篇反過來，講的是<strong>誰在付錢<\/strong>：頻繁交易的散戶。<\/p>\n<ul>\n<li>佣金付給券商（論文直接說明是佣金成本）。<\/li>\n<li>買賣價差由投資人付出，但論文<strong>沒有<\/strong>說明是誰收走。Wiki 推論是提供報價的 <a class=\"wl\" href=\"#market-makers\">做市商<\/a>。<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a> 直接談到做市商靠價差賺錢，但仍沒有證明散戶付的價差就是流到他們手上。<\/li>\n<\/ul>\n<h2>靠什麼假設<\/h2>\n<p>這不是策略，所以改問「散戶為什麼一直交易」。作者的解釋是<strong>過度自信<\/strong>：高估自己的資訊和判斷，所以交易太多。如果散戶是理性的，多付的成本應該會被更高的毛報酬補回來，但資料顯示沒有。<\/p>\n<h2>什麼時候失效<\/h2>\n<p>論文的結論在以下情況可能不適用（以下是 Wiki 的推論，不是論文說的）：\n- 樣本只有 1991–1996 年、一家券商。那時佣金遠高於現在很多券商的零佣金時代。\n- 但即使佣金變零，<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a> 這項成本仍然存在，所以「交易越多、成本越多」的方向應該還成立。<\/p>\n<h2>扣成本後剩多少<\/h2>\n<p>毛報酬和大盤差不多；扣成本後，交易最多的那組每年少賺約 6.5 個百分點（17.9% → 11.4%）。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong>\n- 66,465 戶、1991–1996、淨報酬 11.4% vs 市場 17.9%、毛報酬各組差異很小、換手 250% 以上、佣金約 3% 加價差約 1%、過度自信。\n- 論文也說，散戶偏好小型股和高 beta 股，這些偏好在樣本期間其實幫了忙，所以落後的主因是成本，不是選股。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 價差被做市商收走。\n- 零佣金時代結論是否仍成立。<\/p>\n<h2>讀了什麼<\/h2>\n<p>作者網站上的期刊版全文 PDF（<em>Journal of Finance<\/em> 55(2), 2000）。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>玩家：<a class=\"wl\" href=\"#retail\">散戶<\/a>、<a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a>、<a class=\"wl\" href=\"#market-makers\">做市商<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>、<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["bid-ask-spread", "brokers-exchanges", "excess-return", "market-makers", "retail", "transaction-costs", "who-pays"]}, "pairs-decline-2010": {"title": "簡單的配對交易還有用嗎？（Do & Faff 2010）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>把 Gatev 等人的配對交易延長測到 2009 年：利潤一路變薄，但在市場恐慌時反而表現好。<\/p>\n<h2>資料<\/h2>\n<p>美國股票，1962 年 7 月到 2009 年 6 月，延續 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a> 的樣本並往後多測了 7 年。<\/p>\n<h2>方法<\/h2>\n<ol>\n<li>用和 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a> 一樣的規則（距離法配對、偏離 2 個標準差進場、交叉出場），重跑到 2009 年。<\/li>\n<li>把利潤下降拆成兩種解釋：市場變得更有效率（錯價變少），或是套利本身變得更危險。<\/li>\n<li>測試兩個改良的配對條件：只在同一個細分產業裡配對，以及看這對過去「交叉過幾次」（交叉越多，代表越常回歸）。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li>前 20 對每月平均超額報酬一路下降：1962–1988 年 0.86%、1989–2002 年 0.37%、2003–2009 年 0.24%。<\/li>\n<li>作者檢驗了「避險基金變多、競爭變激烈」的解釋，發現對配對交易來說這不是主因。<\/li>\n<li>套利風險變大，最多解釋了利潤下降的 70%。<\/li>\n<li>2000–02 年空頭和 2007–09 年金融危機期間，配對交易反而表現特別好：恐慌時風險雖然變大，但錯價變多的效果更大。<\/li>\n<li>加上「同產業」和「交叉次數」兩個條件後，利潤明顯提高，銀行股每月多約 22 bps。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>作者把配對交易看成「有風險的套利」：賺的是市場暫時沒效率造成的錯價，而這份利潤也是承擔套利風險的報酬。恐慌時錯價變多，所以賺得更多，Wiki 推論付錢的是恐慌時急著賣出的人。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>配對的兩檔之間的錯價會回來。作者列出三種讓錯價不回來或晚回來的套利風險：\n- <strong>基本面風險<\/strong>：兩家公司的關係真的變了。\n- <strong>雜訊交易者風險<\/strong>：情緒化的交易把價差推得更開，套利者撐不住。\n- <strong>同步風險<\/strong>：套利者不知道其他人什麼時候會一起進場修正價格，所以修正可能遲遲不來。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li>長期來看越來越薄，2003–2009 年每月只剩 0.24%。<\/li>\n<li>套利風險上升的時期，利潤被吃掉。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>這篇的數字是<strong>沒扣交易成本<\/strong>的超額報酬。每月 0.24% 只剩約 24 bps，對照 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a> 估計一來一回成本約 162 bps，Wiki 推論簡單版的配對交易在近年扣完成本可能所剩無幾。同作者 2012 年另有一篇專門研究成本，記在 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文摘要說的）<\/strong>\n- 1962–2009 年樣本、0.86% → 0.37% → 0.24%、競爭不是主因、套利風險解釋最多 70%、危機期間表現好、三種套利風險、同產業與交叉次數條件、銀行股多 22 bps。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 恐慌時付錢的是急著賣的人。\n- 扣成本後近年所剩無幾（拿 2006 年那篇的成本估計來對照，兩篇的成本口徑不一定相同）。<\/p>\n<h2>讀了什麼<\/h2>\n<p><strong>只讀了摘要<\/strong>（EconPapers 與 CFA Institute 的摘要頁）。全文在 <em>Financial Analysts Journal<\/em> 66(4), 2010 的會員區，沒有讀到。表號和細節無法核對。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>前一篇：<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/li>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#bps\">bps<\/a>、<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["limits-of-arbitrage", "pairs-guide", "pairs-trading", "pairs-trading-2006", "who-pays"]}, "pairs-trading-2006": {"title": "配對交易（Gatev, Goetzmann & Rouwenhorst 2006）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>找兩檔走勢像雙胞胎的股票，一旦拉開就買落後的、空領先的，等它們靠回來。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>美國股票每日資料（CRSP），1962–2002 年；月報酬結果涵蓋 1963 年 7 月到 2002 年 12 月，共 474 個月。<\/li>\n<li>形成期內只要有一天沒成交就排除，等於只留流動性夠的股票。<\/li>\n<\/ul>\n<h2>方法<\/h2>\n<ol>\n<li><strong>找配對（12 個月）<\/strong>：把每檔股票的累積報酬指數（含股利）標準化，每檔找一個「價格曲線距離最近」的夥伴，也就是兩條線的差的平方加總最小。<\/li>\n<li><strong>交易（接下來 6 個月）<\/strong>：兩檔標準化價格差距超過過去的 2 個標準差，就買進落後的、放空領先的，各一塊錢。<\/li>\n<li><strong>出場<\/strong>：價格再次交叉就平倉；6 個月到期還沒交叉就強制平倉。<\/li>\n<li>比較最接近的前 5 對、前 20 對、第 101–120 對。<\/li>\n<li>用「隨機配對」做對照（bootstrap），確認賺的不是單純的短期反轉。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li>前 20 對，每月超額報酬 1.44%（以實際有開倉的資金計算）；若以全部準備好的資金計算是 0.81%。摘要的說法是年化最高約 11%。<\/li>\n<li>隨機配對幾乎賺不到錢，所以這個效果不是單純「跌多了會彈」。<\/li>\n<li>和市場、規模、價值、動量、反轉等風險因子的相關性很低（R² 約 0.05–0.18）。<\/li>\n<li>1999–2002 年用同一套規則做樣本外測試，前 20 對每年平均 10.4%。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>作者的解釋：兩檔幾乎可以互相替代的股票，價格被<strong>暫時定錯<\/strong>。套利者把價格推回去，獲利是他們「維持<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>」的報酬。<\/p>\n<p>Wiki 的推論：付錢的是把其中一檔價格暫時推離夥伴的人，例如急著買賣、不在乎價格的交易者，或是情緒性過度反應的人。作者也提到過度反應是一種可能的解釋，但沒有直接指出是哪群人。<\/p>\n<h2>靠什麼假設<\/h2>\n<ul>\n<li>過去一起走的兩檔股票，未來大致還會一起走；拉開只是暫時的。<\/li>\n<li>作者發現前 20 對和第 101–120 對的報酬彼此相關，推測背後有一個共同的、傳統風險模型沒捕捉到的因子在驅動。<\/li>\n<\/ul>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>越來越多人做<\/strong>：前 20 對每月原始超額報酬，1989 年前約 118 bps，之後掉到約 38 bps。作者提出兩種解釋：避險基金競爭變多，或那個共同因子近年比較沉寂。作者比較傾向後者，但說需要更多研究。<\/li>\n<li>兩檔股票的關係真的改變了（例如其中一家公司出事），價差就不會回來，只能等 6 個月到期認賠。這點是方法本身的限制。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<ul>\n<li><strong>等一天再進場<\/strong>（避開買賣價差造成的假訊號）：每月報酬少掉約 30–55 bps，但仍顯著。<\/li>\n<li>作者用這個差距估計一來一回的成本約 162 bps。扣掉後，每 6 個月仍有約 113–225 bps 的淨利。<\/li>\n<li><strong>放空成本<\/strong>：只交易大型股、或模擬借券被收回，報酬只少 4–13 bps。作者說大型機構的放空成本很低，但散戶較難借到券。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong>\n- 每月 1.44% / 0.81%、年化最高約 11%、等一天的影響、162 bps 成本估計、1989 年前後的變化、隨機配對對照、共同因子。\n- 解釋：暫時定錯、套利者維持一價定律的報酬；另有競爭變多與過度反應的可能。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 付錢的是「把價格暫時推開的人」。\n- 公司關係改變導致價差不回來的風險（論文的規則有 6 個月強制平倉，但沒有特別分析這種情況）。<\/p>\n<h2>讀了什麼<\/h2>\n<p>2006 年 2 月的工作論文全文（Yale ICF Working Paper 08-03）；期刊版（<em>Review of Financial Studies<\/em> 19(3), 2006）只讀了摘要。年化 11% 來自期刊摘要，其他數字來自工作論文。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<li>後續：<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>（延長測到 2009 年）<\/li>\n<li>風險：<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>、<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>、<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a>、<a class=\"wl\" href=\"#bps\">bps<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a><\/li>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>對照：方向相反的 <a class=\"wl\" href=\"#momentum\">動量策略<\/a>（動量賭偏離會延續，配對賭偏離會回來）<\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "bps", "excess-return", "law-of-one-price", "pairs-decline-2010", "pairs-guide", "pairs-trading", "retail", "transaction-costs", "twin-shares-2009", "who-pays"]}, "twin-shares-2009": {"title": "雙胞胎股票的套利風險（de Jong, Rosenthal & van Dijk 2009）", "type": "source", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一家公司的兩種股票價格可以差 30% 以上，套利平均有賺，但可能要等好幾年才收斂。<\/p>\n<h2>資料<\/h2>\n<ul>\n<li>12 組「雙重上市公司」（又叫連體嬰公司），例如 Royal Dutch／Shell、Unilever。<\/li>\n<li>Royal Dutch／Shell 和 Unilever 的期間是 1980 年 1 月 1 日到 2002 年 10 月 3 日；其他組從合併日開始。<\/li>\n<\/ul>\n<p><strong>什麼是雙重上市公司<\/strong>：兩家公司合併營運、共享現金流，但各自保留在不同國家上市的股票。Royal Dutch 在荷蘭、Shell 在英國，兩者分的是同一份獲利（按固定比例），所以兩檔股票的價格應該永遠維持固定比例。這是比 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a> 更純粹的配對：不是「走勢像」，而是「本來就是同一個東西」。<\/p>\n<h2>方法<\/h2>\n<ol>\n<li>算每組雙胞胎的實際價格比和理論比例差多少（取對數的偏離百分比）。<\/li>\n<li><strong>進場<\/strong>：偏離超過 10%，買便宜的、空貴的。<\/li>\n<li><strong>出場<\/strong>：偏離縮到 5% 以內，或持有滿一年（260 個交易日）強制平倉。<\/li>\n<li>算入成本：每筆 25 bps 佣金，建倉時付一半 40 bps 的買賣價差。<\/li>\n<li>算入保證金規則：一開始要 50% 保證金，跌破維持水準就被追繳、部分平倉。<\/li>\n<\/ol>\n<h2>結果<\/h2>\n<ul>\n<li><strong>Royal Dutch／Shell 的偏離<\/strong>：平均絕對偏離約 10%，標準差約 12.7%，最低 −36.2%，最高 +19.8%。<\/li>\n<li>12 組在研究期間都出現過超過 15% 的偏離，其中 5 組超過 20%。<\/li>\n<li>基準策略平均每月 1.18%，約每年 14.2%（風險調整前）；用三因子模型調整後，超額報酬最高約每年 8.9%。<\/li>\n<li>進場門檻拉高到 14–18% 時超額報酬更高，但交易次數變很少。<\/li>\n<\/ul>\n<h2>在賺誰的錢<\/h2>\n<p>論文沒有點名對手方。更早的 Froot &amp; Dabora（1999）發現，雙胞胎的相對價格會跟著各自主要交易市場的漲跌走：例如紐約大盤相對英國上漲時，在美國交易較多的那一檔就變貴（Wiki 只讀了該篇的摘要）。Wiki 據此推論，付錢的可能是各國市場裡跟著本地行情追高殺低的投資人。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>兩檔股票分的是同一份現金流，所以價格比例<strong>最後<\/strong>一定會回到理論值。問題是「最後」是什麼時候。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>收斂時間不確定<\/strong>：沒有任何日期保證會收斂。有些部位拉了將近 9 年；基準策略下，Royal Dutch／Shell 的部位加起來持有了約 7 年半，差不多是樣本期的三分之一。<\/li>\n<li><strong>中途大虧<\/strong>：持有滿一年被強制平倉的部位，最多虧掉投入資金的 16.5%；有些策略的單筆虧損最多到 23%。127 筆裡有 11 筆是虧的。<\/li>\n<li><strong>保證金追繳<\/strong>：超過 10% 的部位至少被追繳一次，很多是在錯價擴大時連續被追繳。<\/li>\n<li><strong>波動很大<\/strong>：套利報酬的年化波動約 31–35%，比 S&amp;P 500 的 22–24% 還高。「套利」聽起來安全，實際上比買大盤還顛簸。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>上面的報酬已經扣掉佣金、價差，也模擬了保證金規則，風險調整後每年最高約 8.9%。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文（論文自己說的）<\/strong>\n- 12 組、1980–2002、Royal Dutch／Shell 偏離 −36.2% 到 +19.8%、10%／5%／一年的規則、每月 1.18%、超額報酬最高約 8.9%、將近 9 年、7 年半、16.5%、23%、11／127、超過 10% 被追繳、波動 31–35%。\n- 這篇<strong>沒有<\/strong>提到 LTCM 或 1998 年。Royal Dutch／Shell 在 2005 年合併成單一股票，作者沒有納入樣本。<\/p>\n<p><strong>推論（Wiki 補的）<\/strong>\n- 付錢的是跟著本地行情追高殺低的投資人。<\/p>\n<h2>讀了什麼<\/h2>\n<p>作者網站上的全文 PDF（<em>Review of Finance<\/em>, 2009）。卷期號沒有從 PDF 上核對到。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li>策略：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<li>案例：<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>、<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "law-of-one-price", "leverage", "limits-of-arbitrage", "ltcm", "pairs-guide", "pairs-trading"]}, "cross-exchange-arb": {"title": "跨交易所套利", "type": "strategy", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一個幣在 A 交易所比 B 便宜，就在 A 買、在 B 賣，賺中間的差。<\/p>\n<h2>怎麼做<\/h2>\n<ol>\n<li>同時盯多家交易所的價格。<\/li>\n<li>價差大於所有成本時，在便宜的交易所買、在貴的交易所賣。<\/li>\n<li>把幣和錢搬回原位，準備下一次。這一步最難：幣要等區塊確認，法幣要跨國匯款。<\/li>\n<\/ol>\n<p>實務上常見的做法是兩邊都先放好幣和錢，同時下單，之後再慢慢搬回平衡，這是一般做法，不是論文的內容。<\/p>\n<h2>在賺誰的錢<\/h2>\n<p>賺的是在溢價市場買幣的人（Wiki 推論）。例如 2017–2018 年韓國的比特幣價格比美國高 15% 以上，在韓國買的人多付了這段。見 <a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>錢和幣都能自由搬動，而且搬的期間價格不會大變。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li><strong>資本管制<\/strong>：錢搬不回來，價差就會一直存在，而且套利者拿不到。這是跨國價差能大到 40% 的主因。<\/li>\n<li><strong>同一國內<\/strong>：搬錢容易，價差通常不到 1%，扣掉手續費可能就沒了。<\/li>\n<li>交易所被駭、凍結提款的風險。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>論文只估潛在利潤（2017 年 12 月到 2018 年 2 月至少 20 億美元），沒有估實際能拿到多少。要扣掉手續費、匯款成本、搬運期間的價格風險。<\/p>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>：34 家交易所、19 個地區，跨國價差遠大於國內價差。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li>同類：<a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>（也是同一個東西兩個價格，但靠速度）、<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/li>\n<li>誰在做：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "crypto-arb-2020", "hft-latency-arb", "law-of-one-price", "who-pays"]}, "hft-latency-arb": {"title": "高頻延遲套利", "type": "strategy", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>兩個市場賣同一個東西，價格動時總有幾毫秒不同步，最快的人搶先吃掉。<\/p>\n<h2>怎麼做<\/h2>\n<ol>\n<li>找兩個追蹤同一資產的商品，例如 S&amp;P 500 期貨和 S&amp;P 500 ETF。<\/li>\n<li>一邊的價格先動，另一邊的掛單還沒來得及改，就是「過時報價」。<\/li>\n<li>在過時的那邊買或賣，同時在另一邊反向操作，鎖住價差。<\/li>\n<li>整個過程要在幾毫秒內完成，所以需要專線、機房就近擺放。<\/li>\n<\/ol>\n<h2>在賺誰的錢<\/h2>\n<p>賺的是<strong>掛單者<\/strong>（<a class=\"wl\" href=\"#market-makers\">做市商<\/a>）的錢：他們的報價被狙擊。做市商會把這個損失加進價差，最後由所有一般投資人付。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>市場連續撮合、先到先得，而且兩個市場的價格最終一定會對齊。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li>有人比你快，你就拿不到。<\/li>\n<li>交易所改成批次撮合，這類機會就不存在。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>每次扣掉價差後約 0.09 指數點，ES–SPY 一年約 7,500 萬美元。但要先投入大量資金買速度，而且要一直投下去。<\/p>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>：2005–2011 年，機會持續時間從 97 毫秒縮到 7 毫秒，每次利潤卻沒變小。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li>玩家：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>同類（套利）：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>、<a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a><\/li>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "cross-exchange-arb", "hft-race-2015", "law-of-one-price", "market-makers", "who-pays"]}, "momentum": {"title": "動量策略", "type": "strategy", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>買最近漲最多的、賣最近跌最多的，賭趨勢會再延續一陣子。<\/p>\n<h2>怎麼做<\/h2>\n<ol>\n<li>選一段「回看期」（例如過去 6 個月），把所有股票依報酬排名。<\/li>\n<li>買前 10%，放空後 10%，金額相等。<\/li>\n<li>持有一段時間（例如 6 個月），然後重新排名。<\/li>\n<\/ol>\n<h2>在賺誰的錢<\/h2>\n<p>主流解釋是：市場對消息反應太慢，價格要好幾個月才走完。動量交易者提早站上去，賺的是「反應慢的人」讓出來的那一段。這個對手方是推論，原始論文沒有點名。見 <a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>。<\/p>\n<h2>靠什麼假設<\/h2>\n<p>價格反應延遲，而且延遲不會很快被其他交易者消滅。<\/p>\n<h2>什麼時候失效<\/h2>\n<ul>\n<li>持有超過約 12 個月就開始反轉。<\/li>\n<li>在 1927–1940 年的美股完全賺不到錢，持有一年反而虧損。<\/li>\n<li>參與的人變多之後還剩多少，這篇來源沒有涵蓋，記在 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/li>\n<\/ul>\n<h2>扣成本後剩多少<\/h2>\n<p>以 1965–1989 年美股、單邊成本 0.5% 計算，每年仍約 9%。成本假設越接近真實，數字越可信。<\/p>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>：6 個月回看、6 個月持有，每月約 0.95% 超額報酬。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li>總覽：<a class=\"wl\" href=\"#who-pays\">總覽：誰在付錢<\/a><\/li>\n<li>方向相反：<a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>（動量賭偏離會延續，配對交易賭偏離會回來）<\/li>\n<li>概念：<a class=\"wl\" href=\"#excess-return\">超額報酬<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a><\/li>\n<\/ul>", "back": ["excess-return", "momentum-1993", "pairs-trading", "pairs-trading-2006", "who-pays"]}, "pairs-trading": {"title": "配對交易", "type": "strategy", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>兩個像雙胞胎的價格拉開時，買便宜的、空貴的，賭它們會靠回來。<\/p>\n<h2>怎麼做<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 452\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"配對交易示意圖：上方是兩檔股票的價格，下方是兩者的價差與正負兩個標準差的界線\">\n<rect x=\"427.7\" y=\"26\" width=\"56.2\" height=\"374\" class=\"f-hold\"/>\n<text x=\"56\" y=\"20\" class=\"f-h\">兩檔股票的價格<\/text>\n<path d=\"M56.0,129.9 L59.1,127.8 L62.2,126.8 L65.4,120.8 L68.5,129.3 L71.6,123.3 L74.7,136.3 L77.9,119.6 L81.0,113.5 L84.1,126.4 L87.2,123.7 L90.4,113.3 L93.5,117.7 L96.6,116.4 L99.7,113.4 L102.8,123.2 L106.0,111.3 L109.1,99.8 L112.2,100.1 L115.3,93.3 L118.5,82.1 L121.6,85.2 L124.7,96.7 L127.8,99.9 L131.0,97.4 L134.1,86.6 L137.2,86.2 L140.3,90.9 L143.5,102.2 L146.6,101.2 L149.7,99.1 L152.8,100.9 L155.9,114.0 L159.1,98.8 L162.2,89.6 L165.3,81.7 L168.4,82.6 L171.6,83.3 L174.7,74.1 L177.8,63.0 L180.9,65.1 L184.1,77.3 L187.2,77.0 L190.3,73.6 L193.4,70.1 L196.5,76.3 L199.7,73.1 L202.8,73.8 L205.9,69.7 L209.0,51.0 L212.2,49.8 L215.3,65.2 L218.4,67.3 L221.5,72.9 L224.7,70.8 L227.8,75.0 L230.9,76.0 L234.0,72.1 L237.2,70.5 L240.3,68.2 L243.4,61.6 L246.5,66.9 L249.6,57.4 L252.8,63.4 L255.9,74.6 L259.0,73.8 L262.1,69.8 L265.3,69.6 L268.4,59.2 L271.5,66.4 L274.6,62.9 L277.8,61.7 L280.9,73.8 L284.0,71.8 L287.1,79.0 L290.2,73.9 L293.4,73.8 L296.5,75.2 L299.6,65.3 L302.7,60.7 L305.9,59.9 L309.0,51.2 L31 .1 L724.4,344.1 L727.5,333.7 L730.6,330.4 L733.8,328.0 L736.9,323.0 L740.0,314.1\" class=\"f-s\"/>\n<circle cx=\"427.7\" cy=\"387.4\" r=\"6\" class=\"f-in\"/>\n<circle cx=\"483.9\" cy=\"317.4\" r=\"6\" class=\"f-out\"/>\n<text x=\"417.7\" y=\"414\" text-anchor=\"end\" class=\"f-lab\">① 跌破 −2σ：買 A、空 B<\/text>\n<text x=\"493.9\" y=\"414\" class=\"f-lab\">② 回到 0：平倉<\/text>\n<text x=\"740\" y=\"448\" text-anchor=\"end\" class=\"f-note\">示意，非真實資料（模擬產生）<\/text>\n<\/svg><\/figure>\n<p><strong>1. 找雙胞胎<\/strong>。用過去一年的價格，找出走勢最像的兩檔股票。學術上最簡單的方法是「距離法」：把兩檔的累積報酬標準化，算兩條線之間差距的平方加總，越小越像。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/p>\n<p><strong>2. 盯著價差<\/strong>。每天看兩者標準化後的差距。差距超過過去的 2 個標準差，就進場：買落後的、空領先的，金額一樣。<\/p>\n<p><strong>3. 等它回來<\/strong>。兩條線再次交叉就平倉。6 個月到期還沒交叉，就強制平倉。<\/p>\n<p><strong>4. 為什麼要一買一空<\/strong>。兩檔一起漲或一起跌時，賺賠互相抵銷，所以大盤漲跌對你影響很小。你只賭一件事：兩者的「相對」價格會回來。<\/p>\n<p><strong>一個數字例子（示意）<\/strong>。A 和 B 過去一年幾乎同步。某天 A 突然比平常多跌了 6%，超過 2 個標準差。你買 10 萬元的 A、空 10 萬元的 B。兩週後兩者回到同步，A 相對 B 漲回約 6%，你賺約 6,000 元，再扣掉兩邊的買賣價差和手續費。如果 A 是因為公司真的出事才跌的，那 6% 就不會回來，還可能越拉越開。<\/p>\n<p><strong>更好的找法<\/strong>。只在同一個細分產業裡配對，並優先挑「過去常常交叉」的組合（交叉次數多，代表常回歸），能明顯提高利潤；銀行股每月多約 22 bps。見 <a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/p>\n<p><strong>最純粹的配對<\/strong>。同一家公司在兩個國家上市的兩種股票（例如 Royal Dutch／Shell），分的是同一份現金流，理論上價格比例固定。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/p>\n<h2>在賺誰的錢<\/h2>\n<p>作者認為這是套利者「把價格修正回來」的報酬：兩檔可以互相替代的股票被暫時定錯，套利者負責把它推回來。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/p>\n<p>付錢的是誰，論文沒有直接點名。Wiki 推論是把其中一檔暫時推離夥伴的人：急著買賣、不在乎價格的交易者，或恐慌時急著賣出的人。2000–02 年空頭和 2007–09 年金融危機期間，配對交易反而賺得特別多，也符合這個推論。見 <a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/p>\n<h2>靠什麼假設<\/h2>\n<ol>\n<li>兩檔的關係穩定，拉開只是暫時的。<\/li>\n<li><strong>你撐得到它回來的那一天<\/strong>。這一條最常被忽略，也是 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a> 倒下的原因。<\/li>\n<\/ol>\n<h2>什麼時候失效<\/h2>\n<p><strong>越來越多人做，利潤越來越薄<\/strong>。前 20 對每月平均超額報酬：<\/p>\n<table>\n<thead>\n<tr>\n<th>期間<\/th>\n<th>每月超額報酬<\/th>\n<th>來源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1962–1988<\/td>\n<td>0.86%<\/td>\n<td><a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a><\/td>\n<\/tr>\n<tr>\n<td>1989–2002<\/td>\n<td>0.37%<\/td>\n<td><a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a><\/td>\n<\/tr>\n<tr>\n<td>2003–2009<\/td>\n<td>0.24%<\/td>\n<td><a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>（Gatev 等人用不同計算口徑，得到 1989 年前約 118 bps、之後約 38 bps，趨勢相同。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。）<\/p>\n<p><strong>關係真的變了<\/strong>。公司被併購、出事、轉型，價差就永遠不回來。這叫基本面風險。<\/p>\n<p><strong>價差先變得更開<\/strong>。情緒化的交易把價差推得更遠，你帳面虧損、被追繳保證金、出資人撤資，被迫在最差的時候認賠。這就是 <a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>。<\/p>\n<p><strong>大家都在做同一筆<\/strong>。LTCM 的 Royal Dutch／Shell 部位，溢價從約 8% 擴大到超過 17%；而它其他的價差交易同時出事，原本互不相關的部位相關性從 0.1 升到 0.7。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>等太久<\/strong>。雙胞胎股票的套利，有些部位要拉將近 9 年才收斂；持有滿一年就強制平倉的部位，最多虧掉 16.5%。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/p>\n<h2>扣成本後剩多少<\/h2>\n<ul>\n<li>1962–2002 年：作者估計一來一回成本約 162 bps，扣完每 6 個月仍有約 113–225 bps。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li>雙胞胎股票（1980–2002）：扣掉佣金、價差並模擬保證金規則後，風險調整後每年最高約 8.9%。但報酬的年化波動約 31–35%，比買大盤還顛簸。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li>近年（2003–2009）：沒扣成本的超額報酬只剩每月約 24 bps。拿 162 bps 的成本估計對照，簡單版的配對交易扣完成本可能所剩無幾，這是 Wiki 的推論。見 <a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/li>\n<\/ul>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>：1962–2002 年美股，前 20 對年化最高約 11%，隨機配對賺不到錢。<\/li>\n<li><a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>：延長到 2009 年，利潤持續下降，但危機期間表現好。<\/li>\n<li><a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>：12 組雙胞胎股票，平均有賺，但收斂時間不確定、中途可能大虧。<\/li>\n<li><a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>：LTCM 的 Royal Dutch／Shell 交易與 1998 年危機。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li>導覽：<a class=\"wl\" href=\"#pairs-guide\">配對交易導覽：賭雙胞胎會回來<\/a><\/li>\n<li>案例：<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a><\/li>\n<li>誰在做：<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a><\/li>\n<li>概念：<a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>、<a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>、<a class=\"wl\" href=\"#leverage\">槓桿<\/a>、<a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>、<a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a><\/li>\n<li>方向相反：<a class=\"wl\" href=\"#momentum\">動量策略<\/a>（動量賭偏離會延續，配對賭偏離會回來）<\/li>\n<\/ul>", "back": ["arbitrageurs", "bid-ask-spread", "cross-exchange-arb", "excess-return", "hft-latency-arb", "law-of-one-price", "limits-arbitrage-1997", "limits-of-arbitrage", "ltcm", "ltcm-2006", "momentum", "pairs-decline-2010", "pairs-guide", "pairs-trading-2006", "twin-shares-2009", "who-pays"]}, "todo": {"title": "待寫清單", "type": "overview", "updated": "2026-11-23", "html": "<p>新點子只記在這裡，這一輪不展開。「出現次數」是提到它的來源頁數量，到 2 就可以拆成概念頁（AGENTS.md 第 7 節）。<\/p>\n<h2>概念<\/h2>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>出現在<\/th>\n<th>出現次數<\/th>\n<th>狀態<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>交易成本<\/td>\n<td><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/td>\n<td>3<\/td>\n<td>已拆成 <a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a><\/td>\n<\/tr>\n<tr>\n<td>超額報酬<\/td>\n<td><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/td>\n<td>3<\/td>\n<td>已拆成 <a class=\"wl\" href=\"#excess-return\">超額報酬<\/a><\/td>\n<\/tr>\n<tr>\n<td>買賣價差<\/td>\n<td><a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/td>\n<td>2<\/td>\n<td>已拆成 <a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a><\/td>\n<\/tr>\n<tr>\n<td>bps（基點）<\/td>\n<td><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/td>\n<td>2<\/td>\n<td>已拆成 <a class=\"wl\" href=\"#bps\">bps<\/a>（#5）<\/td>\n<\/tr>\n<tr>\n<td>一價定律<\/td>\n<td><a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a><\/td>\n<td>3<\/td>\n<td>已拆成 <a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>（#5）<\/td>\n<\/tr>\n<tr>\n<td>資本管制<\/td>\n<td><a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a><\/td>\n<td>1<\/td>\n<td>先寫在來源頁裡<\/td>\n<\/tr>\n<tr>\n<td>套利的極限<\/td>\n<td><a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>、<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>、<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>、<a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a><\/td>\n<td>4<\/td>\n<td>已拆成 <a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>（配對篇）<\/td>\n<\/tr>\n<tr>\n<td>槓桿<\/td>\n<td><a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>、<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>、<a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a><\/td>\n<td>3<\/td>\n<td>已拆成 <a class=\"wl\" href=\"#leverage\">槓桿<\/a>（配對篇）<\/td>\n<\/tr>\n<tr>\n<td>共整合（cointegration）<\/td>\n<td>尚無來源<\/td>\n<td>0<\/td>\n<td>配對篇想補，需要先收錄一篇<\/td>\n<\/tr>\n<tr>\n<td>頻繁批次拍賣<\/td>\n<td><a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a><\/td>\n<td>1<\/td>\n<td>先寫在來源頁裡<\/td>\n<\/tr>\n<tr>\n<td>放空成本<\/td>\n<td><a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/td>\n<td>1<\/td>\n<td>先寫在 <a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a> 裡<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>玩家<\/h2>\n<table>\n<thead>\n<tr>\n<th>玩家<\/th>\n<th>狀態<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>套利者<\/td>\n<td>已建 <a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>（#4）<\/td>\n<\/tr>\n<tr>\n<td>做市商<\/td>\n<td>已建 <a class=\"wl\" href=\"#market-makers\">做市商<\/a>（#4）<\/td>\n<\/tr>\n<tr>\n<td>高頻交易者<\/td>\n<td>先併在 <a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a> 裡（快速版套利者），避免和 <a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a> 重複<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>你自己的實驗（等你提供資料）<\/h2>\n<ul>\n<li><strong>OKX–Binance 比特幣永續價差回測<\/strong>：之前跑出的 IC 很強，但還沒確認扣完 10 bps 成本後是否還有利潤。<a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a> 說同一國內交易所價差通常不到 1%，可以拿來對照。要建「實驗紀錄」頁，需要你提供回測結果。<\/li>\n<\/ul>\n<h2>還沒有來源支持的問題<\/h2>\n<ul>\n<li>動量策略在 1990 年以後、參與者變多之後還剩多少？<\/li>\n<li>「反應慢的人」「把價格推開的人」具體是誰？<\/li>\n<li>零佣金時代，散戶頻繁交易的代價變多少？<\/li>\n<li>配對交易改用共整合（cointegration）找配對，會不會比距離法好？<\/li>\n<li>Do &amp; Faff（2012）專門研究配對交易扣成本後還剩多少，可收錄。<\/li>\n<li>加密貨幣的配對交易：你 11 月做的大型幣配對篩選（6 組都沒通過協整檢定、APT/SUI 單邊發散）可以整理成實驗紀錄頁。<\/li>\n<li>2018 年以後，加密貨幣跨國價差還有多大？<\/li>\n<li>資金費率套利（永續合約）在賺誰的錢？<\/li>\n<\/ul>", "back": ["momentum", "pairs-decline-2010"]}, "who-pays": {"title": "總覽：誰在付錢", "type": "overview", "updated": "2026-11-23", "html": "<h2>策略對上四問題<\/h2>\n<table>\n<thead>\n<tr>\n<th>策略<\/th>\n<th>在賺誰的錢<\/th>\n<th>靠什麼假設<\/th>\n<th>什麼時候失效<\/th>\n<th>扣成本後剩多少<\/th>\n<th>來源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a class=\"wl\" href=\"#momentum\">動量策略<\/a><\/td>\n<td>對消息反應慢的人（推論）<\/td>\n<td>價格反應延遲<\/td>\n<td>持有超過 12 個月；1927–1940 年<\/td>\n<td>單邊 0.5% 成本後每年約 9%<\/td>\n<td><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a><\/td>\n<\/tr>\n<tr>\n<td><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a><\/td>\n<td>把價格暫時推開的人（推論）；作者稱為套利者維持一價定律的報酬<\/td>\n<td>兩檔關係穩定，偏離是暫時的<\/td>\n<td>1989 年後原始報酬掉到約三分之一；公司關係改變<\/td>\n<td>扣約 162 bps 成本後每半年 113–225 bps；近年變薄<\/td>\n<td><a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>；案例 <a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a><\/td>\n<\/tr>\n<tr>\n<td><a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a><\/td>\n<td>報價被狙擊的 <a class=\"wl\" href=\"#market-makers\">做市商<\/a>，最後轉嫁給一般投資人（論文原話）<\/td>\n<td>連續撮合、先到先得<\/td>\n<td>有人比你快；改成批次撮合<\/td>\n<td>每次約 0.09 指數點，ES–SPY 一年約 7,500 萬美元，另需持續投資速度<\/td>\n<td><a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a><\/td>\n<\/tr>\n<tr>\n<td><a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a><\/td>\n<td>在溢價市場買幣的人（推論）<\/td>\n<td>錢和幣能自由搬動<\/td>\n<td>資本管制；國內價差太小<\/td>\n<td>論文只估潛在利潤（至少 20 億美元），實際遠少於此<\/td>\n<td><a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>反過來：誰在付錢<\/h2>\n<table>\n<thead>\n<tr>\n<th>付錢的人<\/th>\n<th>付給誰<\/th>\n<th>付了多少<\/th>\n<th>來源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>頻繁交易的 <a class=\"wl\" href=\"#retail\">散戶<\/a><\/td>\n<td>佣金給 <a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a>；價差給 <a class=\"wl\" href=\"#market-makers\">做市商<\/a>（推論）<\/td>\n<td>交易最多的 20% 每年輸大盤約 6.5 個百分點<\/td>\n<td><a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a><\/td>\n<\/tr>\n<tr>\n<td>溢價市場的買家（例如 2017–2018 年的韓國）<\/td>\n<td>多付給賣幣的人；套利者因資本管制進不來<\/td>\n<td>價格比美國高 15% 以上，最高 40%<\/td>\n<td><a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a><\/td>\n<\/tr>\n<tr>\n<td>一般投資人<\/td>\n<td>透過更寬的價差，間接付給狙擊報價的高頻交易者<\/td>\n<td>論文沒有換算成每個人的金額<\/td>\n<td><a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>五篇看下來的共同點<\/h2>\n<ol>\n<li><strong>每一種賺錢方法都有對手<\/strong>。對手可能是反應慢的人、急著交易的人、報價被搶的人，或是被管制擋在國內的買家。<\/li>\n<li><strong>套利賺的是「被擋住」的那段<\/strong>。擋住別人的東西不同：配對交易是耐心和放空成本，高頻是速度，跨國加密是資本管制。見 <a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>。<\/li>\n<li><strong>方向猜對不夠，要扣完成本<\/strong>。散戶的毛報酬和大盤差不多，輸在成本；配對交易和高頻套利的利潤都要先扣掉價差。見 <a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>。<\/li>\n<li><strong>做的人一多就變少<\/strong>。配對交易 1989 年後縮水，高頻套利的時間窗從 97 毫秒縮到 7 毫秒。<\/li>\n<li><strong>很多「在賺誰的錢」是推論<\/strong>。論文常說明策略為什麼賺錢，但很少直接點名對手方。本表標了「推論」的格子，都是 Wiki 補的。<\/li>\n<\/ol>", "back": ["arbitrageurs", "cross-exchange-arb", "crypto-arb-2020", "excess-return", "hft-latency-arb", "hft-race-2015", "law-of-one-price", "market-makers", "momentum", "momentum-1993", "overtrading-2000", "pairs-decline-2010", "pairs-trading-2006", "retail", "transaction-costs", "twin-shares-2009"]}}, "nav": [{"label": "總覽", "items": [{"slug": "pairs-guide", "title": "配對交易導覽：賭雙胞胎會回來"}, {"slug": "who-pays", "title": "總覽：誰在付錢"}, {"slug": "index", "title": "目錄"}, {"slug": "todo", "title": "待寫清單"}, {"slug": "log", "title": "收錄紀錄"}]}, {"label": "策略", "items": [{"slug": "cross-exchange-arb", "title": "跨交易所套利"}, {"slug": "hft-latency-arb", "title": "高頻延遲套利"}, {"slug": "momentum", "title": "動量策略"}, {"slug": "pairs-trading", "title": "配對交易"}]}, {"label": "案例", "items": [{"slug": "ltcm", "title": "LTCM：最會算的人，賭雙胞胎會回來"}]}, {"label": "來源", "items": [{"slug": "momentum-1993", "title": "買贏家、賣輸家 1993"}, {"slug": "limits-arbitrage-1997", "title": "套利的極限 1997"}, {"slug": "overtrading-2000", "title": "交易有害你的財富 2000"}, {"slug": "ltcm-2006", "title": "LTCM 與套利 2006"}, {"slug": "pairs-trading-2006", "title": "配對交易 2006"}, {"slug": "twin-shares-2009", "title": "雙胞胎股票的套利風險 2009"}, {"slug": "pairs-decline-2010", "title": "簡單的配對交易還有用嗎？ 2010"}, {"slug": "hft-race-2015", "title": "高頻交易軍備競賽 2015"}, {"slug": "crypto-arb-2020", "title": "加密貨幣的交易與套利 2020"}]}, {"label": "玩家", "items": [{"slug": "arbitrageurs", "title": "套利者"}, {"slug": "brokers-exchanges", "title": "券商與交易所"}, {"slug": "market-makers", "title": "做市商"}, {"slug": "retail", "title": "散戶"}]}, {"label": "概念", "items": [{"slug": "bid-ask-spread", "title": "買賣價差"}, {"slug": "bps", "title": "bps"}, {"slug": "excess-return", "title": "超額報酬"}, {"slug": "law-of-one-price", "title": "一價定律"}, {"slug": "leverage", "title": "槓桿"}, {"slug": "limits-of-arbitrage", "title": "套利的極限"}, {"slug": "transaction-costs", "title": "交易成本"}]}], "counts": {"策略": 4, "案例": 1, "來源": 9, "玩家": 4, "概念": 7}, "home": "who-pays", "subtitle": "完整版", "site": "index.html"};
const navHtml = DATA.nav.map(g => `<h2>${g.label}</h2>` +

const TYPE = {overview:'總覽', source:'來源', strategy:'策略', player:'玩家', concept:'概念', case:'案例'};

const NAMES = Object.fromEntries(DATA.nav.flatMap(g => g.items).map(i => [i.slug, i.title]));
const title = s => NAMES[s] || (DATA.pages[s] ? DATA.pages[s].title : s);

  for (const t of el.querySelectorAll('table')) {
    const w = document.createElement('div'); w.className = 'scroll';

  }
  for (const a of document.querySelectorAll('nav a')) {

  document.getElementById('mnav').open = false;

  window.scrollTo(0, 0);
