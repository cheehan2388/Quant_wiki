<style>
/* VOICE: 研究筆記本，冷靜、清楚，像一本整理好的交易帳簿
   IDEA: 一本帳簿：每一頁都在回答「錢從誰流到誰」

:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#101418);--ink:light-dark(#101418,#e8ecf0);--muted:light-dark(#5b6670,#9aa6b1);
  --line:light-dark(#e3e7eb,#26303a);--side:light-dark(#f5f7f9,#151b21);--hl:#ffd84a;--hl-ink:#101418;
  --link:light-dark(#1f4fd1,#8fb2ff);--chip:light-dark(#eef1f4,#1e2630)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Manrope","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:clip}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:18px max(4vw,16px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}

.counts{margin-left:auto;color:var(--muted);font-size:13px}
.sitehome{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.sitehome:hover{background:var(--chip)}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px}
nav{background:var(--side);border-right:1px solid var(--line);padding:18px 16px 40px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
nav h2{font-size:13px;color:var(--muted);margin:18px 0 6px;font-weight:700}
nav h2:first-child{margin-top:0}
nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.35}
nav a:hover{background:var(--chip)}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
nav a:focus-visible,.wl:focus-visible{outline:2px solid var(--link);outline-offset:2px}
main{padding:28px max(4vw,16px) 80px}
article{max-width:980px}
.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:6px}
.chip{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:1px 8px;font-weight:700}
article h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 18px;text-wrap:balance;letter-spacing:-.015em}
article h2{font-size:20px;margin:34px 0 8px;padding-top:14px;border-top:1px solid var(--line)}

article blockquote{margin:14px 0;padding:8px 16px;border-left:4px solid var(--hl);background:var(--side)}
article code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.9em;overflow-wrap:anywhere}

table{border-collapse:collapse;font-size:14.5px;line-height:1.5;width:100%;min-width:560px}

.back{margin-top:44px;padding:16px 18px;background:var(--side);border-radius:8px;font-size:15px}

.back a{margin-right:14px;white-space:nowrap}
.maybe{margin-top:12px;background:none;border:1px dashed var(--line)}
.hint2{display:block;font-size:13px;color:var(--muted);margin:-2px 0 6px}

math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Noto Sans Math",math;font-size:1.12em}

td math{font-size:1.32em;white-space:nowrap}
.sub{color:var(--muted);font-weight:600;font-size:15px}

.fig{margin:22px 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.fig{overflow-x:auto}.fig-svg{width:100%;min-width:560px;height:auto;display:block;font-family:inherit}
.f-h{font-size:14px;font-weight:700;fill:var(--ink)}
.f-lab{font-size:13px;fill:var(--ink)}.f-tick{font-size:12px;fill:var(--muted)}
.f-note{font-size:12px;fill:var(--muted)}
.f-a{fill:none;stroke:var(--ink);stroke-width:2}.f-b{fill:none;stroke:var(--link);stroke-width:2}
.f-ka{fill:var(--ink)}.f-kb{fill:var(--link)}
.f-s{fill:none;stroke:var(--ink);stroke-width:1.8}
.f-band{stroke:var(--muted);stroke-dasharray:5 5}.f-zero{stroke:var(--muted)}
.f-hold{fill:var(--hl);opacity:.28}
.f-in{fill:var(--hl);stroke:var(--hl-ink);stroke-width:1.5}.f-out{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.k-dot{fill:var(--muted);opacity:.55}.k-ma{fill:none;stroke:var(--link);stroke-width:3}
.k-kf{fill:none;stroke:#d6453d;stroke-width:3}.k-turn{stroke:var(--muted);stroke-dasharray:4 4}
.kl text{font-size:16px;fill:var(--ink);text-anchor:middle}

.kl-n rect{fill:var(--bg);stroke:var(--ink);stroke-width:2.5}
.kl-c rect{fill:var(--hl);stroke:var(--hl-ink);stroke-width:2.5}.kl-c text{fill:var(--hl-ink)}
.kl-g rect{fill:var(--side);stroke:var(--line);stroke-width:1.5}.kl .kl-gt{font-weight:800}
.kl-e{fill:none;stroke:var(--ink);stroke-width:2.5}.kl-head{fill:var(--ink)}
.nb .nb-c{fill:none;stroke:var(--ink);stroke-width:3}.nb-1{fill:var(--hl);opacity:.55}.nb-2{fill:var(--hl);opacity:.22}
.nb-ax{stroke:var(--muted);stroke-width:1.5}.nb text{font-size:14px;fill:var(--ink)}.nb .nb-big{font-size:22px;font-weight:800}
.nb .nb-n{font-size:12px;fill:var(--muted)}
.nf-a{fill:none;stroke:var(--ink);stroke-width:2.5}.nf-b{fill:none;stroke:var(--link);stroke-width:2.5}
.nf-f{fill:rgba(214,69,61,.12);stroke:#d6453d;stroke-width:3.5}.nf-mid{stroke:#d6453d;stroke-dasharray:4 4}
.nb .nf-ta{font-weight:700}.nb .nf-tb{font-weight:700;fill:var(--link)}.nb .nf-tf{font-weight:800;fill:#d6453d}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:6px 0 10px 14px;display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:4px 14px;max-width:none}
.tl li::before{content:"";position:absolute;left:-25px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.tl li.bad::before{background:#d6453d;border-color:#d6453d}.tl li.good::before{background:var(--hl);border-color:var(--hl-ink)}
.tl b{white-space:nowrap}
.fig-src{font-size:13px;color:var(--muted);margin:10px 0 0}
@media(max-width:600px){.tl li{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav{display:none}
  .mnav{display:block;border-bottom:1px solid var(--line);background:var(--side)}
  .mnav summary{padding:12px max(4vw,16px);font-weight:700;cursor:pointer;min-height:44px}
  .mnav nav{display:block;position:static;max-height:none;border:0}
  .counts{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:no-preference){article{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}

<script>
{
const DATA = {"pages": {"ltcm": {"title": "LTCM：最會算的人，賭雙胞胎會回來", "type": "case", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>賭對了方向、算錯了時間：價差最後真的收斂了，但 LTCM 等不到那一天。<\/p>\n<h2>發生了什麼<\/h2>\n<figure class=\"fig\"><ol class=\"tl\" aria-label=\"LTCM 時間線\">\n  <li><b>1994 年 2 月<\/b><span>LTCM 開始交易<\/span><\/li>\n  <li><b>1995–1996<\/b><span>扣費後報酬 42.8%、40.8%<\/span><\/li>\n  <li><b>1997 年 8 月<\/b><span>自有資本 67 億美元，資產 1,260 億美元<\/span><\/li>\n  <li><b>1997<\/b><span>Royal Dutch 比理論價貴約 8%：空 Royal Dutch、買 Shell<\/span><\/li>\n  <li><b>1998 年初<\/b><span>槓桿約 27 倍；溢價開始擴大<\/span><\/li>\n  <li class=\"bad\"><b>1998 年 8 月 17 日<\/b><span>俄羅斯債務違約，資金逃向安全資產<\/span><\/li>\n  <li class=\"bad\"><b>1998 年 8 月<\/b><span>單月虧掉 44% 資本；溢價一度超過 17%<\/span><\/li>\n  <li class=\"bad\"><b>1998 年 9 月<\/b><span>14 家銀行出資 36 億美元接管 90% 股權<\/span><\/li>\n  <li class=\"good\"><b>2001 年春<\/b><span>Royal Dutch／Shell 的溢價消失：LTCM 賭對了，但已經不在了<\/span><\/li>\n<\/ol>\n<p class=\"fig-src\">資料：MacKenzie（2006）第 8 章，見來源頁「LTCM 與套利」。<\/p>\n<\/figure>\n<p><strong>一家明星基金<\/strong>。長期資本管理公司（Long-Term Capital Management，LTCM）1994 年開始交易，核心成員是所羅門兄弟債券套利部門的交易員，還有學者。1995、1996 年扣費後報酬都超過四成。1997 年 8 月，它用 67 億美元的自有資本撐起 1,260 億美元的資產，等於約 19 倍槓桿（1,260 ÷ 67，Wiki 的算術）；1998 年初約 27 倍。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>一筆教科書級的配對交易<\/strong>。Royal Dutch 和 Shell 是「同一家公司的兩種股票」：集團的現金流按 60：40 分給它們，所以價格應該永遠維持固定比例。但 1997 年，Royal Dutch 比理論價貴了約 8%。LTCM 放空貴的 Royal Dutch、買進便宜的 Shell，賭價差會縮小。大盤和油價的漲跌兩邊互相抵銷，看起來幾乎沒有風險。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>價差反而拉開<\/strong>。1998 年初溢價開始擴大。8 月 17 日俄羅斯債務違約，全世界的資金逃向最安全、最好賣的資產，各種「便宜的會漲回來」的交易同時往反方向走。Royal Dutch 的溢價一度超過 17%，比 LTCM 進場時大一倍。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>所有部位一起出事<\/strong>。LTCM 不只做這一筆，還有幾十種債券、利率交換的價差交易。平常這些部位彼此相關性只有 0.1 左右，危機中升到約 0.7。8 月 21 日單日虧損 5.5 億美元，整個 8 月虧掉 44% 的資本。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>被接管<\/strong>。9 月，紐約聯準會出面協調，14 家銀行出資 36 億美元、取得 90% 的股權。原本的投資人和合夥人只剩約 4 億美元，大約是原來的十分之一。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<p><strong>結局的諷刺<\/strong>。Royal Dutch／Shell 的溢價到 2001 年春天就消失了。LTCM 的判斷是對的，只是它撐不到那一天。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/p>\n<h2>跟策略的關係<\/h2>\n<p>LTCM 的 Royal Dutch／Shell 交易，就是 <a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a> 最純粹的版本：不是「走勢很像」的兩檔股票，而是「本來就是同一家公司」的兩檔股票。照理說，這是最安全的配對。<\/p>\n<p>研究 12 組這類雙胞胎股票的論文發現，這種套利平均確實有賺，但：<\/p>\n<ul>\n<li>Royal Dutch／Shell 的偏離最大到 −36%、+20%；<\/li>\n<li>有些部位要拉將近 9 年才收斂；<\/li>\n<li>超過 10% 的部位被追繳過保證金。\n見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<\/ul>\n<p>所以 LTCM 遇到的不是倒楣的意外，而是這類交易本來就有的風險，只是被槓桿放大了。<\/p>\n<h2>學到什麼<\/h2>\n<ol>\n<li><strong>「最後會收斂」不等於「你撐得到收斂」<\/strong>。這正是 <a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a> 在講的事：價差拉開時，套利者帳面虧損、出資人撤資、保證金被追繳，在機會最好的時候被迫認賠。理論出自 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>，比 LTCM 倒下早一年發表。<\/li>\n<li><strong><a class=\"wl\" href=\"#leverage\">槓桿<\/a> 把小價差變成大報酬，也把小波動變成大災難<\/strong>。27 倍槓桿下，資產只要跌約 4%，自有資本就歸零（Wiki 的算術）。<\/li>\n<li><strong>大家都在做同一筆交易時，分散投資會失效<\/strong>。MacKenzie 認為 LTCM 的成功引來大量模仿，形成一個大家都持有的「超級組合」；有人被迫賣，其他人就跟著虧，價差擴大變成自我強化。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/li>\n<li><strong>用短期歷史估風險會低估災難<\/strong>。Jorion（2000）的摘要指出，LTCM 依賴短期歷史資料，而且風險過度集中，所以嚴重低估了風險。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a> 的「讀了什麼」。<\/li>\n<\/ol>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：LTCM 的 Royal Dutch／Shell 交易就是最純粹的配對交易<\/li>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：說明 LTCM 為什麼在價差收斂前就撐不住<\/li>\n<li><a class=\"wl\" href=\"#leverage\">槓桿<\/a>：約 27 倍槓桿把小價差變成大災難<\/li>\n<li><a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>：LTCM 賭的就是兩檔股票價格會回到一致<\/li>\n<li><a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>：12 組雙胞胎股票的研究，顯示這類套利本來就可能等上好幾年<\/li>\n<\/ul>", "back": ["arbitrageurs", "law-of-one-price", "leverage", "limits-arbitrage-1997", "limits-of-arbitrage", "ltcm-2006", "pairs-guide", "pairs-trading", "twin-shares-2009", "who-pays"], "maybe": []}, "bid-ask-spread": {"title": "買賣價差", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一時間，你能買到的價格永遠比你能賣出的價格高一點，中間那段就是價差。<\/p>\n<h2>白話解釋<\/h2>\n<p>想像換外幣：銀行牌告的「賣出價」比「買入價」高。你換了馬上換回來，一定虧一點，那一點就是價差。<\/p>\n<p>股票也一樣：市場上同時有人掛單要買（bid）、有人掛單要賣（ask），ask 永遠比 bid 高。你想馬上成交，就得用比較差的那個價格，等於每次交易都付出半個價差。<\/p>\n<p>還有一個陷阱叫<strong>買賣價差反彈<\/strong>（bid-ask bounce）：收盤價有時落在 bid、有時落在 ask，價格看起來在跳，其實什麼都沒變。用收盤價做回測，可能把這種假跳動誤當成可以賺的機會。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li>散戶一來一回大約付 1% 的價差（1991–1996 年）。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/li>\n<li>配對交易的研究把「訊號出現後等一天才進場」，報酬每月少 30–55 bps，作者用這個差距估計價差成本。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li>價差為什麼存在：做市商怕報價被高頻交易者狙擊，會把預期損失加進價差，所以速度競爭會讓價差變寬。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>：價差是交易成本裡最難避開的一項<\/li>\n<li><a class=\"wl\" href=\"#market-makers\">做市商<\/a>：價差主要是做市商的收入<\/li>\n<li><a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>：做市商怕被高頻狙擊，所以把價差拉寬<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：配對交易的成本主要來自價差<\/li>\n<\/ul>", "back": ["hft-latency-arb", "hft-race-2015", "market-makers", "overtrading-2000", "pairs-guide", "pairs-trading-2006", "transaction-costs"], "maybe": ["retail", "law-of-one-price", "excess-return", "arbitrageurs"]}, "bps": {"title": "bps（基點）", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>1 bp 是萬分之一，也就是 0.01%，用來講很小的報酬或成本。<\/p>\n<h2>白話解釋<\/h2>\n<p>量化交易常在比很小的數字，用百分比寫會出現一堆小數點，所以改用 bps：<\/p>\n<ul>\n<li>1 bp = 0.01%<\/li>\n<li>10 bps = 0.1%<\/li>\n<li>100 bps = 1%<\/li>\n<\/ul>\n<p>換成錢：投入 100 萬元，1 bp 就是 100 元。<\/p>\n<p>看到「每月 38 bps」就是每月 0.38%；「成本 162 bps」就是 1.62%。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li>動量研究提到，另一份研究估計當時的交易成本只有約 23 bps，所以假設 0.5%（換算成 50 bps，Wiki 的算術）是保守的。見 <a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>。<\/li>\n<li>配對交易：1989 年前每月約 118 bps，之後約 38 bps；一來一回成本約 162 bps。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#transaction-costs\">交易成本<\/a>：成本常用 bps 表示，例如一來一回 162 bps<\/li>\n<li><a class=\"wl\" href=\"#excess-return\">超額報酬<\/a>：超額報酬也常用 bps 表示<\/li>\n<li><a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>：配對交易利潤從每月 0.86% 掉到 0.24%<\/li>\n<\/ul>", "back": ["me", "momentum-1993", "pairs-decline-2010", "pairs-guide", "transaction-costs"], "maybe": []}, "excess-return": {"title": "超額報酬", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>你的報酬減掉一個「什麼都不做也拿得到」的基準，剩下的才算本事。<\/p>\n<h2>白話解釋<\/h2>\n<p>一年賺 15% 聽起來很好，但如果那一年大盤漲 18%，你其實輸了。所以研究不看絕對報酬，而是看「比基準多多少」。<\/p>\n<p>基準有好幾種，越嚴格越可信：<\/p>\n<ol>\n<li><strong>大盤指數<\/strong>：跟市場比。<\/li>\n<li><strong>風險調整後<\/strong>：如果你的組合比大盤更容易大漲大跌，本來就該多賺一點，要先把這部分扣掉（CAPM、Fama-French 因子模型就是在做這件事）。<\/li>\n<\/ol>\n<p>研究裡說「每月 1% 超額報酬」，通常是指扣掉風險之後還多出來的部分。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li>動量：每月約 0.95% 超額報酬，而且組合的 beta 比輸家組還低，所以不是靠多承擔市場風險。見 <a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>。<\/li>\n<li>散戶：用大盤和三因子模型當基準，交易最多的那組明顯落後。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/li>\n<li>配對交易：用五個風險因子調整後，超額報酬只少 10–20 bps，仍然顯著。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#momentum\">動量策略<\/a>：動量的每月約 0.95% 指的是超額報酬<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：配對交易經風險調整後仍有超額報酬<\/li>\n<li><a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>：用超額報酬的概念看出散戶輸在成本<\/li>\n<\/ul>", "back": ["bps", "momentum", "momentum-1993", "pairs-guide"], "maybe": ["transaction-costs", "retail", "bid-ask-spread"]}, "kalman-filter": {"title": "卡爾曼濾波器（一）：直覺與一個數字的版本", "type": "concept", "updated": "2026-11-24", "html": "<h2>一句話<\/h2>\n<p>每一步先用模型猜，再看真實量測修正，修正多少看兩邊誰比較可靠。<\/p>\n<h2>白話解釋<\/h2>\n<p>這一頁的目標是讓你<strong>看得懂、也算得出<\/strong>卡爾曼濾波器的公式，先從只追蹤一個數字的版本開始，分四層。第二頁 <a class=\"wl\" href=\"#kalman-velocity\">卡爾曼濾波器（二）：加入速度與拿來交易<\/a> 再加入速度和矩陣。想動手玩，可以開<a href=\"kalman-lab.html\">拖拉實驗頁<\/a>。<\/p>\n<h3>第 1 層：先懂兩個詞<\/h3>\n<p><strong>還沒讀過的話，先讀 <a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a><\/strong>：它從「平均」講到變異數和鐘形曲線，這一頁的所有公式都建立在它上面。<\/p>\n<ul>\n<li><strong>估計值<\/strong>：你對「真正的價格」的最佳猜測。真正的價格看不到，只能猜。<\/li>\n<li><strong>變異數<\/strong>：在這裡用來表示「有多沒把握」，越大越沒把握。猜 100、標準差 1（變異數 1），代表大概在 99 到 101 之間；標準差 2（變異數 4），大概在 98 到 102 之間。<\/li>\n<\/ul>\n<h3>第 2 層：一個直覺，兩個人報價<\/h3>\n<p>兩個人告訴你同一個價格：<\/p>\n<ul>\n<li>甲說 100，他有點沒把握（變異數 1.5）。<\/li>\n<li>乙說 102，他更沒把握（變異數 2）。<\/li>\n<\/ul>\n<p>最合理的做法是<strong>加權平均，越有把握的人權重越大<\/strong>。數學上，權重剛好是「<strong>對方<\/strong>的變異數」佔總和的比例：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>結合後<\/mtext><mo>&#x0003D;<\/mo><mn>100<\/mn><mo>&#x000D7;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>1.5<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mn>102<\/mn><mo>&#x000D7;<\/mo><mfrac><mrow><mn>1.5<\/mn><\/mrow><mrow><mn>1.5<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>100.86<\/mn><\/mrow><\/math><\/div>\n<p>同一條式子也可以改寫成「從甲的數字出發，往乙走一段」：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>結合後<\/mtext><mo>&#x0003D;<\/mo><mn>100<\/mn><mo>&#x0002B;<\/mo><munder><munder><mrow><mfrac><mrow><mn>1.5<\/mn><\/mrow><mrow><mn>1.5<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><mo>&#x23DF;<\/mo><\/munder><mrow><mn>0.429<\/mn><\/mrow><\/munder><mo>&#x000D7;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>102<\/mn><mo>&#x02212;<\/mo><mn>100<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>100.86<\/mn><\/mrow><\/math><\/div>\n<p>括號下面標著 0.429 的那一項，就是<strong>卡爾曼增益 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math><\/strong>。卡爾曼濾波器做的事，就是每天把「自己的預測」（甲）和「看到的價格」（乙）這樣結合一次。<\/p>\n<p>這個公式從哪來：把兩個人的說法各畫成一條鐘形曲線，兩條相乘會得到一條更窄的新鐘形曲線，它的中心就是上面算的 100.86。<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 360\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg nb\" aria-label=\"兩條鐘形曲線相乘：預測在 100，量測在 102，結合後的曲線落在 100.86，而且比兩條都窄\">\n<line x1=\"30.0\" x2=\"730.0\" y1=\"300.0\" y2=\"300.0\" class=\"nb-ax\"/>\n<path d=\"M30.0,299.8 L32.9,299.7 L35.8,299.7 L38.8,299.7 L41.7,299.6 L44.6,299.6 L47.5,299.5 L50.4,299.4 L53.3,299.3 L56.2,299.3 L59.2,299.2 L62.1,299.0 L65.0,298.9 L67.9,298.8 L70.8,298.6 L73.8,298.5 L76.7,298.3 L79.6,298.1 L82.5,297.8 L85.4,297.6 L88.3,297.3 L91.3,297.0 L94.2,296.6 L97.1,296.2 L100.0,295.8 L102.9,295.4 L105.8,294.9 L108.7,294.3 L111.7,293.8 L114.6,293.1 L117.5,292.4 L120.4,291.7 L123.3,290.8 L126.3,290.0 L129.2,289.0 L132.1,288.0 L135.0,286.9 L137.9,285.7 L140.8,284.4 L143.7,283.1 L146.7,281.6 L149.6,280.1 L152.5,278.4 L155.4,276.7 L158.3,274.8 L161.2,272.9 L164.2,270.8 L167.1,268.6 L170.0,266.3 L172.9,263.9 L175.8,261.3 L178.8,258.7 L181.7,255.9 L184.6,252.9 L187.5,249.9 L190.4,246.7 L193.3,243.5 L196.2,240.1 L199.2,236.5 L202.1,232.9 L205.0,229.2 L207.9,225.3 L210.8,221.4 L213.8,217.4 L216.7,213.3 L219.6,209.1 L222.5,204.8 L225.4,200.5 L228.3,196.1 L231.2,191.7 L234.2,187.3 L237.1,182.8 L240.0,178.4 L242.9,173.9 L245.8,169.5 L248.8,165.1 L251.7,160.7 L254.6,156.4 L257.5,152.2 L260.4,148.1 L263.3,144.1 L266.3,140.2 L269.2,136.4 L272.1,1 .8,300.0 L668.7,300.0 L671.7,300.0 L674.6,300.0 L677.5,300.0 L680.4,300.0 L683.3,300.0 L686.2,300.0 L689.2,300.0 L692.1,300.0 L695.0,300.0 L697.9,300.0 L700.8,300.0 L703.8,300.0 L706.7,300.0 L709.6,300.0 L712.5,300.0 L715.4,300.0 L718.3,300.0 L721.2,300.0 L724.2,300.0 L727.1,300.0 L730.0,300.0\" class=\"nf-f\"/>\n<text x=\"61.8\" y=\"322.0\" text-anchor=\"middle\" class=\"nb-t\">96<\/text>\n<text x=\"189.1\" y=\"322.0\" text-anchor=\"middle\" class=\"nb-t\">98<\/text>\n<text x=\"316.4\" y=\"322.0\" text-anchor=\"middle\" class=\"nb-t\">100<\/text>\n<text x=\"443.6\" y=\"322.0\" text-anchor=\"middle\" class=\"nb-t\">102<\/text>\n<text x=\"570.9\" y=\"322.0\" text-anchor=\"middle\" class=\"nb-t\">104<\/text>\n<text x=\"698.2\" y=\"322.0\" text-anchor=\"middle\" class=\"nb-t\">106<\/text>\n<text x=\"246.4\" y=\"97.5\" text-anchor=\"middle\" class=\"nf-ta\">甲：預測 100（變異數 1.5）<\/text>\n<text x=\"523.6\" y=\"123.8\" text-anchor=\"middle\" class=\"nf-tb\">乙：看到 102（變異數 2）<\/text>\n<text x=\"370.9\" y=\"30.0\" text-anchor=\"middle\" class=\"nf-tf\">相乘後：100.86（變異數 0.86，更窄）<\/text>\n<line x1=\"370.9\" x2=\"370.9\" y1=\"300.0\" y2=\"40.0\" class=\"nf-mid\"/>\n<text x=\"730\" y=\"352\" text-anchor=\"end\" class=\"nb-n\">依公式畫出；數字和概念頁的例子相同<\/text>\n<\/svg><\/figure>\n<p>見 <a class=\"wl\" href=\"#kalman-gaussian-2012\">用兩條鐘形曲線理解卡爾曼濾波器 2012<\/a>，以及 <a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a> 的「性質二」。<\/p>\n<h3>第 3 層：一個數字的完整公式<\/h3>\n<p>假設：<\/p>\n<ul>\n<li>真正價格每天隨機晃一點，晃動的變異數叫 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Q<\/mi><\/mrow><\/math>（過程雜訊）。<\/li>\n<li>看到的價格 = 真正價格 + 雜訊，雜訊的變異數叫 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><\/mrow><\/math>（量測雜訊）。<\/li>\n<\/ul>\n<p><strong>先看懂符號<\/strong>（全部只有這幾個）：<\/p>\n<table>\n<thead>\n<tr>\n<th>符號<\/th>\n<th>讀法<\/th>\n<th>意思<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math><\/td>\n<td>今天、昨天<\/td>\n<td>下標寫在字母右下角，表示是哪一天的值<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math><\/td>\n<td>y<\/td>\n<td>今天看到的收盤價（量測）<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><\/msub><\/mrow><\/math><\/td>\n<td>x hat<\/td>\n<td>今天真正水位的<strong>估計<\/strong>。帽子 ^ 表示「估計出來的」<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math><\/td>\n<td>P<\/td>\n<td>這個估計有多沒把握（變異數）<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math><\/td>\n<td>x hat minus<\/td>\n<td>右上角的減號表示「<strong>修正前<\/strong>」，也就是只靠預測、還沒看到今天價格時的值<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math><\/td>\n<td>K<\/td>\n<td>卡爾曼增益：今天要往量測走多少比例<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>每天兩步、五條公式：<\/p>\n<p><strong>① 預測<\/strong>（還沒看到今天的價格）<\/p>\n<table>\n<thead>\n<tr>\n<th>公式<\/th>\n<th>白話<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>沒有新資訊，猜「跟昨天一樣」<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><msub><mi>P<\/mi><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><mi>Q<\/mi><\/mrow><\/math><\/td>\n<td>過了一天，真正價格又晃了一下。兩個互不相關的不確定性相加，變異數直接相加（<a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a> 性質一）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>② 修正<\/strong>（看到今天的價格 y）<\/p>\n<table>\n<thead>\n<tr>\n<th>公式<\/th>\n<th>白話<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0002B;<\/mo><mi>R<\/mi><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math><\/td>\n<td>我的猜測有多不可靠，佔全部不可靠的比例<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0002B;<\/mo><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>y<\/mi><mi>t<\/mi><\/msub><mo>&#x02212;<\/mo><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><\/td>\n<td>從猜測往量測走 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math> 的比例<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math><\/td>\n<td>多看了一筆資料，比較有把握了<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mi>t<\/mi><\/msub><mo>&#x02212;<\/mo><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math> 叫<strong>創新值<\/strong>：量到的和猜的差多少，也就是「這次有多意外」。<\/p>\n<p><strong>K 一定在 0 和 1 之間<\/strong>（<a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 第 4.1.2 節）：<\/p>\n<ul>\n<li><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><\/mrow><\/math> 很大（價格很吵）→ <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> → 不太理會新價格。<\/li>\n<li><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>P<\/mi><mo>&#x02212;<\/mo><\/msup><\/mrow><\/math> 很大（自己很沒把握）→ <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math> → 幾乎直接用新價格。<\/li>\n<li><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>P<\/mi><mo>&#x02212;<\/mo><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> → 永遠不更新。所以一開始的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><\/mrow><\/math> 不能設成 0。<\/li>\n<\/ul>\n<h3>第 4 層：Q 和 R 怎麼調<\/h3>\n<p>這兩個數字決定了濾波器的「個性」：<\/p>\n<table>\n<thead>\n<tr>\n<th>你把…<\/th>\n<th>K 會…<\/th>\n<th>估計線會…<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>R 調大<\/td>\n<td>變小<\/td>\n<td>比較平滑，但慢半拍<\/td>\n<\/tr>\n<tr>\n<td>R 調小<\/td>\n<td>變大<\/td>\n<td>反應快，但跟著雜訊亂跳<\/td>\n<\/tr>\n<tr>\n<td>Q 調大<\/td>\n<td>變大<\/td>\n<td>比較相信「價格會變」，跟得比較緊<\/td>\n<\/tr>\n<tr>\n<td>Q 調小<\/td>\n<td>變小<\/td>\n<td>比較相信「價格不太變」，比較平滑<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 用實驗示範：真實雜訊的變異數是 0.01，R 設成 1（大 100 倍）時，濾波器很慢才相信量測；設成 0.0001（小 100 倍）時，很快就相信雜訊很大的量測，估計跟著亂跳。實務上，R 可以事先量（看價格本身有多吵），Q 比較難定，通常要調。<\/p>\n<p><strong>和移動平均的關係<\/strong>：Q、R 固定時，K 會很快穩定成一個固定值（<a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 第 5.1 節）。K 固定之後，「每天往新價格走固定比例」就是<strong>指數移動平均<\/strong>。所以最簡單的卡爾曼濾波器等於一條最佳化過的指數移動平均，這也是 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a> 引用的結論。<\/p>\n<h3>下一步：加入速度<\/h3>\n<p>到這裡為止的模型只追蹤一個數字，它的預測永遠是「跟昨天一樣」，所以給不出漲或跌的方向，還不能拿來交易。加入「速度」、改用矩陣，以及實際拿來交易時每天的流程，在下一頁 <a class=\"wl\" href=\"#kalman-velocity\">卡爾曼濾波器（二）：加入速度與拿來交易<\/a>。<\/p>\n<h2>例子<\/h2>\n<h3>手算一遍<\/h3>\n<p>設定：一開始估計 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mn>0<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mn>0<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Q<\/mi><mo>&#x0003D;<\/mo><mn>0.5<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>。接下來四天看到的價格是 102、101、105、104。（數字是示意，Wiki 用程式驗算過。）<\/p>\n<table>\n<thead>\n<tr>\n<th>天<\/th>\n<th>看到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math><\/th>\n<th>預測 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math><\/th>\n<th><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math><\/th>\n<th><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math><\/th>\n<th>創新值<\/th>\n<th>修正後 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><\/msub><\/mrow><\/math><\/th>\n<th>修正後 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>102<\/td>\n<td>100.00<\/td>\n<td>1.500<\/td>\n<td>0.429<\/td>\n<td>+2.00<\/td>\n<td>100.86<\/td>\n<td>0.857<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>101<\/td>\n<td>100.86<\/td>\n<td>1.357<\/td>\n<td>0.404<\/td>\n<td>+0.14<\/td>\n<td>100.91<\/td>\n<td>0.809<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>105<\/td>\n<td>100.91<\/td>\n<td>1.309<\/td>\n<td>0.395<\/td>\n<td>+4.09<\/td>\n<td>102.53<\/td>\n<td>0.791<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>104<\/td>\n<td>102.53<\/td>\n<td>1.291<\/td>\n<td>0.392<\/td>\n<td>+1.47<\/td>\n<td>103.11<\/td>\n<td>0.785<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>第 1 天：<\/p>\n<ol>\n<li>預測：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mn>1<\/mn><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mn>1<\/mn><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>0.5<\/mn><mo>&#x0003D;<\/mo><mn>1.5<\/mn><\/mrow><\/math><\/li>\n<li>增益：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>1.5<\/mn><\/mrow><mrow><mn>1.5<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>0.429<\/mn><\/mrow><\/math><\/li>\n<li>修正：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>100<\/mn><mo>&#x0002B;<\/mo><mn>0.429<\/mn><mo>&#x000D7;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>102<\/mn><mo>&#x02212;<\/mo><mn>100<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>100.86<\/mn><\/mrow><\/math><\/li>\n<li>新的不確定性：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>0.429<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x000D7;<\/mo><mn>1.5<\/mn><mo>&#x0003D;<\/mo><mn>0.857<\/mn><\/mrow><\/math><\/li>\n<\/ol>\n<p>第 1 天的數字和第 2 層「兩個人報價」完全一樣：甲就是預測（100，變異數 1.5），乙就是看到的價格（102，變異數 R = 2）。<\/p>\n<p>觀察：<\/p>\n<ul>\n<li>價格跳到 102，估計只走到 100.86，因為 R 很大，濾波器懷疑這是雜訊。<\/li>\n<li>K 從 0.429 慢慢降，跑久了穩定在約 0.39。<\/li>\n<\/ul>\n<h3>自己算算看<\/h3>\n<ol>\n<li>預測 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mo>&#x02212;<\/mo><\/msup><mo>&#x0003D;<\/mo><mn>50<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>P<\/mi><mo>&#x02212;<\/mo><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>，看到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>54<\/mn><\/mrow><\/math>。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math>、修正後的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><\/mrow><\/math>、修正後的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><\/mrow><\/math> 各是多少？<\/li>\n<li>同上，但 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><\/mrow><\/math> 改成 12。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><\/mrow><\/math> 變成多少？和第 1 題比，為什麼？<\/li>\n<li>如果 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>P<\/mi><mo>&#x02212;<\/mo><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 呢？<\/li>\n<li>不用算：把 Q 調大，估計線會變得比較平滑還是比較貼價格？<\/li>\n<\/ol>\n<p>答案在本頁最下面。<\/p>\n<h2>出現在哪些來源<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a>：五條公式、K 的兩個極端、R 設錯的實驗、調參數的建議。<\/li>\n<li><a class=\"wl\" href=\"#kalman-gaussian-2012\">用兩條鐘形曲線理解卡爾曼濾波器 2012<\/a>：用兩條鐘形曲線相乘推出修正公式。<\/li>\n<li><a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>：最簡單的卡爾曼濾波器等於最佳化過的指數移動平均。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#variance-normal\">期望值、變異數與常態分布<\/a>：前置知識：這一頁的公式都建立在變異數和鐘形曲線上<\/li>\n<li><a class=\"wl\" href=\"#kalman-velocity\">卡爾曼濾波器（二）：加入速度與拿來交易<\/a>：下一頁：加入速度、矩陣版本、拿來交易<\/li>\n<li><a class=\"wl\" href=\"#kalman-trend\">卡爾曼濾波趨勢策略<\/a>：把卡爾曼濾波器做成交易策略<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：卡爾曼濾波器也能追蹤配對交易裡會慢慢變的比例<\/li>\n<\/ul>\n<hr />\n<p><strong>「自己算算看」的答案<\/strong><\/p>\n<ol>\n<li><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>0.5<\/mn><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mo>&#x0003D;<\/mo><mn>50<\/mn><mo>&#x0002B;<\/mo><mn>0.5<\/mn><mo>&#x000D7;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>52<\/mn><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>0.5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x000D7;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>。<\/li>\n<li><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>12<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>0.25<\/mn><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mo>&#x0003D;<\/mo><mn>50<\/mn><mo>&#x0002B;<\/mo><mn>0.25<\/mn><mo>&#x000D7;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>51<\/mn><\/mrow><\/math>。量測更吵（R 變大），所以只往它走四分之一。<\/li>\n<li><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><\/mrow><\/math> 停在 50。濾波器完全相信自己的預測，不理會任何新價格。<\/li>\n<li>比較貼價格。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Q<\/mi><\/mrow><\/math> 大 → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>P<\/mi><mo>&#x02212;<\/mo><\/msup><\/mrow><\/math> 大 → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math> 大 → 每次往新價格走更多。<\/li>\n<\/ol>", "back": ["kalman-course-2001", "kalman-gaussian-2012", "kalman-trend", "kalman-trend-2016", "kalman-velocity", "me", "variance-normal"], "maybe": []}, "kalman-velocity": {"title": "卡爾曼濾波器（二）：加入速度與拿來交易", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>狀態從一個數字變成「價格＋速度」，濾波器就能從價格的意外推出方向，拿來交易。<\/p>\n<h2>白話解釋<\/h2>\n<p><strong>先讀 <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a><\/strong>：這一頁直接延續它的符號和五條公式。需要會矩陣乘法。<\/p>\n<p>為什麼要加速度？只追蹤價格時，濾波器的預測永遠是「跟昨天一樣」，所以不知道價格要往哪走。加入「速度」之後，預測變成「今天 = 昨天 + 速度」，才有方向可言。<a class=\"wl\" href=\"#kalman-gaussian-2012\">用兩條鐘形曲線理解卡爾曼濾波器 2012<\/a> 的火車例子也是同時追蹤位置和速度。<\/p>\n<h3>拿來交易時，每天在做什麼<\/h3>\n<p>最容易搞混的一點：<strong>量測不是未來的價格，是剛剛收盤、已經看到的價格。<\/strong> 看不到的是另一個東西：每一天（包括今天）「去掉雜訊後的真正水位」。<\/p>\n<table>\n<thead>\n<tr>\n<th>時間<\/th>\n<th>手上有什麼<\/th>\n<th>卡爾曼濾波器在做什麼<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>昨天收盤後<\/td>\n<td>到昨天為止的所有價格<\/td>\n<td>估計<strong>昨天<\/strong>的真正水位：100（不確定性 P）<\/td>\n<\/tr>\n<tr>\n<td>今天開盤前<\/td>\n<td>還沒有今天的價格<\/td>\n<td><strong>預測<\/strong>今天的真正水位：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><msub><mi>P<\/mi><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><mi>Q<\/mi><mo>&#x0003D;<\/mo><mn>1.5<\/mn><\/mrow><\/math>。這是<strong>預測的曲線<\/strong><\/td>\n<\/tr>\n<tr>\n<td>今天收盤<\/td>\n<td>看到今天的收盤價 102<\/td>\n<td>這就是<strong>量測<\/strong>。它是真的看到了，但被當成「真正水位 + 雜訊」。這是<strong>量測的曲線<\/strong>：中心 102，寬度 R = 2<\/td>\n<\/tr>\n<tr>\n<td>今天收盤後<\/td>\n<td>兩條曲線<\/td>\n<td><strong>修正<\/strong>：相乘得到今天的最佳估計 100.86<\/td>\n<\/tr>\n<tr>\n<td>明天開盤前<\/td>\n<td>今天的最佳估計<\/td>\n<td>再<strong>預測<\/strong>明天，拿去下單<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>昨天的價格已經看到了，為什麼還要「估計」昨天？<\/strong> 因為看到的收盤價是「真正水位 + 雜訊」。收在 101 不代表真正水位就是 101，可能只是收盤前有人急著買。所以就算是已經過去的一天，也只能估計它的真正水位。<\/p>\n<p><strong>量測只有一個數字，為什麼也有一條曲線？<\/strong> 曲線表示的是「看到 102 之後，真正水位可能在哪」。如果價格很吵（R 大），真正水位可能離 102 很遠，曲線就寬；如果價格很乾淨（R 小），真正水位就在 102 附近，曲線就窄。<\/p>\n<p><strong>「真正水位」是一個假設，不是事實。<\/strong> GPS 的例子裡，車子真的有一個確切位置。價格沒有：「真正水位 + 雜訊」是我們選的模型，雜訊可以想成買賣價差造成的跳動、短期的隨機買賣。模型選得好不好，要用資料檢驗。<\/p>\n<p><strong>拿來交易的是「下一根的預測」<\/strong>。<a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a> 的程式碼是：每根新 K 棒開始時，拿濾波器對這根的預測，和上一根的收盤價比，高出一點就做多，低一點就做空。所以用到的永遠是已經看到的價格，沒有偷看未來。<\/p>\n<p>上表為了簡單，用的是一個數字的模型。那個模型的預測永遠是「跟昨天的估計一樣」，給不出方向；要能預測「明天比較高」，模型裡必須有<strong>速度<\/strong>，也就是下面的矩陣版本。這是 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a> 從模型 1 就加入速度的原因。<\/p>\n<h3>公式：和一個數字的版本一一對照<\/h3>\n<p>追蹤不只一個數字時（價格<strong>和<\/strong>速度），公式長得一樣，只是數字換成矩陣。左欄是 <a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a> 學過的版本。<\/p>\n<table>\n<thead>\n<tr>\n<th>一個數字<\/th>\n<th>矩陣版本（<a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 表 4.1–4.2）<\/th>\n<th>多了什麼<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><mi>A<\/mi><mspace width=\"0.167em\" /><msub><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 說明狀態怎麼往前走，例如「新價格 = 價格 + 速度」<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><msub><mi>P<\/mi><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><mi>Q<\/mi><\/mrow><\/math><\/td>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><mi>A<\/mi><mspace width=\"0.167em\" /><msub><mi>P<\/mi><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mspace width=\"0.167em\" /><msup><mi>A<\/mi><mo>&#x022A4;<\/mo><\/msup><mo>&#x0002B;<\/mo><mi>Q<\/mi><\/mrow><\/math><\/td>\n<td>不確定性也跟著 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 往前傳；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x022A4;<\/mo><\/msup><\/mrow><\/math> 是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 的轉置<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0002B;<\/mo><mi>R<\/mi><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math><\/td>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><msup><mi>H<\/mi><mo>&#x022A4;<\/mo><\/msup><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>H<\/mi><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><msup><mi>H<\/mi><mo>&#x022A4;<\/mo><\/msup><mo>&#x0002B;<\/mo><mi>R<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math><\/td>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><\/mrow><\/math> 說明「量得到哪個部分」：量得到價格，量不到速度；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x000B7;<\/mo><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 是反矩陣，相當於「除以」<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0002B;<\/mo><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>y<\/mi><mi>t<\/mi><\/msub><mo>&#x02212;<\/mo><msubsup><mover accent=\"true\"><mrow><mi>x<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><\/td>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><msubsup><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0002B;<\/mo><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>y<\/mi><mi>t<\/mi><\/msub><mo>&#x02212;<\/mo><mi>H<\/mi><msubsup><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/td>\n<td>同一個意思<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math><\/td>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>I<\/mi><mo>&#x02212;<\/mo><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mi>H<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math><\/td>\n<td>同一個意思；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><\/mrow><\/math> 是單位矩陣，相當於數字 1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>用「價格 + 速度」的模型為例（類似 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a> 的模型 1），狀態是兩個數字，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><\/mrow><\/math> 長這樣：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>&#x1D431;<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mtext>價格<\/mtext><\/mtd><\/mtr><mtr><mtd><mtext>速度<\/mtext><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x0002C;<\/mo><mspace width=\"1em\" /><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x0002C;<\/mo><mspace width=\"1em\" /><mi>H<\/mi><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><\/mrow><\/math><\/div>\n<p>用矩陣乘法展開 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>&#x1D431;<\/mi><\/mrow><\/math>：第一列是「新價格 = 1 × 價格 + 1 × 速度」，第二列是「新速度 = 0 × 價格 + 1 × 速度」，也就是速度先維持不變。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><mi>&#x1D431;<\/mi><\/mrow><\/math> 只取出價格，因為我們只量得到價格。<\/p>\n<p><a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a> 把 A 寫成 Φ，其他符號相同。<\/p>\n<p>最神奇的地方：<strong>你從來沒量過速度，但濾波器會從「價格一直往同一個方向出乎意料」推出速度<\/strong>。下面的例子會一步一步算給你看。這就是它比移動平均少延遲的原因。<\/p>\n<h2>例子<\/h2>\n<h3>手算一步「價格 + 速度」<\/h3>\n<p>設定（數字是示意，Wiki 用程式驗算過）：<\/p>\n<ul>\n<li>昨天的估計：價格 100、速度 1（每天漲 1），也就是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>100<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><\/mrow><\/math><\/li>\n<li>昨天的不確定性：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0.5<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><\/mrow><\/math>（價格的變異數 1，速度的變異數 0.5）<\/li>\n<li><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Q<\/mi><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>0.1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0.01<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math><\/li>\n<li>今天看到的收盤價：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>103<\/mn><\/mrow><\/math><\/li>\n<\/ul>\n<p><strong>① 預測<\/strong><\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msubsup><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><mi>A<\/mi><mspace width=\"0.167em\" /><msub><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>100<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>101<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><\/mrow><\/math><\/div>\n<p>照速度往前推：預測今天在 101，速度維持 1。<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><mi>A<\/mi><mspace width=\"0.167em\" /><msub><mi>P<\/mi><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mspace width=\"0.167em\" /><msup><mi>A<\/mi><mo>&#x022A4;<\/mo><\/msup><mo>&#x0002B;<\/mo><mi>Q<\/mi><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>1.5<\/mn><\/mtd><mtd><mn>0.5<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0.5<\/mn><\/mtd><mtd><mn>0.5<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>0.1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0.01<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>1.6<\/mn><\/mtd><mtd><mn>0.5<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0.5<\/mn><\/mtd><mtd><mn>0.51<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><\/mrow><\/math><\/div>\n<p>注意右上和左下出現了 0.5：預測之後，價格和速度的誤差<strong>綁在一起<\/strong>了。如果速度估高了，預測的價格也會偏高。這個「綁在一起」就是下一步能推出速度的關鍵。<\/p>\n<p><strong>② 修正<\/strong><\/p>\n<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><msup><mi>H<\/mi><mo>&#x022A4;<\/mo><\/msup><\/mrow><\/math> 只取出左上角的 1.6（價格的不確定性），所以：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>K<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><msup><mi>H<\/mi><mo>&#x022A4;<\/mo><\/msup><\/mrow><mrow><mi>H<\/mi><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><msup><mi>H<\/mi><mo>&#x022A4;<\/mo><\/msup><mo>&#x0002B;<\/mo><mi>R<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>1.6<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>1.6<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0.5<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>0.444<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0.139<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><\/mrow><\/math><\/div>\n<p>創新值：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mi>t<\/mi><\/msub><mo>&#x02212;<\/mo><mi>H<\/mi><msubsup><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><mn>103<\/mn><mo>&#x02212;<\/mo><mn>101<\/mn><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，價格比預測多漲了 2。<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mover accent=\"true\"><mrow><mi>&#x1D431;<\/mi><\/mrow><mo>&#x0005E;<\/mo><\/mover><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>101<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>0.444<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0.139<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><mo>&#x000D7;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mo>&#x0005B;<\/mo><mtable><mtr><mtd><mn>101.89<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1.28<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x0005D;<\/mo><\/mrow><\/math><\/div>\n<p><strong>看第二個數字：速度從 1 變成 1.28。<\/strong> 我們只量了價格，沒有量速度，但價格比預期多漲，濾波器就推論「大概漲得比我以為的快」，把速度往上調。調多少由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math> 的第二格 0.139 決定，而它之所以不是 0，正是因為 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><\/mrow><\/math> 右上角那個 0.5 把價格和速度綁在一起。<\/p>\n<p><strong>③ 拿來交易<\/strong>：明天的預測價是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>101.89<\/mn><mo>&#x0002B;<\/mo><mn>1.28<\/mn><mo>&#x0003D;<\/mo><mn>103.17<\/mn><\/mrow><\/math>，比今天收盤 103 高，照 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a> 的規則（高出一點緩衝才做多），緩衝小於 0.17 就會做多。<\/p>\n<h2>出現在哪些來源<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a>：矩陣版本的公式（表 4.1–4.2）。<\/li>\n<li><a class=\"wl\" href=\"#kalman-gaussian-2012\">用兩條鐘形曲線理解卡爾曼濾波器 2012<\/a>：火車例子，同時追蹤位置和速度。<\/li>\n<li><a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>：模型 1 追蹤價格和速度，以及每根 K 棒拿預測和上一根收盤比的交易程式碼。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a>：上一頁：一個數字的版本與五條公式<\/li>\n<li><a class=\"wl\" href=\"#kalman-trend\">卡爾曼濾波趨勢策略<\/a>：照這一頁的方法做成的交易策略<\/li>\n<li><a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>：模型 1 和交易程式碼的出處<\/li>\n<\/ul>", "back": ["kalman-filter", "kalman-gaussian-2012", "kalman-trend", "kalman-trend-2016", "me"], "maybe": ["variance-normal"]}, "law-of-one-price": {"title": "一價定律", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>同一個東西在不同地方，扣掉搬運成本後應該賣同一個價錢。<\/p>\n<h2>白話解釋<\/h2>\n<p>如果台北一顆蘋果 30 元、台中 20 元，有人就會在台中買、拿去台北賣，直到兩地價格差不多為止。把價格推回一致的人就是<a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>，他們賺的就是「價格不一致」的那段。<\/p>\n<p>所以套利能不能賺錢，取決於兩件事：<\/p>\n<ol>\n<li>價格為什麼會不一致？<\/li>\n<li>是什麼擋住了別人把它推回一致？（速度、成本、資本管制）<\/li>\n<\/ol>\n<p>擋住的東西越難跨過，價差就越大、存在越久。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li><strong>幾乎相同的兩檔股票<\/strong>：配對交易賺的是「近似替代品」暫時定錯的價格。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li><strong>同一家公司的兩種股票<\/strong>：Royal Dutch 和 Shell 分同一份現金流，價格比例卻可以偏離 −36% 到 +20%，擋住別人的是「不知道要等多久」。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li><strong>同一個指數的兩種商品<\/strong>：S&amp;P 500 期貨和 ETF 在毫秒尺度上不同步，擋住別人的是速度。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/li>\n<li><strong>同一個比特幣在不同國家<\/strong>：價差可以到 40%，擋住別人的是資本管制。見 <a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#crypto-arb-2020\">加密貨幣的交易與套利 2020<\/a>、<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：說明為什麼一價定律常常做不到<\/li>\n<li><a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：LTCM 賭 Royal Dutch 和 Shell 會回到一致，卻先倒了<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：配對交易賭的是近似替代品回到一致<\/li>\n<li><a class=\"wl\" href=\"#hft-latency-arb\">高頻延遲套利<\/a>：同一個指數在兩個市場不同步，靠速度套利<\/li>\n<li><a class=\"wl\" href=\"#cross-exchange-arb\">跨交易所套利<\/a>：同一個比特幣在不同國家不同價，被資本管制擋住<\/li>\n<\/ul>", "back": ["arbitrageurs", "cross-exchange-arb", "crypto-arb-2020", "hft-race-2015", "limits-of-arbitrage", "ltcm", "pairs-guide", "pairs-trading", "pairs-trading-2006", "twin-shares-2009", "who-pays"], "maybe": ["transaction-costs", "retail", "bid-ask-spread"]}, "leverage": {"title": "槓桿", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>借錢放大部位：賺的時候放大，虧的時候也一樣放大。<\/p>\n<h2>白話解釋<\/h2>\n<p>配對交易每次賺的價差通常很小。為了讓報酬看起來夠大，套利者會借錢或用保證金，把部位做到自有資金的好幾倍。<\/p>\n<ul>\n<li><strong>槓桿 10 倍<\/strong>：用 1 元本錢做 10 元的部位。部位漲 1%，本錢賺 10%；部位跌 10%，本錢就沒了。<\/li>\n<li><strong>保證金追繳<\/strong>：券商借你錢時，會要求帳上至少留一定比例。虧到低於這個比例，就要補錢，補不出來就被強制平倉。<\/li>\n<\/ul>\n<p>槓桿最危險的地方，不是它讓你虧更多，而是它決定了<strong>你能撐多久<\/strong>。價差最後會收斂也沒用，如果你在收斂前就被迫平倉了。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li><strong>LTCM<\/strong>：1994–1997 年槓桿在 14 到 31 倍之間，1998 年初約 27 倍。27 倍槓桿下，資產只要跌約 3.7%（1 ÷ 27），自有資本就歸零，這是 Wiki 的算術。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>。<\/li>\n<li><strong>雙胞胎股票套利<\/strong>：研究假設一開始要 50% 保證金，結果超過 10% 的部位至少被追繳過一次，很多是在錯價擴大時連續被追繳。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li><strong>理論<\/strong>：已經把資金投滿的套利者，遇到虧損和撤資時沒有餘裕撐住，只能平倉。見 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>、<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>、<a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#limits-of-arbitrage\">套利的極限<\/a>：槓桿決定套利者能撐多久<\/li>\n<li><a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：約 27 倍槓桿的真實後果<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：配對交易每次賺得少，常靠槓桿放大<\/li>\n<\/ul>", "back": ["arbitrageurs", "limits-of-arbitrage", "ltcm", "ltcm-2006", "pairs-guide"], "maybe": []}, "limits-of-arbitrage": {"title": "套利的極限", "type": "concept", "updated": "2026-11-23", "html": "<h2>一句話<\/h2>\n<p>錯價明明存在，套利者卻不敢、或撐不住去修正它，所以錯價可以存在很久。<\/p>\n<h2>白話解釋<\/h2>\n<p>教科書說：只要有錯價，套利者就會進場把它修正掉，所以錯價不會持久。現實中有好幾個東西擋住套利者：<\/p>\n<ol>\n<li><strong>時間<\/strong>：錯價最後會回來，但不知道什麼時候。等待期間要付融資成本，還可能先虧錢。<\/li>\n<li><strong>錢不是自己的<\/strong>：專業套利者管理別人的錢。出資人看到虧損就撤資，即使那時其實是最好的機會。<\/li>\n<li><strong>被迫平倉<\/strong>：保證金被追繳、風險上限被觸發，就得在最差的價位賣出；而大家一起賣，又把價格推得更歪。<\/li>\n<li><strong>別人也在做<\/strong>：太多人持有同樣的部位，一個人被迫賣，所有人一起虧。<\/li>\n<li><strong>關係可能真的變了<\/strong>：配對的兩家公司可能真的不再一樣，價差就永遠不回來。<\/li>\n<\/ol>\n<p>研究配對交易的學者把這些整理成三種「套利風險」：基本面風險、雜訊交易者風險、同步風險（不知道其他套利者何時會一起進場）。見 <a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li><strong>理論<\/strong>：價格偏離越大、機會越好的時候，套利者越容易被出資人撤資、被迫平倉。見 <a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>。<\/li>\n<li><strong>雙胞胎股票<\/strong>：Royal Dutch／Shell 本來就是同一家公司，偏離卻可以到 −36%；有些套利部位要拉將近 9 年，超過一成的部位被追繳過保證金。見 <a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>。<\/li>\n<li><strong>配對交易變薄<\/strong>：1962–2009 年配對交易的利潤一路下降，作者認為套利風險變大最多解釋了 70% 的下降。見 <a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>。<\/li>\n<li><strong>LTCM<\/strong>：Royal Dutch／Shell 的溢價從約 8% 擴大到超過 17%，LTCM 在價差收斂前就被接管，價差到 2001 年才消失。見 <a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a>、<a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#limits-arbitrage-1997\">套利的極限 1997<\/a>、<a class=\"wl\" href=\"#twin-shares-2009\">雙胞胎股票的套利風險 2009<\/a>、<a class=\"wl\" href=\"#pairs-decline-2010\">簡單的配對交易還有用嗎？ 2010<\/a>、<a class=\"wl\" href=\"#ltcm-2006\">LTCM 與套利 2006<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#law-of-one-price\">一價定律<\/a>：理想上價格會一致，這一頁說明為什麼常常做不到<\/li>\n<li><a class=\"wl\" href=\"#leverage\">槓桿<\/a>：槓桿讓套利者更容易被迫平倉<\/li>\n<li><a class=\"wl\" href=\"#ltcm\">LTCM：最會算的人，賭雙胞胎會回來<\/a>：套利極限最有名的真實案例<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：配對交易利潤變薄、可能撐不住，都和這裡有關<\/li>\n<li><a class=\"wl\" href=\"#arbitrageurs\">套利者<\/a>：被這些極限擋住的人<\/li>\n<\/ul>", "back": ["arbitrageurs", "law-of-one-price", "leverage", "limits-arbitrage-1997", "ltcm", "pairs-decline-2010", "pairs-guide", "pairs-trading", "pairs-trading-2006", "twin-shares-2009"], "maybe": []}, "transaction-costs": {"title": "交易成本", "type": "concept", "updated": "2026-11-24", "html": "<h2>一句話<\/h2>\n<p>每買賣一次就要付出去的錢，策略賺的錢要先扣掉它才算數。<\/p>\n<h2>白話解釋<\/h2>\n<p>交易成本有好幾種：<\/p>\n<ul>\n<li><strong>佣金<\/strong>：付給券商的手續費。<\/li>\n<li><strong>買賣價差<\/strong>：同一時間，買進價永遠比賣出價高一點。你一買一賣，就平白損失這個差距。詳見 <a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>。<\/li>\n<li><strong>放空成本<\/strong>：要賣出自己沒有的股票，得先借券，借券要付費，也可能被收回。<\/li>\n<li><strong>速度成本<\/strong>：在高頻交易裡，最大的成本不是手續費，而是專線、機房這些「買速度」的投資。<\/li>\n<\/ul>\n<p>重點是：<strong>交易越頻繁，成本累積越多<\/strong>。一個策略「方向猜對」不夠，賺的幅度要大於成本才有用。<\/p>\n<h2>例子<\/h2>\n<ul>\n<li>動量策略半年換手約 85%，假設單邊成本 0.5%，扣完每年還剩約 9%。見 <a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>。<\/li>\n<li>散戶一來一回付約 3% 佣金加 1% 價差，交易最多的人每年因此輸大盤約 6.5 個百分點。見 <a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>。<\/li>\n<li>配對交易估計一來一回成本約 162 bps，扣完每半年仍有 113–225 bps。見 <a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>。<\/li>\n<li>卡爾曼濾波趨勢策略：一口期貨一來一回只要 4 美元手續費，全年 48 筆交易共 192 美元，成本幾乎可以忽略；但論文沒提滑價。見 <a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a>。<\/li>\n<li>高頻套利每次扣完價差約 0.09 指數點，但要持續投入速度。見 <a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#momentum-1993\">買贏家、賣輸家 1993<\/a>、<a class=\"wl\" href=\"#overtrading-2000\">交易有害你的財富 2000<\/a>、<a class=\"wl\" href=\"#pairs-trading-2006\">配對交易 2006<\/a>、<a class=\"wl\" href=\"#hft-race-2015\">高頻交易軍備競賽 2015<\/a>、<a class=\"wl\" href=\"#kalman-trend-2016\">用卡爾曼濾波器抓趨勢 2016<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#bid-ask-spread\">買賣價差<\/a>：最難避開的一種成本<\/li>\n<li><a class=\"wl\" href=\"#retail\">散戶<\/a>：交易越頻繁，付的成本越多<\/li>\n<li><a class=\"wl\" href=\"#brokers-exchanges\">券商與交易所<\/a>：佣金的收受方<\/li>\n<li><a class=\"wl\" href=\"#pairs-trading\">配對交易<\/a>：扣完約 162 bps 成本後，近年可能所剩無幾<\/li>\n<li><a class=\"wl\" href=\"#bps\">bps<\/a>：成本常用的單位<\/li>\n<\/ul>", "back": ["bid-ask-spread", "bps", "brokers-exchanges", "kalman-trend", "me", "momentum-1993", "overtrading-2000", "pairs-guide", "retail", "who-pays"], "maybe": ["excess-return", "law-of-one-price", "arbitrageurs"]}, "variance-normal": {"title": "期望值、變異數與常態分布", "type": "concept", "updated": "2026-11-24", "html": "<h2>一句話<\/h2>\n<p>期望值是平均落點，變異數是平均晃多遠，常態分布是最常見的晃法：鐘形曲線。<\/p>\n<h2>白話解釋<\/h2>\n<p>這一頁是<a class=\"wl\" href=\"#kalman-filter\">卡爾曼濾波器（一）：直覺與一個數字的版本<\/a> 的前置知識。不需要任何數學背景，從「平均」開始。<\/p>\n<h3>1. 期望值：其實就是平均<\/h3>\n<p>兩檔股票，過去 5 天每天漲跌（%）：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>第 1 天<\/th>\n<th>第 2 天<\/th>\n<th>第 3 天<\/th>\n<th>第 4 天<\/th>\n<th>第 5 天<\/th>\n<th>平均<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A<\/td>\n<td>+3<\/td>\n<td>0<\/td>\n<td>+4<\/td>\n<td>+1<\/td>\n<td>−3<\/td>\n<td><strong>1<\/strong><\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>+2<\/td>\n<td>+1<\/td>\n<td>+2<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td><strong>1<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>平均都是每天漲 1%。<strong>期望值<\/strong>就是「如果一直重複下去，平均會落在哪」。<a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 第 2.3 節的說法：把每種結果乘上它出現的機率，再加起來，例如骰子：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x000D7;<\/mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x000D7;<\/mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002B;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002B;<\/mo><mn>6<\/mn><mo>&#x000D7;<\/mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>3.5<\/mn><\/mrow><\/math><\/div>\n<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 讀作「X 的期望值」，E 是 expected（期望）。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 代表「每次會出現的那個數字」，例如每天的漲跌。<\/p>\n<p>5 天的資料就是把 5 個數字加起來除以 5：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02248;<\/mo><mfrac><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>4<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>5<\/mn><\/msub><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>0<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math><\/div>\n<h3>2. 變異數：平均晃多遠<\/h3>\n<p>A 和 B 平均一樣，但 A 明顯比較「跳」。怎麼用一個數字表示「有多跳」？<\/p>\n<p><strong>第一個想法：每天離平均多遠，取平均。<\/strong> 每天減掉平均 1：<\/p>\n<ul>\n<li>A 的偏離：3−1, 0−1, 4−1, 1−1, −3−1 = +2, −1, +3, 0, −4<\/li>\n<li>加起來：2 − 1 + 3 + 0 − 4 = <strong>0<\/strong><\/li>\n<\/ul>\n<p>偏離有正有負，<strong>一加就抵銷成 0<\/strong>，而且永遠都是 0。這個想法不能用。<\/p>\n<p><strong>第二個想法：先平方，再平均。<\/strong> 平方讓負號消失，而且離得越遠，懲罰越重（偏 4 變成 16，偏 1 只是 1）：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>偏離<\/th>\n<th>偏離的平方<\/th>\n<th>平方的平均 = 變異數<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A<\/td>\n<td>+2, −1, +3, 0, −4<\/td>\n<td>4, 1, 9, 0, 16<\/td>\n<td>30 ÷ 5 = <strong>6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>+1, 0, +1, −1, −1<\/td>\n<td>1, 0, 1, 1, 1<\/td>\n<td>4 ÷ 5 = <strong>0.8<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A 的變異數 6，B 只有 0.8：A 晃得多很多。<\/p>\n<p>這就是你看到的那條公式：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>Var<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>E<\/mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">[<\/mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x02212;<\/mo><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mn>2<\/mn><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">]<\/mo><\/mrow><\/mrow><\/math><\/div>\n<p>由內往外逐字翻譯：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x02212;<\/mo><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 是「每個值減掉平均」；外面的平方是「把它平方」；最外面的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><mo stretchy=\"false\">[<\/mo><mspace width=\"0.278em\" /><mo>&#x000B7;<\/mo><mspace width=\"0.278em\" /><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 是「再取平均」。用 A 的數字代進去：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>Var<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mn>3<\/mn><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mn>0<\/mn><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>30<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math><\/div>\n<p><a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 說，如果一個訊號本來應該是固定的，變異數的大小就告訴你裡面有多少雜訊。<\/p>\n<p>另一個寫法算出來一樣，只是捷徑：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>Var<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>X<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math><\/div>\n<p>A 每天漲跌的平方平均是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>9<\/mn><mo>&#x0002B;<\/mo><mn>0<\/mn><mo>&#x0002B;<\/mo><mn>16<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>9<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>7<\/mn><\/mrow><\/math>，減掉平均的平方 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>1<\/mn><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，得到 6。<\/p>\n<h3>3. 標準差：把單位換回來<\/h3>\n<p>變異數有個缺點：單位被平方了，「6 平方%」很難想像。開根號就換回原本的單位：<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>&#x003C3;<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mo>Var<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msqrt><\/mrow><\/math><\/div>\n<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C3;<\/mi><\/mrow><\/math> 讀作 sigma，就是標準差；變異數因此也常寫成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>&#x003C3;<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。<\/p>\n<ul>\n<li>A 的標準差 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><msqrt><mrow><mn>6<\/mn><\/mrow><\/msqrt><mo>&#x02248;<\/mo><mn>2.45<\/mn><mi>&#x00025;<\/mi><\/mrow><\/math>：A 每天大約在平均附近 ±2.45% 晃。<\/li>\n<li>B 的標準差 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><msqrt><mrow><mn>0.8<\/mn><\/mrow><\/msqrt><mo>&#x02248;<\/mo><mn>0.89<\/mn><mi>&#x00025;<\/mi><\/mrow><\/math>。<\/li>\n<\/ul>\n<p><a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 也是這樣說明：標準差和原本的訊號用同一個單位。你算 z-score 時，就是用「離平均幾個標準差」來衡量一個值有多極端。<\/p>\n<h3>4. 常態分布：最常見的「晃法」<\/h3>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 360\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg nb\" aria-label=\"常態分布的鐘形曲線：中間最高，約 68% 的值落在平均加減 1 個標準差內，約 95% 落在加減 2 個標準差內\">\n<path d=\"M185.6,290.0 L185.6,254.8 L190.4,251.2 L195.3,247.2 L200.1,243.0 L205.0,238.5 L209.9,233.8 L214.7,228.7 L219.6,223.4 L224.4,217.7 L229.3,211.8 L234.2,205.6 L239.0,199.1 L243.9,192.4 L248.8,185.5 L253.6,178.3 L258.5,171.0 L263.3,163.4 L268.2,155.8 L273.1,148.0 L277.9,140.2 L282.8,132.3 L287.6,124.4 L292.5,116.6 L297.4,108.8 L302.2,101.2 L307.1,93.7 L311.9,86.5 L316.8,79.5 L321.7,72.8 L326.5,66.5 L331.4,60.6 L336.3,55.0 L341.1,50.0 L346.0,45.4 L350.8,41.4 L355.7,38.0 L360.6,35.1 L365.4,32.9 L370.3,31.3 L375.1,30.3 L380.0,30.0 L384.9,30.3 L389.7,31.3 L394.6,32.9 L399.4,35.1 L404.3,38.0 L409.2,41.4 L414.0,45.4 L418.9,50.0 L423.8,55.0 L428.6,60.6 L433.5,66.5 L438.3,72.8 L443.2,79.5 L448.1,86.5 L452.9,93.7 L457.8,101.2 L462.6,108.8 L467.5,116.6 L472.4,124.4 L477.2,132.3 L482.1,140.2 L486.9,148.0 L491.8,155.8 L496.7,163.4 L501.5,171.0 L506.4,178.3 L511.2,185.5 L516.1,192.4 L521.0,199.1 L525.8,205.6 L530.7,211.8 L535.6,217.7 L540.4,223.4 L545.3,228.7 L550.1,233.8 L555.0,238.5 L559.9,243.0 L564.7,247.2 L569.6,251.2 L574.4,254.8 L574.4,290.0 Z\" class=\"nb-2\"/>\n<path d=\"M282.8,290.0 L282.8,132.3 L285.2,128.4 L287.6,124.4 L290.1,120.5 L292.5,116.6 L294.9 ,289.6 L730.0,289.6\" class=\"nb-c\"/>\n<line x1=\"30.0\" x2=\"730.0\" y1=\"290.0\" y2=\"290.0\" class=\"nb-ax\"/>\n<line x1=\"185.6\" x2=\"185.6\" y1=\"290.0\" y2=\"296.0\" class=\"nb-ax\"/>\n<text x=\"185.6\" y=\"314.0\" text-anchor=\"middle\" class=\"nb-t\">平均 − 2σ<\/text>\n<line x1=\"282.8\" x2=\"282.8\" y1=\"290.0\" y2=\"296.0\" class=\"nb-ax\"/>\n<text x=\"282.8\" y=\"314.0\" text-anchor=\"middle\" class=\"nb-t\">平均 − 1σ<\/text>\n<line x1=\"380.0\" x2=\"380.0\" y1=\"290.0\" y2=\"296.0\" class=\"nb-ax\"/>\n<text x=\"380.0\" y=\"314.0\" text-anchor=\"middle\" class=\"nb-t\">平均<\/text>\n<line x1=\"477.2\" x2=\"477.2\" y1=\"290.0\" y2=\"296.0\" class=\"nb-ax\"/>\n<text x=\"477.2\" y=\"314.0\" text-anchor=\"middle\" class=\"nb-t\">平均 + 1σ<\/text>\n<line x1=\"574.4\" x2=\"574.4\" y1=\"290.0\" y2=\"296.0\" class=\"nb-ax\"/>\n<text x=\"574.4\" y=\"314.0\" text-anchor=\"middle\" class=\"nb-t\">平均 + 2σ<\/text>\n<text x=\"380.0\" y=\"179.2\" text-anchor=\"middle\" class=\"nb-big\">約 68%<\/text>\n<text x=\"589.0\" y=\"185.7\" text-anchor=\"start\" class=\"nb-t\">到 ±2σ：合計約 95%<\/text>\n<text x=\"380.0\" y=\"22.0\" text-anchor=\"middle\" class=\"nb-t\">最常出現：靠近平均<\/text>\n<text x=\"68.9\" y=\"257.4\" text-anchor=\"middle\" class=\"nb-t\">很少出現<\/text>\n<text x=\"730\" y=\"352\" text-anchor=\"end\" class=\"nb-n\">σ ＝ 標準差。曲線越高，代表那個值越常出現<\/text>\n<\/svg><\/figure>\n<p>把很多次結果畫成圖，常常會長成這個樣子，叫<strong>常態分布<\/strong>，又叫鐘形曲線、高斯分布：<\/p>\n<ul>\n<li>中間最高：最常出現的是接近平均的值。<\/li>\n<li>兩邊對稱往下：離平均越遠，越少出現。<\/li>\n<li>只要知道<strong>平均<\/strong>和<strong>變異數<\/strong>，整條曲線就定了。平均決定曲線中心在哪，變異數決定曲線有多寬。<\/li>\n<li>約 68% 的值落在平均 ±1 個標準差內，約 95% 落在 ±2 個標準差內（Wiki 依常態分布公式驗算的數學事實）。所以 z-score 超過 2 才被當成「少見」。<\/li>\n<\/ul>\n<p>為什麼這麼常見？<a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 第 2.4 節提到：很多小的隨機因素<strong>加在一起<\/strong>，結果會趨近常態分布（中央極限定理）。<\/p>\n<h3>5. 兩個性質，卡爾曼濾波器全靠它們<\/h3>\n<p><strong>性質一：兩個互不相關的不確定性相加，變異數直接相加。<\/strong>\n<a class=\"wl\" href=\"#kalman-course-2001\">卡爾曼濾波器入門講義 2001<\/a> 第 2.4 節：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>X<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>X<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> 互相獨立、都是常態分布時，相加之後也是常態分布，而且<\/p>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>Var<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>X<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>X<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msubsup><mi>&#x003C3;<\/mi><mn>1<\/mn><mn>2<\/mn><\/msubsup><mo>&#x0002B;<\/mo><msubsup><mi>&#x003C3;<\/mi><mn>2<\/mn><mn>2<\/mn><\/msubsup><\/mrow><\/math><\/div>\n<p>→ 這就是卡爾曼濾波器的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>P<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><\/msubsup><mo>&#x0003D;<\/mo><msub><mi>P<\/mi><mrow><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><mi>Q<\/mi><\/mrow><\/math>。昨天的估計本來就有不確定性 P，今天真正的價格又多晃了一下（變異數 Q），兩個加在一起，不確定性就是 P + Q。<\/p>\n<p><strong>性質二：兩條鐘形曲線相乘，還是鐘形曲線，而且更窄。<\/strong><\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 360\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg nb\" aria-label=\"兩條鐘形曲線相乘：預測在 100，量測在 102，結合後的曲線落在 100.86，而且比兩條都窄\">\n<line x1=\"30.0\" x2=\"730.0\" y1=\"300.0\" y2=\"300.0\" class=\"nb-ax\"/>\n<path d=\"M30.0,299.8 L32.9,299.7 L35.8,299.7 L38.8,299.7 L41.7,299.6 L44.6,299.6 L47.5,299.5 L50.4,299.4 L53.3,299.3 L56.2,299.3 L59.2,299.2 L62.1,299.0 L65.0,298.9 L67.9,298.8 L70.8,298.6 L73.8,298.5 L76.7,298.3 L79.6,298.1 L82.5,297.8 L85.4,297.6 L88.3,297.3 L91.3,297.0 L94.2,296.6 L97.1,296.2 L100.0,295.8 L102.9,295.4 L105.8,294.9 L108.7,294.3 L111.7,293.8 L114.6,293.1 L117.5,292.4 L120.4,291.7 L123.3,290.8 L126.3,290.0 L129.2,289.0 L132.1,288.0 L135.0,286.9 L137.9,285.7 L140.8,284.4 L143.7,283.1 L146.7,281.6 L149.6,280.1 L152.5,278.4 L155.4,276.7 L158.3
